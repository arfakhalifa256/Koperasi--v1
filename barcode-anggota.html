<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Data Anggota - Koperasi ARFA</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.3.20/dist/JsBarcode.all.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:#f1f5f9;color:#1f2937;padding-bottom:80px}
header{background:linear-gradient(135deg,#1e90ff,#0f3057);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:998}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:36px;height:36px;border-radius:50%;background:#fff;padding:2px}
.header-icons{display:flex;gap:16px}.header-icons span{cursor:pointer}
.container{max-width:1100px;margin:0 auto;padding:10px}
.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 16px rgba(0,0,0,.06);margin-bottom:12px;border:1px solid #e2e8f0}
.top-action{display:flex;gap:8px;align-items:center;width:100%}.search-box{flex:1;background:#fff;border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:7px;border:1px solid #e2e8f0;min-width:0}.search-box input{border:none;outline:none;flex:1;font-size:12px;background:transparent}
.btn-icon{width:48px;height:48px;border-radius:14px;border:none;background:#0f2a4a;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-tambah{height:48px;padding:0 16px;border-radius:14px;border:none;background:#fff;color:#1e90ff;font-weight:700;font-size:10px;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.btn{padding:10px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px}.btn-primary{background:#1e90ff;color:#fff}.btn-dark{background:#0f3057;color:#fff}.btn-danger{background:#fee2e2;color:#dc2626}
.badge{padding:3px 8px;border-radius:20px;font-size:9px;font-weight:800;display:inline-block}.aktif{background:#dcfce7;color:#16a34a}.keluar{background:#fee2e2;color:#dc2626}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:820px}th{padding:10px;background:#f8fafc;color:#64748b;font-size:10px;text-transform:uppercase;text-align:left}td{padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover{background:#f8fafc}
.code-id{font-weight:800;color:#0f3057}.code-barcode{background:#eff6ff;padding:3px 7px;border-radius:6px;font-weight:700;color:#1e90ff}
.mobile-list{display:none}.m-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}.m-id{font-weight:800;font-size:13px;color:#0f3057}.m-barcode{color:#1e90ff;font-size:10px;font-weight:700}.m-name{font-weight:600;margin-top:3px}.m-info{font-size:11px;color:#64748b;margin-top:3px}
#detailCard{display:none}.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.detail-title{font-size:15px;font-weight:800;color:#0f3057}.detail-close{width:32px;height:32px;border:none;border-radius:10px;background:#f1f5f9;cursor:pointer;display:flex;align-items:center;justify-content:center}.detail-grid{display:grid;grid-template-columns:1fr auto;gap:12px}.member-card{border:2px solid #0f3057;border-radius:14px;padding:14px}.member-id{font-weight:800;color:#0f3057}.member-barcode-text{font-weight:800;color:#1e90ff;font-size:12px;margin-top:3px}.member-name{font-weight:800;font-size:16px;margin-top:10px}.member-info{font-size:12px;margin-top:5px}.member-address{font-size:11px;color:#64748b;margin-top:4px}.qr-box{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;padding:10px;text-align:center;min-width:165px}#qrcodeAnggota{display:flex;justify-content:center;margin:6px 0}.qr-small-text{font-size:9px;color:#64748b;word-break:break-all}.barcode-detail{margin-top:12px;text-align:center}.detail-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:flex-end}.modal.active{display:flex}.modal-box{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:16px;max-height:94vh;overflow-y:auto;margin:0 auto}.modal-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.modal-title-row h3{font-size:17px;color:#0f3057}.close-modal{font-size:22px;cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#f1f5f9}.modal-box label{font-size:11px;font-weight:700;margin:10px 0 4px;display:block}.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:12px;font-size:13px;background:#f8fafc;outline:none}.input-row{display:flex;gap:7px}.input-row input{flex:1}.barcode-preview{text-align:center;border:1px dashed #94a3b8;border-radius:12px;padding:8px;margin-top:8px;background:#f8fafc}
.sidebar{position:fixed;top:0;left:-270px;width:270px;height:100%;background:#0f3057;padding:16px;transition:.3s;z-index:9999}.sidebar.open{left:0}.sidebar-title{color:#fff;margin-bottom:16px;font-size:17px}.sidebar a{display:flex;gap:10px;color:#fff;text-decoration:none;padding:12px;border-radius:12px;margin-bottom:4px;font-size:13px}.sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.12)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:999}.overlay.active{display:block}
.empty{padding:30px 15px;text-align:center;color:#64748b;font-size:12px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(100px);background:#0f3057;color:#fff;padding:11px 16px;border-radius:12px;font-size:11px;font-weight:600;z-index:20000;opacity:0;transition:.3s;pointer-events:none}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:768px){.table-wrap{display:none}.mobile-list{display:block}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="sidebar" class="sidebar"><div class="sidebar-title"><b>Koperasi ARFA</b></div><a href="dashboard.html">🏠 Beranda</a><a href="anggota.html" class="active">👤 Anggota</a><a href="scan.html">📷 Scan</a><a href="#" id="btnLogout">🚪 Logout</a></div><div id="overlay" class="overlay"></div>
<header><div class="brand"><img src="img/icon-192.png" onerror="this.style.display='none'"><span>Data Anggota</span></div><div class="header-icons"><span class="material-icons" onclick="location.href='scan.html'">qr_code_scanner</span><span class="material-icons" onclick="toggleSidebar()">menu</span></div></header>
<div class="container">
<div class="card">
  <div class="top-action"><div class="search-box"><span class="material-icons">search</span><input type="text" id="searchAnggota" placeholder="Cari ID, nama, HP..." autocomplete="off"></div>
   <button class="btn-tambah" onclick="openModal()"><span class="material-icons">person_add</span></button>
  </div>
  <div style="font-size:10px;color:#64748b;margin-top:8px">Total: <b id="totalAnggota">0</b> anggota • ID tetap • Barcode bisa berbeda</div></div>
<div class="table-wrap card"><table><thead><tr><th>ID Anggota</th><th>Barcode</th><th>Nama</th><th>HP</th><th>Status</th><th style="text-align:center">Barcode</th><th>Aksi</th></tr></thead><tbody id="tbodyAnggota"></tbody></table></div>
<div class="mobile-list" id="mobileList"></div>
<div class="card" id="detailCard"><div class="detail-header"><div class="detail-title">Detail Anggota</div><button class="detail-close" onclick="tutupDetail()"><span class="material-icons">close</span></button></div><div id="printArea"><div class="detail-grid"><div class="member-card"><div id="dId" class="member-id"></div><div id="dBarcodeText" class="member-barcode-text"></div><div id="dNama" class="member-name"></div><div id="dHp" class="member-info"></div><div id="dAlamat" class="member-address"></div><div id="dStatus" style="margin-top:8px"></div><div class="barcode-detail"><svg id="barcodeAnggota"></svg></div></div><div class="qr-box"><div style="font-weight:700;font-size:11px">QR ANGGOTA</div><div id="qrcodeAnggota"></div><div id="qrText" class="qr-small-text"></div></div></div></div><div class="detail-actions"><button class="btn btn-primary" onclick="shareWA()">WhatsApp</button><button class="btn btn-primary" onclick="window.print()">🖨️ Cetak</button><button class="btn btn-dark" onclick="editFromDetail()">✏️ Edit</button><button class="btn btn-danger" onclick="keluarkanAnggota(currentDetail?.key)">🚪 Keluar</button><button class="btn btn-danger" onclick="hapusFromDetail()">🗑️ Hapus</button></div></div>
</div>
<div id="modalAnggota" class="modal"><div class="modal-box"><div class="modal-title-row"><h3 id="modalTitle">Tambah Anggota</h3><div class="close-modal" onclick="closeModal()">✕</div></div><label>ID Anggota *</label><input type="text" id="inputIdAnggota" placeholder="AG001"><div style="font-size:9px;color:#64748b;margin-top:3px">Contoh: AG001, AG002</div><label>ID Barcode *</label><div class="input-row"><input type="text" id="inputBarcode" placeholder="AG001"><button type="button" class="btn btn-dark" onclick="buatPreview()">OK</button></div><div class="barcode-preview"><svg id="previewBarcode"></svg><div id="previewText" style="font-size:10px;color:#64748b"></div></div><label>Nama *</label><input type="text" id="inputNama" placeholder="Nama anggota"><label>HP / Telepon</label><input type="text" id="inputHp" placeholder="08xxxxxxxxxx"><label>Alamat</label><textarea id="inputAlamat" rows="2" placeholder="Alamat anggota"></textarea><label>Status</label><select id="inputStatus"><option value="aktif">aktif</option><option value="keluar">keluar</option></select><div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-primary" style="flex:1" onclick="simpanAnggota()" id="btnSimpan">💾 SIMPAN</button><button class="btn btn-dark" style="flex:1" onclick="closeModal()">Batal</button></div><div id="statusSimpan" style="text-align:center;font-size:11px;margin-top:10px;color:#16a34a"></div></div></div>
<div id="toast" class="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,get,set,push,update,remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const BASE_URL="https://koperasiarfa.my.id"; const SCAN_PAGE=BASE_URL+"/cari-anggota.html";
function getScanUrl(barcode){return SCAN_PAGE+"?scan="+encodeURIComponent(String(barcode||"").trim())}
let dataAnggota={},editKey=null,currentDetail=null;
window.toggleSidebar=function(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("overlay").classList.toggle("active")};
document.getElementById("overlay").addEventListener("click",toggleSidebar);
document.getElementById("btnLogout").addEventListener("click",function(e){e.preventDefault();if(confirm("Yakin ingin logout?")){localStorage.clear();location.href="index.html"}});
function showToast(m){const t=document.getElementById("toast");t.innerText=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}
function normalizeId(v){return String(v||"").trim().toUpperCase()}
function getMemberId(a){return normalizeId(a.id||a.idAnggota||a.anggotaId||"")}function getBarcode(a){return String(a.barcode||getMemberId(a)).trim()}
function getNama(a){return String(a.nama||a.name||"").trim()}function getHp(a){return String(a.telepon||a.hp||a.noHp||"").trim()}
function getNextId(){let max=0;Object.values(dataAnggota).forEach(a=>{const m=getMemberId(a).match(/^AG(\d+)$/i);if(m){const n=parseInt(m[1],10);if(n>max)max=n}});return"AG"+String(max+1).padStart(3,"0")}
function idSudahDipakai(id,ex=null){id=normalizeId(id);return Object.entries(dataAnggota).some(([k,a])=>{if(ex&&k===ex)return false;return getMemberId(a)===id})}
function barcodeSudahDipakai(b,ex=null){b=String(b||"").trim().toLowerCase();return Object.entries(dataAnggota).some(([k,a])=>{if(ex&&k===ex)return false;return getBarcode(a).toLowerCase()===b})}
window.openModal=function(key=null){editKey=key;document.getElementById("modalAnggota").classList.add("active");document.getElementById("statusSimpan").innerText="";if(key&&dataAnggota[key]){const a=dataAnggota[key];document.getElementById("modalTitle").innerText="Edit Anggota";document.getElementById("inputIdAnggota").value=getMemberId(a);document.getElementById("inputBarcode").value=getBarcode(a);document.getElementById("inputNama").value=getNama(a);document.getElementById("inputHp").value=getHp(a);document.getElementById("inputAlamat").value=a.alamat||"";document.getElementById("inputStatus").value=a.status||"aktif"}else{document.getElementById("modalTitle").innerText="Tambah Anggota";const nid=getNextId();document.getElementById("inputIdAnggota").value=nid;document.getElementById("inputBarcode").value=nid;document.getElementById("inputNama").value="";document.getElementById("inputHp").value="";document.getElementById("inputAlamat").value="";document.getElementById("inputStatus").value="aktif"}buatPreview()}
window.closeModal=function(){document.getElementById("modalAnggota").classList.remove("active");editKey=null}
window.buatPreview=function(){let bc=document.getElementById("inputBarcode").value.trim();if(!bc)bc=document.getElementById("inputIdAnggota").value.trim();if(!bc)bc="AG001";const svg=document.getElementById("previewBarcode");svg.innerHTML="";try{JsBarcode(svg,bc,{format:"CODE128",width:1.4,height:45,displayValue:true,fontSize:10,margin:5});document.getElementById("previewText").innerText=bc}catch{document.getElementById("previewText").innerText="Barcode tidak valid"}}
document.getElementById("inputBarcode").addEventListener("input",buatPreview);
document.getElementById("inputIdAnggota").addEventListener("input",function(){const bc=document.getElementById("inputBarcode");if(!bc.value.trim())bc.value=this.value.toUpperCase();buatPreview()});
window.simpanAnggota=async function(){const btn=document.getElementById("btnSimpan");const orig="💾 SIMPAN";try{btn.disabled=true;btn.innerText="Menyimpan...";let id=normalizeId(document.getElementById("inputIdAnggota").value);let barcode=document.getElementById("inputBarcode").value.trim();const nama=document.getElementById("inputNama").value.trim();const telepon=document.getElementById("inputHp").value.trim();const alamat=document.getElementById("inputAlamat").value.trim();const status=document.getElementById("inputStatus").value;if(!id){alert("ID anggota wajib diisi.");return}if(!nama){alert("Nama wajib diisi.");return}if(!barcode)barcode=id;if(idSudahDipakai(id,editKey)){alert("ID "+id+" sudah digunakan.");return}if(barcodeSudahDipakai(barcode,editKey)){alert("Barcode "+barcode+" sudah digunakan.");return}const data={id:id,idAnggota:id,barcode:barcode,nama:nama,telepon:telepon,hp:telepon,alamat:alamat,status:status};if(editKey){data.tanggalUpdate=Date.now();await update(ref(db,"anggota/"+editKey),data);showToast("Data diperbarui.")}else{const newRef=push(ref(db,"anggota"));data.tanggalMasuk=Date.now();await set(newRef,data);showToast("Anggota ditambahkan.")}document.getElementById("statusSimpan").innerText="✅ Berhasil";setTimeout(async()=>{closeModal();await loadAnggota()},500)}catch(e){alert("Gagal: "+e.message)}finally{btn.disabled=false;btn.innerText=orig}};

// KELUARKAN 1 KLIK
window.keluarkanAnggota=async function(key){
  if(!key){alert("Pilih anggota dulu");return}
  const a=dataAnggota[key]; if(!a)return;
  const id=getMemberId(a); const nama=getNama(a);
  if(a.status==="keluar"){
    if(!confirm(`Aktifkan kembali ${id} - ${nama}?`)) return;
    await update(ref(db,"anggota/"+key),{status:"aktif",tanggalUpdate:Date.now()});
    showToast(`✅ ${nama} diaktifkan`);
  } else {
    if(!confirm(`Keluarkan ${id} - ${nama}?\nStatus jadi KELUAR`)) return;
    await update(ref(db,"anggota/"+key),{status:"keluar",tanggalKeluar:Date.now(),tanggalUpdate:Date.now()});
    showToast(`🚪 ${nama} dikeluarkan`);
  }
  await loadAnggota();
  if(currentDetail && currentDetail.key===key){
    const snap=await get(ref(db,"anggota/"+key)); if(snap.exists()){currentDetail={key,...snap.val()}; tampilkanDetail(currentDetail)}
  }
}

async function loadAnggota(){
  try{
    const snap=await get(ref(db,"anggota")); const tbody=document.getElementById("tbodyAnggota"); const mobile=document.getElementById("mobileList"); tbody.innerHTML=""; mobile.innerHTML="";
    if(!snap.exists()){dataAnggota={};document.getElementById("totalAnggota").innerText="0";renderEmpty();return}
    dataAnggota=snap.val()||{};
    const list=Object.entries(dataAnggota).map(([k,v])=>({key:k,...v})).sort((a,b)=>getMemberId(a).localeCompare(getMemberId(b),undefined,{numeric:true}));
    document.getElementById("totalAnggota").innerText=list.length;
    renderTable(list); renderMobile(list); checkScanParameter();
  }catch(e){alert("Gagal load: "+e.message)}
}
function renderEmpty(){document.getElementById("tbodyAnggota").innerHTML=`<tr><td colspan="7"><div class="empty">Belum ada data</div></td></tr>`;document.getElementById("mobileList").innerHTML=`<div class="card empty">Belum ada data</div>`}
function renderTable(list){
  const tbody=document.getElementById("tbodyAnggota"); tbody.innerHTML="";
  if(!list.length){tbody.innerHTML=`<tr><td colspan="7"><div class="empty">Tidak ditemukan</div></td></tr>`;return}
  list.forEach(a=>{
    const id=getMemberId(a); const barcode=getBarcode(a); const nama=getNama(a); const hp=getHp(a); const status=a.status||"aktif";
    const bcId="bc_"+Math.random().toString(36).substring(2,9);
    const tr=document.createElement("tr");
    tr.innerHTML=`<td><span class="code-id">${escapeHtml(id)}</span></td><td><span class="code-barcode">${escapeHtml(barcode)}</span></td><td><b>${escapeHtml(nama||"-")}</b></td><td>${escapeHtml(hp||"-")}</td><td><span class="badge ${status==="keluar"?"keluar":"aktif"}">${escapeHtml(status)}</span></td><td style="text-align:center"><svg id="${bcId}" style="width:110px;height:28px"></svg></td><td><div style="display:flex;flex-direction:column;gap:5px"><button class="btn btn-dark" style="padding:6px 9px;font-size:9px" data-edit="${a.key}">✏️ Edit</button><button class="btn btn-danger" style="padding:6px 9px;font-size:9px" data-keluar="${a.key}">${status==="keluar"?"✅ Aktifkan":"🚪 Keluar"}</button></div></td>`;
    tr.addEventListener("click",()=>tampilkanDetail(a));
    tr.querySelector("[data-edit]").addEventListener("click",e=>{e.stopPropagation();openModal(a.key)});
    tr.querySelector("[data-keluar]").addEventListener("click",e=>{e.stopPropagation();keluarkanAnggota(a.key)});
    tbody.appendChild(tr);
    setTimeout(()=>{try{JsBarcode("#"+bcId,barcode,{format:"CODE128",width:1.1,height:26,displayValue:false,margin:0})}catch{}},10);
  });
}
function renderMobile(list){
  const mobile=document.getElementById("mobileList"); mobile.innerHTML="";
  if(!list.length){mobile.innerHTML=`<div class="card empty">Tidak ditemukan</div>`;return}
  list.forEach(a=>{
    const id=getMemberId(a); const barcode=getBarcode(a); const nama=getNama(a); const hp=getHp(a); const status=a.status||"aktif";
    const bcId="mbc_"+Math.random().toString(36).substring(2,9);
    const div=document.createElement("div"); div.className="m-card";
    div.innerHTML=`<div style="flex:1;min-width:0"><div class="m-id">${escapeHtml(id)} <span class="m-barcode">(${escapeHtml(barcode)})</span> <span class="badge ${status==="keluar"?"keluar":"aktif"}">${escapeHtml(status)}</span></div><div class="m-name">${escapeHtml(nama||"-")}</div><div class="m-info">📞 ${escapeHtml(hp||"-")}</div><div style="margin-top:7px"><svg id="${bcId}" style="width:130px;height:32px"></svg></div></div><div style="display:flex;flex-direction:column;gap:5px"><button class="btn btn-dark" style="padding:7px 9px" data-edit-mobile="${a.key}">✏️</button><button class="btn btn-danger" style="padding:7px 9px;font-size:10px" data-keluar-mobile="${a.key}">${status==="keluar"?"✅":"🚪"}</button></div>`;
    div.addEventListener("click",()=>tampilkanDetail(a));
    div.querySelector("[data-edit-mobile]").addEventListener("click",e=>{e.stopPropagation();openModal(a.key)});
    div.querySelector("[data-keluar-mobile]").addEventListener("click",e=>{e.stopPropagation();keluarkanAnggota(a.key)});
    mobile.appendChild(div);
    setTimeout(()=>{try{JsBarcode("#"+bcId,barcode,{format:"CODE128",width:1.2,height:30,displayValue:false,margin:0})}catch{}},10);
  });
}
window.filterAnggota=function(q){const query=String(q||document.getElementById("searchAnggota").value||"").trim().toLowerCase();const list=Object.entries(dataAnggota).map(([k,v])=>({key:k,...v})).filter(a=>{return getMemberId(a).toLowerCase().includes(query)||getBarcode(a).toLowerCase().includes(query)||getNama(a).toLowerCase().includes(query)||getHp(a).toLowerCase().includes(query)});renderTable(list);renderMobile(list)};
document.getElementById("searchAnggota").addEventListener("input",e=>filterAnggota(e.target.value));
window.tampilkanDetail=function(a){currentDetail=a;const id=getMemberId(a);const barcode=getBarcode(a);const nama=getNama(a);const hp=getHp(a);const alamat=a.alamat||"-";const status=a.status||"aktif";document.getElementById("detailCard").style.display="block";document.getElementById("dId").innerText="ID Anggota: "+id;document.getElementById("dBarcodeText").innerText="Barcode: "+barcode;document.getElementById("dNama").innerText=nama||"-";document.getElementById("dHp").innerText="📞 "+(hp||"-");document.getElementById("dAlamat").innerText="📍 "+alamat;document.getElementById("dStatus").innerHTML=`<span class="badge ${status==="keluar"?"keluar":"aktif"}">${escapeHtml(status)}</span>`;const qrC=document.getElementById("qrcodeAnggota");qrC.innerHTML="";const urlQR=getScanUrl(barcode);try{new QRCode(qrC,{text:urlQR,width:140,height:140,correctLevel:QRCode.CorrectLevel.H})}catch{}document.getElementById("qrText").innerText=urlQR;const bSvg=document.getElementById("barcodeAnggota");bSvg.innerHTML="";try{JsBarcode(bSvg,barcode,{format:"CODE128",width:1.3,height:45,displayValue:true,fontSize:10,margin:5})}catch{}document.getElementById("detailCard").scrollIntoView({behavior:"smooth"})};
window.shareWA=function(){if(!currentDetail){showToast("Pilih anggota dulu.");return}const id=getMemberId(currentDetail);const nama=getNama(currentDetail);const barcode=getBarcode(currentDetail);const url=getScanUrl(barcode);const pesan=`Kartu Anggota Koperasi ARFA\n\nID: ${id}\nNama: ${nama}\nBarcode: ${barcode}\n\nLihat Kartu:\n${url}`;window.open("https://wa.me/?text="+encodeURIComponent(pesan),"_blank")};
window.tutupDetail=function(){document.getElementById("detailCard").style.display="none";currentDetail=null};
window.editFromDetail=function(){if(!currentDetail)return;openModal(currentDetail.key)};
window.hapusFromDetail=async function(){if(!currentDetail)return;const nama=getNama(currentDetail);const id=getMemberId(currentDetail);if(!confirm(`Hapus ${id} - ${nama}?`))return;try{await remove(ref(db,"anggota/"+currentDetail.key));showToast("Anggota dihapus.");document.getElementById("detailCard").style.display="none";currentDetail=null;await loadAnggota()}catch(e){alert("Gagal: "+e.message)}};
function checkScanParameter(){const params=new URLSearchParams(location.search);const scan=params.get("scan");if(!scan)return;const sv=decodeURIComponent(scan).trim().toLowerCase();const found=Object.entries(dataAnggota).map(([k,v])=>({key:k,...v})).find(a=>getMemberId(a).toLowerCase()===sv||getBarcode(a).toLowerCase()===sv);if(found){setTimeout(()=>{tampilkanDetail(found);showToast("Ditemukan: "+getNama(found))},300)}}
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
document.getElementById("modalAnggota").addEventListener("click",function(e){if(e.target===this)closeModal()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
loadAnggota();
</script></body>
</html>
