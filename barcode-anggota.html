function normalizeId(value){

  return String(value || "")
    .trim()
    .toUpperCase();

}

========================================================= */

function getMemberId(a){

  return normalizeId(
    a.id ||

    a.anggotaId ||
    a.memberId ||

        const number =
          parseInt(match[1],10);

        if(number > maxNumber){

          maxNumber =
            number;

        }

      }

    });

  return "AG" +
    String(maxNumber + 1)
      .padStart(3,"0");

}


/* =========================================================
   CEK DUPLIKAT ID
========================================================= */

function idSudahDipakai(id,excludeKey=null){

  id =
    normalizeId(id);

  return Object.entries(dataAnggota)
    .some(([key,a])=>{

      if(
        excludeKey &&
        key === excludeKey
      ){
        return false;
      }

      return getMemberId(a) === id;

    });

}


/* =========================================================
   CEK DUPLIKAT BARCODE
========================================================= */

function barcodeSudahDipakai(
  barcode,
  excludeKey=null
){

  barcode =
    String(barcode || "")
      .trim()
      .toLowerCase();

  return Object.entries(dataAnggota)
    .some(([key,a])=>{

      if(
        excludeKey &&
        key === excludeKey
      ){
        return false;
      }

      return getBarcode(a)
        .toLowerCase() === barcode;

    });

}

/* =========================================================
   SIMPAN ANGGOTA
========================================================= */

window.simpanAnggota =
async function(){

  const btn =
    document
      .getElementById("btnSimpan");

  const originalText =
    "💾 SIMPAN";

  try{

    btn.disabled = true;

    btn.innerText =
      "Menyimpan...";


    /* DATA FORM */

    let id =
      normalizeId(
        document
          .getElementById("inputIdAnggota")
          .value
      );

    let barcode =
      document
        .getElementById("inputBarcode")
        .value
        .trim();

    const nama =
      document
        .getElementById("inputNama")
        .value
        .trim();

    const telepon =
      document
        .getElementById("inputHp")
        .value
        .trim();

    const alamat =
      document
        .getElementById("inputAlamat")
        .value
        .trim();

    const status =
      document
        .getElementById("inputStatus")
        .value;


    /* VALIDASI */

    if(!id){

      alert(
        "ID anggota wajib diisi."
      );

      return;

    }

    if(!nama){

      alert(
        "Nama anggota wajib diisi."
      );

      return;

    }

    if(!barcode){

      barcode = id;

    }


    /* VALIDASI ID */

    if(
      idSudahDipakai(
        id,
        editKey
      )
    ){

      alert(
        "ID anggota " +
        id +
        " sudah digunakan."
      );

      return;

    }


    /* VALIDASI BARCODE */

    if(
      barcodeSudahDipakai(
        barcode,
        editKey
      )
    ){

      alert(
        "Barcode " +
        barcode +
        " sudah digunakan."
      );

      return;

    }


    /* DATA YANG DISIMPAN */

    const data = {

      id:id,

      idAnggota:id,

      barcode:barcode,

      nama:nama,

      telepon:telepon,

      hp:telepon,

      alamat:alamat,

      status:status

    };


    /* EDIT */

    if(editKey){

      data.tanggalUpdate =
        Date.now();

      await update(
        ref(
          db,
          "anggota/" +
          editKey
        ),
        data
      );

      showToast(
        "Data anggota berhasil diperbarui."
      );

    }

    /* TAMBAH */

    else{

      const newRef =
        push(
          ref(db,"anggota")
        );

      data.rekening = "";

      data.tanggalMasuk =
        Date.now();

      await set(
        newRef,
        data
      );

      showToast(
        "Anggota berhasil ditambahkan."
      );

    }


    document
      .getElementById("statusSimpan")
      .innerText =
      "✅ Data berhasil disimpan";

    setTimeout(async()=>{

      closeModal();

      await loadAnggota();

    },500);


  }catch(error){

    console.error(error);

    alert(
      "Gagal menyimpan data:\n" +
      error.message
    );

  }finally{

    btn.disabled = false;

    btn.innerText =
      originalText;

  }

};


/* =========================================================
   LOAD ANGGOTA
========================================================= */

async function loadAnggota(){

  try{

    const snap =
      await get(
        ref(db,"anggota")
      );

    const tbody =
      document
        .getElementById("tbodyAnggota");

    const mobile =
      document
        .getElementById("mobileList");

    tbody.innerHTML = "";

    mobile.innerHTML = "";

    if(!snap.exists()){

      dataAnggota = {};

      document
        .getElementById("totalAnggota")
        .innerText = "0";

      renderEmpty();

      return;

    }

    dataAnggota =
      snap.val() || {};


    const list =
      Object.entries(
        dataAnggota
      )
      .map(([key,value])=>({

        key:key,

        ...value

      }))
      .sort((a,b)=>{

        return getMemberId(a)
          .localeCompare(
            getMemberId(b),
            undefined,
            {
              numeric:true
            }
          );

      });


    document
      .getElementById("totalAnggota")
      .innerText =
      list.length;


    renderTable(list);

    renderMobile(list);


    /* CEK SCAN URL */

    checkScanParameter();


  }catch(error){

    console.error(error);

    alert(
      "Gagal mengambil data anggota:\n" +
      error.message
    );

  }

}

/* =========================================================
   SEARCH
========================================================= */

window.filterAnggota =
function(query){

  const q =
    String(
      query ||
      document
        .getElementById("searchAnggota")
        .value ||
      ""
    )
    .trim()
    .toLowerCase();


  const list =
    Object.entries(
      dataAnggota
    )
    .map(([key,value])=>({

      key:key,

      ...value

    }))
    .filter(a=>{

      const id =
        getMemberId(a)
          .toLowerCase();

      const barcode =
        getBarcode(a)
          .toLowerCase();

      const nama =
        getNama(a)
          .toLowerCase();

      const hp =
        getHp(a)
          .toLowerCase();

      return (

        id.includes(q) ||

        barcode.includes(q) ||

        nama.includes(q) ||

        hp.includes(q)

      );

    });


  renderTable(list);

  renderMobile(list);

};


document
  .getElementById("searchAnggota")
  .addEventListener(
    "input",
    function(e){

      filterAnggota(
        e.target.value

    }

/* =========================================================
   QR SCAN PARAMETER
========================================================= */

function checkScanParameter(){

  const params =
    new URLSearchParams(
      location.search
    );

  const scan =
    params.get("scan");


  if(!scan){

    return;

  }


  const scanValue =
    decodeURIComponent(
      scan
    )
    .trim()
    .toLowerCase();


  const found =
    Object.entries(
      dataAnggota
    )
    .map(([key,value])=>({

      key:key,

      ...value

    }))
    .find(a=>{

      const id =
        getMemberId(a)
          .toLowerCase();

      const barcode =
        getBarcode(a)
          .toLowerCase();

      return (

        id === scanValue ||

        barcode === scanValue

      );

    });


  if(found){

    setTimeout(()=>{

      tampilkanDetail(
        found
      );

      showToast(
        "Anggota ditemukan: " +
        getNama(found)
      );

    },300);

  }else{

    setTimeout(()=>{

      showToast(
        "Anggota dengan ID/barcode " +
        scan +
        " tidak ditemukan."
      );

    },300);

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
