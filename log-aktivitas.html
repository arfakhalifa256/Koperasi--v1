<script type="module">

/* =========================================================
   FIREBASE

const firebaseConfig = {

const app =

/* =========================================================
   CEK ADMIN
========================================================= */

const role =
  (localStorage.getItem("role") || "")
    .toLowerCase()
    .trim();

if(role !== "admin"){

  alert(
    "Halaman ini khusus untuk admin."
  );

  location.href =
    "index.html";

}


/* =========================================================
   DATA
========================================================= */

let semuaLog = [];


/* =========================================================
   HELPER RUPIAH
========================================================= */

function rupiah(value){

  const n =
    Number(value || 0);

  return n.toLocaleString(
    "id-ID"
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "-")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   CEK LOG YANG DIPISAHKAN
=========================================================

   Yang tidak ditampilkan di halaman ini:

   1. ARISAN
   2. KWITANSI

   Pemeriksaan dilakukan pada seluruh field
   yang umum digunakan oleh sistem log.

========================================================= */

function isLogYangDipisahkan(data){

  if(!data){

    return false;

  }


  let sumberData = data;


  /*
    Jika data asli Firebase disimpan
    dalam properti raw, ikut periksa.
  */

  if(data.raw){

    try{

      sumberData = {

        ...data,

        ...data.raw

      };

    }catch(error){

      console.warn(
        "Gagal membaca raw log:",
        error
      );

    }

  }


  const nilai = [

    sumberData.aksi,
    sumberData.action,
    sumberData.detail,
    sumberData.keterangan,
    sumberData.sumber,
    sumberData.kategori,
    sumberData.nama,
    sumberData.jenis,
    sumberData.modul,
    sumberData.halaman,
    sumberData.path,
    sumberData.fitur,
    sumberData.tipe,
    sumberData.page,
    sumberData.url,
    sumberData.file,
    sumberData.namaFile,
    sumberData.judul,
    sumberData.deskripsi

  ]
  .filter(v =>

    v !== undefined &&
    v !== null

  )
  .map(v =>

    String(v)
      .trim()
      .toLowerCase()

  )
  .join(" ");


  /* =====================================================
     ARISAN
  ===================================================== */

  const kataArisan = [

    "arisan",
    "setor_arisan",
    "setoran_arisan",
    "arisan_setoran",
    "kocok_arisan",
    "pemenang_arisan",
    "rolet_arisan",
    "putaran_arisan",
    "arisan_kunci"

  ];


  /* =====================================================
     KWITANSI
  ===================================================== */

  const kataKwitansi = [

    "kwitansi",
    "kwitansi_pdf",
    "cetak_kwitansi",
    "print_kwitansi",
    "buat_kwitansi",
    "download_kwitansi",
    "unduh_kwitansi",
    "generate_kwitansi",
    "simpan_kwitansi",
    "pdf_kwitansi",
    "kwitansi_pdf"

  ];


  const arisan =
    kataArisan.some(kata =>
      nilai.includes(kata)
    );


  const kwitansi =
    kataKwitansi.some(kata =>
      nilai.includes(kata)
    );


  return arisan || kwitansi;

}


/* =========================================================
   PARSE WAKTU
========================================================= */

function parseTimestamp(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return 0;

  }


  if(
    typeof value === "number" &&
    !isNaN(value)
  ){

    if(value < 10000000000){

      return value * 1000;

    }

    return value;

  }


  const str =
    String(value).trim();


  if(/^\d+$/.test(str)){

    let n =
      Number(str);

    if(n < 10000000000){

      n *= 1000;

    }

    return n;

  }


  const d =
    new Date(str);


  if(!isNaN(d.getTime())){

    return d.getTime();

  }


  const match =
    str.match(
      /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
    );


  if(match){

    const day =
      Number(match[1]);

    const month =
      Number(match[2]) - 1;

    const year =
      Number(match[3]);

    const hour =
      Number(match[4] || 0);

    const min =
      Number(match[5] || 0);

    const sec =
      Number(match[6] || 0);


    return new Date(
      year,
      month,
      day,
      hour,
      min,
      sec
    ).getTime();

  }


  return 0;

}


/* =========================================================
   FORMAT WAKTU INDONESIA
========================================================= */

function formatWaktu(
  ts,
  fallback
){

  const time =
    parseTimestamp(ts);


  if(!time){

    return fallback || "-";

  }


  const d =
    new Date(time);


  return d.toLocaleString(
    "id-ID",
    {
      timeZone:"Asia/Jakarta",
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );

}


/* =========================================================
   TANGGAL INDONESIA
========================================================= */

function tanggalIndonesia(ts){

  const time =
    parseTimestamp(ts);


  if(!time){

    return "";

  }


  const d =
    new Date(time);


  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Jakarta",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(d);


  let year = "";
  let month = "";
  let day = "";


  parts.forEach(p => {

    if(p.type === "year"){
      year = p.value;
    }

    if(p.type === "month"){
      month = p.value;
    }

    if(p.type === "day"){
      day = p.value;
    }

  });


  return `${year}-${month}-${day}`;

}


/* =========================================================
   NORMALISASI AKSI
========================================================= */

function normalisasiAksi(value){

  let aksi =
    String(value || "LOG")
      .trim()
      .toUpperCase()
      .replace(/\s+/g,"_");


  return aksi || "LOG";

}


/* =========================================================
   CLASS BADGE
========================================================= */

function badgeClass(aksi){

  const a =
    normalisasiAksi(aksi);


  const allowed = [

    "LOGIN",
    "TAMBAH_ANGGOTA",
    "EDIT_ANGGOTA",
    "HAPUS_ANGGOTA",
    "BAYAR_ANGSURAN",
    "KAS_MASUK",
    "KAS_KELUAR",
    "PINJAMAN",
    "CAIR_PINJAMAN",
    "SHU",
    "EDIT_PROFIL",
    "BACKUP"

  ];


  if(
    allowed.includes(a)
  ){

    return "badge-" +
      a
        .toLowerCase()
        .replace(/_/g,"-");

  }


  return "badge-default";

}


/* =========================================================
   TAMBAH LOG
========================================================= */

function tambahLog(data){

  /*
    LOG ARISAN DAN KWITANSI
    TIDAK BOLEH MASUK.
  */

  if(
    isLogYangDipisahkan(data)
  ){

    return false;

  }


  semuaLog.push({

    key:
      data.key || "-",

    sumber:
      data.sumber || "-",

    aksi:
      normalisasiAksi(
        data.aksi
      ),

    username:
      data.username ||
      data.user ||
      data.oleh ||
      "-",

    detail:
      data.detail ||
      data.keterangan ||
      "-",

    role:
      data.role ||
      "-",

    ts:
      parseTimestamp(
        data.ts ??
        data.waktu ??
        data.tanggal
      ),

    waktuOriginal:
      data.waktu ??
      data.tanggal ??
      ""

  });


  return true;

}


/* =========================================================
   LOAD LOG
========================================================= */

window.loadLog =
async function(){

  const tbody =
    document.getElementById(
      "isiTabel"
    );


  tbody.innerHTML = `

    <tr>

      <td
        colspan="6"
        class="loading"
      >
        ⏳ Memuat data log...
      </td>

    </tr>

  `;


  try{

    const [

      snapAktivitas,
      snapLog,
      snapProfil,
      snapShu,
      snapKas

    ] = await Promise.all([

      get(
        ref(
          db,
          "/log_aktivitas"
        )
      ),

      get(
        ref(
          db,
          "/log"
        )
      ),

      get(
        ref(
          db,
          "/log_profil"
        )
      ),

      get(
        ref(
          db,
          "/shu_riwayat"
        )
      ),

      get(
        ref(
          db,
          "/kas/transaksi"
        )
      )

    ]);


    semuaLog = [];


    /* =====================================================
       1. LOG AKTIVITAS
    ===================================================== */

    if(
      snapAktivitas.exists()
    ){

      snapAktivitas.forEach(
        child => {

          const v =
            child.val() || {};


          let detail =
            v.detail ??
            v.keterangan ??
            v.nama ??
            "";


          if(
            !detail &&
            (
              v.nomor ||
              v.jumlah
            )
          ){

            detail =
              `${v.nomor || ""} Rp ${rupiah(v.jumlah || 0)}`;

          }


          tambahLog({

            key:
              child.key,

            sumber:
              "log_aktivitas",

            aksi:
              v.aksi ||
              v.action ||
              "LOG",

            username:
              v.username ||
              v.user ||
              v.oleh ||
              v.namaUser ||
              "-",

            detail:
              detail || "-",

            role:
              v.role || "-",

            ts:
              v.waktu ??
              v.timestamp ??
              v.ts ??
              v.tanggal ??
              0,

            /*
              SIMPAN DATA ASLI
              UNTUK PEMERIKSAAN ARISAN/KWITANSI
            */
            raw:
              v

          });

        }
      );

    }


    /* =====================================================
       2. LOG LAMA
    ===================================================== */

    if(
      snapLog.exists()
    ){

      snapLog.forEach(
        child => {

          const v =
            child.val() || {};


          tambahLog({

            key:
              child.key,

            sumber:
              "log",

            aksi:
              v.aksi ||
              v.action ||
              "LOG",

            username:
              v.user ||
              v.username ||
              v.oleh ||
              "-",

            detail:
              v.keterangan ||
              v.detail ||
              v.aksi ||
              "-",

            role:
              v.role || "-",

            ts:
              v.waktu ??
              v.timestamp ??
              v.ts ??
              v.tanggal ??
              0,

            raw:
              v

          });

        }
      );

    }


    /* =====================================================
       3. LOG PROFIL
    ===================================================== */

    if(
      snapProfil.exists()
    ){

      snapProfil.forEach(
        child => {

          const v =
            child.val() || {};


          tambahLog({

            key:
              child.key,

            sumber:
              "log_profil",

            aksi:
              v.aksi ||
              "EDIT_PROFIL",

            username:
              v.user ||
              v.username ||
              v.oleh ||
              "-",

            detail:
              v.detail ||
              v.keterangan ||
              v.aksi ||
              "Perubahan profil",

            role:
              v.role || "-",

            ts:
              v.waktu ??
              v.timestamp ??
              v.ts ??
              v.tanggal ??
              0,

            raw:
              v

          });

        }
      );

    }


    /* =====================================================
       4. RIWAYAT SHU
       TIDAK DIHAPUS
    ===================================================== */

    if(
      snapShu.exists()
    ){

      snapShu.forEach(
        child => {

          const v =
            child.val() || {};


          tambahLog({

            key:
              child.key,

            sumber:
              "shu_riwayat",

            aksi:
              "SHU",

            username:
              v.oleh ||
              v.username ||
              "admin",

            detail:
              `Bagi SHU ${v.periodeAwal || "-"} s/d ${v.periodeAkhir || "-"} | Rp ${rupiah(v.shuDibagikan || 0)}`,

            role:
              v.role ||
              "admin",

            ts:
              v.tanggalBagi ??
              v.tanggal ??
              v.waktu ??
              0,

            raw:
              v

          });

        }
      );

    }


    /* =====================================================
       5. TRANSAKSI KAS
       TIDAK DIHAPUS OLEH LOG >30 HARI
    ===================================================== */

    if(
      snapKas.exists()
    ){

      snapKas.forEach(
        child => {

          const v =
            child.val() || {};


          let tipe =
            String(
              v.tipe || ""
            ).toLowerCase();


          let kategori =
            String(
              v.kategori || ""
            ).toLowerCase();


          let aksi =
            "KAS_MASUK";


          if(

            tipe === "keluar" ||

            tipe === "biaya" ||

            kategori.includes("keluar") ||

            kategori.includes("biaya")

          ){

            aksi =
              "KAS_KELUAR";

          }


          const identitas =
            v.anggotaId ||
            v.idAnggota ||
            v.memberId ||
            v.sumberKas ||
            "KAS";


          let detailParts = [];


          if(v.keterangan){

            detailParts.push(
              v.keterangan
            );

          }


          if(v.kategori){

            detailParts.push(
              v.kategori
            );

          }


          detailParts.push(
            "Rp " +
            rupiah(
              v.jumlah || 0
            )
          );


          if(v.sumberKas){

            detailParts.push(
              "(" +
              v.sumberKas +
              ")"
            );

          }


          /*
            TRANSAKSI KAS TETAP DITAMPILKAN.

            Jadi apabila ada kata "kwitansi"
            di keterangan transaksi kas,
            transaksi kas TIDAK otomatis hilang.
          */

          tambahLog({

            key:
              child.key,

            sumber:
              "kas/transaksi",

            aksi:
              aksi,

            username:
              identitas,

            detail:
              detailParts.join(
                " - "
              ),

            role:
              v.tipe || "-",

            ts:
              v.tanggal ??
              v.waktu ??
              v.timestamp ??
              0

          });

        }
      );

    }


    /* =====================================================
       URUTKAN TERBARU
    ===================================================== */

    semuaLog.sort(
      (a,b) =>
        (b.ts || 0) -
        (a.ts || 0)
    );


    document.getElementById(
      "totalLog"
    ).innerText =
      semuaLog.length +
      " log";


    renderTabel();


  }catch(error){

    console.error(
      error
    );


    tbody.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="loading"
        >

          ❌ Gagal memuat log

          <br>

          <small>
            ${escapeHTML(
              error.message
            )}
          </small>

        </td>

      </tr>

    `;

  }

};


/* =========================================================
   RENDER TABEL
========================================================= */

function renderTabel(){

  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const filterAksi =
    document
      .getElementById(
        "filterAksi"
      )
      .value
      .trim()
      .toLowerCase();


  const filterTgl =
    document
      .getElementById(
        "filterTgl"
      )
      .value;


  const data =
    semuaLog.filter(
      log => {

        const gabungan = [

          log.username,
          log.aksi,
          log.detail,
          log.sumber,
          log.role

        ]
        .join(" ")
        .toLowerCase();


        const cocokSearch =
          !search ||
          gabungan.includes(
            search
          );


        const cocokAksi =
          !filterAksi ||
          normalisasiAksi(
            log.aksi
          )
          .toLowerCase()
          .includes(
            filterAksi
          );


        const cocokTanggal =
          !filterTgl ||
          tanggalIndonesia(
            log.ts
          ) === filterTgl;


        return (

          cocokSearch &&
          cocokAksi &&
          cocokTanggal

        );

      }
    );


  const tbody =
    document.getElementById(
      "isiTabel"
    );


  if(
    data.length === 0
  ){

    tbody.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty"
        >

          🔍 Tidak ada log
          yang sesuai.

        </td>

      </tr>

    `;

    return;

  }


  const tampil =
    data.slice(
      0,
      500
    );


  let html = "";


  tampil.forEach(
    log => {

      const aksi =
        normalisasiAksi(
          log.aksi
        );


      const badge =
        badgeClass(
          aksi
        );


      const key =
        String(
          log.key || ""
        );


      const keyPendek =
        key.length > 8
          ? key.slice(-8)
          : key;


      html += `

        <tr>

          <td>

            ${escapeHTML(
              formatWaktu(
                log.ts,
                log.waktuOriginal
              )
            )}

            <span class="small">

              ${escapeHTML(
                keyPendek
              )}

            </span>

          </td>


          <td>

            <span
              class="badge ${badge}"
            >

              ${escapeHTML(
                aksi.replace(
                  /_/g,
                  " "
                )
              )}

            </span>

          </td>


          <td>

            ${escapeHTML(
              log.username || "-"
            )}

          </td>


          <td>

            ${escapeHTML(
              log.detail || "-"
            )}

          </td>


          <td>

            <small>

              ${escapeHTML(
                log.sumber || "-"
              )}

            </small>

          </td>


          <td>

            ${escapeHTML(
              log.role || "-"
            )}

          </td>

        </tr>

      `;

    }
  );


  tbody.innerHTML =
    html;


  if(
    data.length > 500
  ){

    tbody.innerHTML += `

      <tr>

        <td
          colspan="6"
          style="
            text-align:center;
            color:#777;
            background:#f8fafc;
          "
        >

          Menampilkan 500 dari
          ${data.length} log.

          Gunakan filter untuk
          mempersempit hasil.

        </td>

      </tr>

    `;

  }

}


/* =========================================================
   HAPUS LOG LAMA
=========================================================

   YANG DIHAPUS:

   /log_aktivitas
   /log
   /log_profil

   YANG TIDAK DIHAPUS:

   /kas/transaksi
   /shu_riwayat
   Data Arisan
   Data Kwitansi

========================================================= */

window.hapusLogLama =
async function(){

  const yakin =
    confirm(

      "Hapus LOG aktivitas yang lebih dari 30 hari?\n\n" +

      "Yang dihapus:\n" +

      "• /log_aktivitas\n" +
      "• /log\n" +
      "• /log_profil\n\n" +

      "Yang TIDAK dihapus:\n" +

      "• /kas/transaksi\n" +
      "• /shu_riwayat\n" +
      "• Data Arisan\n" +
      "• Data Kwitansi\n\n" +

      "Lanjutkan?"

    );


  if(!yakin){

    return;

  }


  const batas =
    Date.now() -
    (
      30 *
      24 *
      60 *
      60 *
      1000
    );


  const sumberYangBolehDihapus = [

    "log_aktivitas",
    "log",
    "log_profil"

  ];


  let jumlahHapus = 0;


  for(
    const log
    of semuaLog
  ){

    if(
      !sumberYangBolehDihapus
        .includes(
          log.sumber
        )
    ){

      continue;

    }


    if(
      !log.ts ||
      log.ts >= batas
    ){

      continue;

    }


    if(
      !log.key ||
      log.key === "-"
    ){

      continue;

    }


    try{

      await remove(

        ref(
          db,
          `/${log.sumber}/${log.key}`
        )

      );


      jumlahHapus++;


    }catch(error){

      console.error(
        "Gagal hapus:",
        log,
        error
      );

    }

  }


  alert(

    `${jumlahHapus} log lama berhasil dihapus.`

  );


  await loadLog();

};


/* =========================================================
   EXPORT CSV
========================================================= */

window.exportCSV =
function(){

  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const filterAksi =
    document
      .getElementById(
        "filterAksi"
      )
      .value
      .trim()
      .toLowerCase();


  const filterTgl =
    document
      .getElementById(
        "filterTgl"
      )
      .value;


  const data =
    semuaLog.filter(
      log => {

        const gabungan = [

          log.username,
          log.aksi,
          log.detail,
          log.sumber,
          log.role

        ]
        .join(" ")
        .toLowerCase();


        const cocokSearch =
          !search ||
          gabungan.includes(
            search
          );


        const cocokAksi =
          !filterAksi ||
          normalisasiAksi(
            log.aksi
          )
          .toLowerCase()
          .includes(
            filterAksi
          );


        const cocokTanggal =
          !filterTgl ||
          tanggalIndonesia(
            log.ts
          ) === filterTgl;


        return (

          cocokSearch &&
          cocokAksi &&
          cocokTanggal

        );

      }
    );


  if(
    data.length === 0
  ){

    alert(
      "Tidak ada data untuk diekspor."
    );

    return;

  }


  let csv =
    "Waktu,Aksi,User,Detail,Sumber,Role\n";


  data.forEach(
    log => {

      const row = [

        formatWaktu(
          log.ts,
          log.waktuOriginal
        ),

        log.aksi || "",

        log.username || "",

        log.detail || "",

        log.sumber || "",

        log.role || ""

      ];


      csv += row

        .map(
          value => {

            return `"${String(value)
              .replace(
                /"/g,
                '""'
              )}"`;

          }
        )

        .join(",")

        + "\n";

    }
  );


  const blob =
    new Blob(

      [
        "\uFEFF" +
        csv
      ],

      {
        type:
          "text/csv;charset=utf-8;"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    `log_arfa_${
      tanggalIndonesia(
        Date.now()
      )
    }.csv`;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  URL.revokeObjectURL(
    url
  );

};
