<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Aktivitas - Koperasi Arfa Sejahtera</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:#f0f6ff;margin:0;padding:15px;color:#333;}
.container{max-width:1100px;margin:0 auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.08);}
h2{text-align:center;color:#0f3057;margin-bottom:20px;font-size:12px}
.header{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;align-items:center;}
.header input, .header select{flex:1;min-width:150px;padding:10px;border:1px solid #ccc;border-radius:8px;font-family:'Poppins';font-size:12px}
.btn{padding:10px 15px;border:none;border-radius:8px;background:#0f3057;color:#fff;font-weight:600;cursor:pointer;}
.btn:hover{background:#1e90ff;}
.btn-danger{background:#dc3545;}
.btn-danger:hover{background:#c82333;}
.table-wrap{overflow-x:auto;max-height:70vh;}
table{width:100%;border-collapse:collapse;font-size:8px;}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap;}
th{background:#0f3057;color:#fff;position:sticky;top:0;}
tr:hover{background:#f8f9fa;}
.badge{padding:4px 8px;border-radius:6px;font-size:8px;font-weight:700;color:#fff;display:inline-block;}
.badge.LOGIN{background:#28a745;}
.badge.DAFTAR{background:#17a2b8;}
.badge.RESET_PASSWORD{background:#ffc107;color:#333;}
.badge.GAGAL_LOGIN{background:#dc3545;}
.badge.TAMBAH_ANGGOTA{background:#0d6efd;}
.badge.EDIT_ANGGOTA{background:#6f42c1;}
.badge.PROSES_KELUAR{background:#fd7e14;}
.badge.AKTIFKAN_ANGGOTA{background:#20c997;}
.badge.PENGAJUAN_PINJAMAN{background:#0d6efd;}
.badge.EDIT_PINJAMAN{background:#6f42c1;}
.badge.HAPUS_PINJAMAN{background:#dc3545;}
.badge.BAYAR_ANGSURAN{background:#10b981;}
.badge.EDIT_ANGSURAN{background:#f59e0b;}
.badge.HAPUS_ANGSURAN{background:#ef4444;}
.badge.KAS_MASUK{background:#16a34a;}
.badge.KAS_KELUAR{background:#dc2626;}
.badge.EDIT_KAS{background:#f59e0b;color:#333;}
.badge.HAPUS_KAS{background:#991b1b;}
.badge.SET_SALDO_AWAL{background:#1d4ed8;}
.badge.RESET_SALDO_AWAL{background:#7f1d1d;}
  .badge.CARI_ANGGOTA{background:#0ea5e9;}
  .loading{text-align:center;padding:20px;color:#777;}

  .small{font-size:8px;color:#888;}
</style>
</head>
<body>

<div class="container">
  <h2>📋 Log Aktivitas Koperasi</h2>
  
  <div class="header">
    <input type="text" id="search" placeholder="Cari Username / UserID / Nama">
    <select id="filterAksi">
      <option value="">Semua Aksi</option>
      <option value="LOGIN">LOGIN</option>
      <option value="GAGAL_LOGIN">GAGAL_LOGIN</option>
      <option value="DAFTAR">DAFTAR</option>
      <option value="RESET_PASSWORD">RESET_PASSWORD</option>
      <option value="TAMBAH_ANGGOTA">TAMBAH_ANGGOTA</option>
      <option value="EDIT_ANGGOTA">EDIT_ANGGOTA</option>
      <option value="PROSES_KELUAR">PROSES_KELUAR</option>
      <option value="AKTIFKAN_ANGGOTA">AKTIFKAN_ANGGOTA</option>
      <option value="SETOR_SIMPANAN">SETOR_SIMPANAN</option>
      <option value="EDIT_SIMPANAN">EDIT_ANGGOTA</option>
      <option value="HAPUS_SIMPANAN">HAPUS_SIMPANAN</option>
      <option value="PENGAJUAN_PINJAMAN">PENGAJUAN_PINJAMAN</option>
      <option value="EDIT_PINJAMAN">EDIT_PINJAMAN</option>
      <option value="HAPUS_PINJAMAN">HAPUS_PINJAMAN</option>
      <option value="BAYAR_ANGSURAN">BAYAR_ANGSURAN</option>
      <option value="EDIT_ANGSURAN">EDIT_ANGSURAN</option>
      <option value="HAPUS_ANGSURAN">HAPUS_ANGSURAN</option>
      <option value="KAS_MASUK">KAS_MASUK</option>
      <option value="KAS_KELUAR">KAS_KELUAR</option>
      <option value="EDIT_KAS">EDIT_KAS</option>
      <option value="HAPUS_KAS">HAPUS_KAS</option>
      <option value="SET_SALDO_AWAL">SET_SALDO_AWAL</option>
      <option value="RESET_SALDO_AWAL">RESET_SALDO_AWAL</option>
      <option value="CARI_ANGGOTA">CARI_ANGGOTA</option>
    </select>
    <button class="btn" onclick="loadLog()">🔄 Refresh</button>
    <button class="btn btn-danger" onclick="hapusLogLama()">🗑️ Hapus >30 Hari</button>
    <button class="btn" onclick="location.href='dashboard.html'">Kembali</button>
  </div>

  <div class="table-wrap">
    <table id="tabelLog">
      <thead>
        <tr>
          <th>Waktu</th>
          <th>Aksi</th>
          <th>UserID</th>
          <th>Username</th>
          <th>Detail / Oleh</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody id="isiTabel">
        <tr><td colspan="6" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let semuaLog = [];

/* CEK LOGIN ADMIN - FIX ke index.html */
const role = localStorage.getItem('role');
if(role !== 'admin'){ 
  alert("Akses ditolak. Halaman khusus admin");
  location.href = 'index.html'; // <--- FIX tadinya login.html
}

/* LOAD LOG - FIX TANPA orderByChild BIAR GAK PERLU INDEX */
window.loadLog = async function(){
  document.getElementById('isiTabel').innerHTML = `<tr><td colspan="6" class="loading">Loading data dari Firebase...</td></tr>`;
  try{
    const snap = await get(ref(db,"/log_aktivitas"));
    
    semuaLog = [];
    if(snap.exists()){
      snap.forEach(child=>{
        semuaLog.push({key: child.key, ...child.val()});
      });
    } else {
      document.getElementById('isiTabel').innerHTML = `<tr><td colspan="6" class="loading">Belum ada log aktivitas. Coba login/daftar dulu.</td></tr>`;
      return;
    }
    
    // Sort manual terbaru di atas, biar gak butuh orderByChild
    semuaLog.sort((a,b)=> (b.waktu||0) - (a.waktu||0));
    renderTabel();

  }catch(err){
    document.getElementById('isiTabel').innerHTML = `<tr><td colspan="6" class="loading">Gagal load: ${err.message}<br><br>Cek Rules Firebase harus .read=true</td></tr>`;
    console.error(err);
  }
}

/* RENDER TABEL + FILTER */
function renderTabel(){
  const search = document.getElementById('search').value.toLowerCase();
  const filter = document.getElementById('filterAksi').value;
  
  let data = semuaLog.filter(log => {
    const gabung = `${log.username||''} ${log.userId||''} ${log.nama||''} ${log.idAnggota||''} ${log.oleh||''}`.toLowerCase();
    const cocokSearch = gabung.includes(search);
    const cocokFilter = filter === '' || log.aksi === filter;
    return cocokSearch && cocokFilter;
  });

  if(data.length === 0){
    document.getElementById('isiTabel').innerHTML = `<tr><td colspan="6" class="loading">Data tidak ditemukan untuk filter ini</td></tr>`;
    return;
  }

  let html = '';
  data.forEach(log=>{
    const detail = log.nama ? `${log.idAnggota||''} - ${log.nama}` : (log.oleh || '-');
    html += `
    <tr>
      <td>${log.waktu_baca || '-'}<div class="small">${log.key.slice(-6)}</div></td>
      <td><span class="badge ${log.aksi}">${log.aksi}</span></td>
      <td>${log.userId || log.idAnggota || '-'}</td>
      <td>${log.username || '-'}</td>
      <td>${detail} ${log.totalBayar ? '<br><b>Rp '+Number(log.totalBayar).toLocaleString('id-ID')+'</b>' : ''}</td>
      <td>${log.role || '-'}</td>
    </tr>
    `;
  });
  document.getElementById('isiTabel').innerHTML = html;
}

/* HAPUS LOG > 30 HARI */
window.hapusLogLama = async function(){
  if(!confirm("Yakin hapus log lebih dari 30 hari?")) return;
  
  const batasWaktu = Date.now() - (30 * 24 * 60 * 60 * 1000);
  let ygDihapus = 0;
  
  for(const log of semuaLog){
    if((log.waktu||0) < batasWaktu){
      try{
        await remove(ref(db, "/log_aktivitas/" + log.key));
        ygDihapus++;
      }catch(e){ console.log(e); }
    }
  }
  alert(`${ygDihapus} log berhasil dihapus`);
  loadLog();
}

document.getElementById('search').addEventListener('input', renderTabel);
document.getElementById('filterAksi').addEventListener('change', renderTabel);

loadLog();
</script>
</body>
</html>
