<html lang="id">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#ffedd5;padding-bottom:90px;font-size:13px}
header{background:linear-gradient(135deg,#1e90ff,#0f3057);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:101}

.btn-primary{background:#1e90ff;color:#fff}.btn-danger{background:#dc2626;color:#fff}.btn-warning{background:#f59e0b;color:#fff}.btn-success{background:#10b981;color:#fff}.btn-dark{background:#0f3057;color:#fff}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:center;align-items:center;z-index:2000;padding:15px}.modal.show{display:flex}
.modal-content{background:#fff;width:95%;max-width:560px;border-radius:16px;padding:18px;max-height:92vh;overflow:auto}

.badge-sudah{background:#dcfce7;color:#166534;padding:3px 8px;border-radius:8px;font-size:9px;font-weight:700;border:1px solid #bbf7d0}
.badge-belum{background:#fef3c7;color:#92400e;padding:3px 8px;border-radius:8px;font-size:9px;font-weight:700;border:1px solid #fde68a}

<body>
<header><div>ANGSURAN V5 NOTA OTOMATIS</div><div onclick="location.href='dashboard.html'">🏠</div></header>
<div class="container">
<div class="card">
<h2 style="text-align:center;font-size:14px;background:#ffedd5;padding:10px;border-radius:10px">Input Angsuran + Bukti + Nota Otomatis</h2>
<div style="background:#dcfce7;padding:10px;border-radius:10px;font-size:10px;margin:10px 0">✅ V5: Nota otomatis buka tab baru persis SS Pinjaman | Simpan ke riwayat | Tanpa iframe gabung</div>

<div class="form-group" style="position:relative">
<label>Pilih Peminjam (ketik nama)</label>
<input type="text" id="pinjamanSearch" placeholder="🔍 Ketik nama... " autocomplete="off" style="font-weight:600">
<div id="pinjamanList" style="position:absolute;top:66px;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;max-height:240px;overflow:auto;display:none;z-index:100;box-shadow:0 8px 20px rgba(0,0,0,.15)"></div>
<input type="hidden" id="pinjamanSelect">
<div id="pinjamanTerpilih" style="margin-top:8px;background:#eff6ff;padding:8px 10px;border-radius:8px;font-size:11px;display:none"></div>

<div class="form-group"><label>Metode</label><select id="metode"><option value="">Pilih</option><option value="cash">Cash</option><option value="bank">Bank / Transfer</option></select></div>
<div class="form-group"><label>Tagihan Bulan Ini</label><input type="text" id="tagihan" disabled></div>
<div class="form-group"><label>Jumlah Bayar</label><input type="text" id="jumlahBayar" placeholder="Rp 0"></div>
<div class="form-group"><label>Pokok (auto)</label><input type="text" id="pokok" disabled></div>
<div class="form-group"><label>Jasa (auto)</label><input type="text" id="jasa" disabled></div>
<div class="form-group"><label>Sukarela (auto)</label><input type="text" id="simpanan" disabled></div>
<div class="form-group" id="groupBukti" style="background:#fffbeb;border:2px dashed #f59e0b;padding:14px;border-radius:14px;display:none">
<label>📎 Bukti Transfer (wajib kalau Bank)</label><input type="file" id="buktiTransfer" accept="image/*"><div id="previewBukti"></div><input type="hidden" id="buktiBase64">
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:#eff6ff;padding:12px;border-radius:12px;text-align:center;margin-top:10px;font-size:11px">
<div>Total Bayar<br><b id="totalBayar">Rp0</b></div><div>Sisa Pokok<br><b id="sisaPokok">Rp0</b></div><div>Sisa TOTAL<br><b id="sisaTotal" style="color:#dc2626">Rp0</b></div>
</div>
<div style="display:flex;gap:10px;margin-top:12px"><button class="btn-primary" id="btnSimpan" style="flex:1">💾 Simpan + Nota Otomatis</button><button class="btn-warning" id="btnNota" disabled style="flex:1">🧾 Nota</button></div>
<button id="btnRiwayat" style="width:100%;margin-top:10px;background:#fee2e2;padding:12px;border-radius:10px;border:none">📋 Riwayat Terbaru</button>
</div>
</div>

<div id="modalRiwayat" class="modal"><div class="modal-content"><div style="display:flex;justify-content:space-between"><h2>Riwayat</h2><button id="btnCloseRiwayat" style="background:#dc2626;color:#fff;padding:5px 10px;border-radius:6px;border:none">✕</button></div><div id="listTransaksi" class="list" style="margin-top:12px"></div></div></div>

<div id="modalEditAngsuran" class="modal"><div class="modal-content">
<div style="display:flex;justify-content:space-between"><h2>✏️ Edit / Bukti</h2><button id="btnCloseEdit" style="background:#dc2626;color:#fff;padding:6px 12px;border-radius:8px;border:none">✕</button></div>
<input type="hidden" id="editAngsuranId">
<div class="form-group"><label>Nama</label><input type="text" id="editAngsuranNama" disabled></div>
<div class="form-group"><label>Tanggal</label><input type="date" id="editAngsuranTanggal"></div>
<div class="form-group"><label>Metode</label><select id="editAngsuranMetode"><option value="cash">Cash</option><option value="bank">Bank</option></select></div>
<div class="form-group"><label>Jumlah Bayar</label><input type="text" id="editJumlahBayar"></div>
<div class="form-group" style="background:#fffbeb;border:2px dashed #f59e0b;padding:12px;border-radius:12px">
<label>📎 Bukti Saat Ini</label>
<div id="editPreviewBukti" style="text-align:center;min-height:60px;background:#fff;border-radius:10px;padding:10px;border:1px solid #fde68a"></div>
<div style="display:flex;gap:6px;margin-top:8px"><button class="btn-primary" id="btnLihatFull" style="flex:1">🔍 Lihat</button><button class="btn-success" id="btnSimpanGambar" style="flex:1">💾 Gambar</button><button class="btn-danger" id="btnHapusGambar" style="flex:1">🗑️ Hapus</button></div>

</div>

</div></div>

<!-- POPUP NOTA OTOMATIS -->
<div id="popupNota" class="modal"><div class="modal-content" style="max-width:400px;text-align:center">
  <h3 id="judulNota" style="font-size:14px">Nota Siap</h3>
  <div style="background:#f8fafc;border:2px dashed #cbd5e1;border-radius:12px;padding:18px;margin:14px 0">
    <div style="font-size:38px">📄</div>
    <b id="namaNotaPreview" style="font-size:12px"></b><br>
    <small id="statusNota" style="font-size:11px;color:#166534"></small>
  </div>
  <div style="display:flex;gap:8px"><button class="btn-dark" id="btnBukaNota" style="flex:1">👁️ Buka PDF</button><button class="btn-success" id="btnDownloadNota" style="flex:1">📥 Download</button></div>
  <div style="display:flex;gap:8px;margin-top:8px"><button class="btn-primary" id="btnSimpanNota" style="flex:1">☁️ Simpan ke Riwayat</button><button class="btn-cancel" onclick="document.getElementById('popupNota').classList.remove('show')" style="flex:1;background:#e5e7eb">Tutup</button></div>
</div></div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, push, get, update as updateData } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let dataPinjaman={}, dataAngsuran={}, dataAnggotaCache={}, pinIdAktif=null;
const pinjamanRef=ref(db,"pinjaman"); const angsuranRef=ref(db,"angsuran"); const kasRef=ref(db,"kas/transaksi");
function rupiah(n){return Number(n||0).toLocaleString("id-ID",{style:"currency",currency:"IDR"})}
function rp(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function getNumber(v){return parseInt(String(v||"").replace(/\D/g,""))||0}
function showToast(m,e=false){const t=document.getElementById("toast");t.innerText=m;t.className="toast show"+(e?" error":"");setTimeout(()=>t.className="toast",3500)}
function tanggalInputKeTimestamp(v){if(!v) return Date.now(); const p=v.split("-"); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]),12,0,0,0).getTime()}
function timestampKeTanggalInput(ts){if(!ts) return ""; const d=new Date(Number(ts)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

onValue(ref(db,"anggota"), s=>{dataAnggotaCache={}; s.forEach(d=>{dataAnggotaCache[d.key]={key:d.key,...(d.val()||{})}}); loadPinjaman()});
onValue(pinjamanRef, s=>{dataPinjaman={}; s.forEach(d=>{const v=d.val(); if(!v) return; dataPinjaman[d.key]={id:d.key,key:d.key,...v}}); loadPinjaman()});
onValue(angsuranRef, s=>{dataAngsuran={}; s.forEach(d=>{const v=d.val(); if(!v) return; dataAngsuran[d.key]={id:d.key,...v}}); loadPinjaman(); renderRiwayat()});

async function getAnggotaByPinjaman(pid){
  const p=dataPinjaman[pid]; if(!p) return {key:pid,idAnggota:"-",nama:"",telepon:""};
  const kandidat=[p.anggotaId,p.idAnggota].filter(Boolean).map(v=>String(v).trim());
  for(const k in dataAnggotaCache){const ag=dataAnggotaCache[k]; if(kandidat.includes(k)||kandidat.includes(String(ag.idAnggota||""))){return {key:k,idAnggota:ag.idAnggota||k,nama:ag.nama||p.nama||"",telepon:ag.telepon||""}}}
  return {key:p.anggotaId||pid,idAnggota:p.idAnggota||"-",nama:String(p.nama||"").replace(/ -$/,"").trim(),telepon:""};
}
function getSisaPinjaman(id,excludeId=null){
  const p=dataPinjaman[id]; if(!p) return {sisaPokok:0,sisaJasa:0,bayarPokok:0,bayarJasa:0,sisaTotal:0,totalPinjam:0,totalBayar:0};
  let bayarPokok=0,bayarJasa=0;
  Object.values(dataAngsuran).forEach(a=>{ if(!a||a.id===excludeId) return; if(String(a.pinjamanId||"")===id){bayarPokok+=Number(a.pokok||0); bayarJasa+=Number(a.jasa||0)}});
  const totalPokok=Number(p.jumlah||0); const totalJasa=Number(p.jasa||0);
  const sisaPokok=Math.max(0,totalPokok-bayarPokok); const sisaJasa=Math.max(0,totalJasa-bayarJasa);
  return {sisaPokok,sisaJasa,bayarPokok,bayarJasa,sisaTotal:sisaPokok+sisaJasa,totalPinjam:totalPokok+totalJasa,totalBayar:bayarPokok+bayarJasa};
}
function hitungTagihanBerjalan(id,excludeId=null){
  const p=dataPinjaman[id]; if(!p) return {pokokTagihan:0,jasaTagihan:0,sisaPokok:0,sisaJasa:0};
  const {sisaPokok,sisaJasa}=getSisaPinjaman(id,excludeId);
  const pokokBulan=Number(p.angsuranPokok||Math.ceil(Number(p.jumlah||0)/Number(p.tenor||1)));
  const jasaBulan=Math.round(pokokBulan*0.20);
  return {pokokTagihan:Math.min(pokokBulan,sisaPokok),jasaTagihan:sisaPokok<=0?sisaJasa:Math.min(jasaBulan,sisaJasa),sisaPokok,sisaJasa};
}
let listPinjamanCache=[];
function loadPinjaman(){
  const listDiv=document.getElementById("pinjamanList");
  const searchInput=document.getElementById("pinjamanSearch");
  if(!listDiv||!searchInput) return;
  listPinjamanCache = Object.entries(dataPinjaman).filter(([id,p])=>p&&p.nama).sort((a,b)=>Number(b[1].tanggal||0)-Number(a[1].tanggal||0)).map(([id,p])=>{
    const s=getSisaPinjaman(id); return {id, nama:String(p.nama).replace(/ -$/,"").trim(), nomor:p.nomor||id.slice(0,6),...s, lunas:s.sisaTotal<=0};
  });
  function renderList(filter=""){
    const f=filter.toLowerCase().trim();
    let filtered = f? listPinjamanCache.filter(x=> x.nama.toLowerCase().includes(f)||x.nomor.toLowerCase().includes(f)) : listPinjamanCache.filter(x=>!x.lunas);
    if(filtered.length===0){ listDiv.innerHTML=`<div style="padding:14px;text-align:center;color:#94a3b8">Tidak ketemu "${filter}"</div>`; return; }
    let html="";
    filtered.slice(0,30).forEach(x=>{
      html+=`<div class="p-item" data-id="${x.id}"><div><b>${x.nama}</b> <small>(${x.nomor})</small><br><small>Sisa TOTAL <b style="color:#dc2626">${rupiah(x.sisaTotal)}</b></small></div><div><span style="font-size:9px;background:#dcfce7;padding:2px 6px;border-radius:6px">${Math.round(x.totalPinjam>0?x.totalBayar/x.totalPinjam*100:0)}%</span></div></div>`;
    });
    listDiv.innerHTML=html;
    listDiv.querySelectorAll(".p-item").forEach(el=>{ el.onclick=()=>pilihPeminjam(el.dataset.id); });
  }
  searchInput.onfocus=()=>{ listDiv.style.display="block"; renderList(searchInput.value); };
  searchInput.oninput=()=>{ listDiv.style.display="block"; renderList(searchInput.value); };
  document.addEventListener("click",(e)=>{ if(!e.target.closest("#pinjamanSearch")&&!e.target.closest("#pinjamanList")) listDiv.style.display="none"; });
  renderList("");
}
window.pilihPeminjam=function(id){
  const x=listPinjamanCache.find(v=>v.id===id); if(!x) return;
  pinIdAktif=id;
  document.getElementById("pinjamanSelect").value=id;
  document.getElementById("pinjamanSearch").value=x.nama;
  document.getElementById("pinjamanList").style.display="none";
  const box=document.getElementById("pinjamanTerpilih"); box.style.display="block";
  box.innerHTML=`✅ <b>${x.nama}</b> (${x.nomor}) | Sisa TOTAL <b style="color:#dc2626">${rupiah(x.sisaTotal)}</b>`;
  updateInfo();
}
function kompresFoto(file,cb){
  const r=new FileReader(); r.onload=e=>{
    const img=new Image(); img.onload=()=>{
      const c=document.createElement("canvas"); const maxW=900; const sc=Math.min(1,maxW/img.width); c.width=img.width*sc; c.height=img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); cb(c.toDataURL("image/jpeg",0.65));
    }; img.src=e.target.result;
  }; r.readAsDataURL(file);
}
let jumlahBayarEl=document.getElementById("jumlahBayar"), pokokEl=document.getElementById("pokok"), jasaEl=document.getElementById("jasa"), simpananEl=document.getElementById("simpanan"), tanggalEl=document.getElementById("tanggal"), metodeEl=document.getElementById("metode");
jumlahBayarEl.addEventListener("input",function(){let a=this.value.replace(/\D/g,""); this.value=a?"Rp "+Number(a).toLocaleString("id-ID"):""; hitungAlokasi()});
metodeEl.addEventListener("change",function(){ const g=document.getElementById("groupBukti"); if(this.value==="bank"){g.style.display="block"}else{g.style.display="none"; document.getElementById("buktiBase64").value=""; document.getElementById("previewBukti").innerHTML=""}});
document.getElementById("buktiTransfer").addEventListener("change",function(e){
  const file=e.target.files[0]; if(!file) return;
  document.getElementById("previewBukti").innerHTML="⏳ Kompres...";
  kompresFoto(file,b64=>{document.getElementById("buktiBase64").value=b64; document.getElementById("previewBukti").innerHTML=`<img src="${b64}" style="width:100%;max-width:250px;border-radius:12px;border:2px solid #10b981"><br><small>✅ ${Math.round(b64.length/1024)}KB</small>`});
});
function updateInfo(){
  if(!pinIdAktif){document.getElementById("tagihan").value=""; jumlahBayarEl.value=""; pokokEl.value=""; jasaEl.value=""; simpananEl.value=""; document.getElementById("totalBayar").innerText=rupiah(0); document.getElementById("sisaPokok").innerText=rupiah(0); document.getElementById("sisaTotal").innerText=rupiah(0); return}
  const {pokokTagihan,jasaTagihan,sisaPokok}=hitungTagihanBerjalan(pinIdAktif);
  const {sisaTotal}=getSisaPinjaman(pinIdAktif);
  document.getElementById("tagihan").value=rupiah(pokokTagihan+jasaTagihan);
  document.getElementById("sisaPokok").innerText=rupiah(sisaPokok); document.getElementById("sisaTotal").innerText=rupiah(sisaTotal); hitungAlokasi();
}
function hitungAlokasi(){
  if(!pinIdAktif) return;
  const bayar=getNumber(jumlahBayarEl.value); const {pokokTagihan,jasaTagihan}=hitungTagihanBerjalan(pinIdAktif); const wajib=pokokTagihan+jasaTagihan; let p=0,j=0,s=0;
  if(bayar<=wajib){p=Math.min(bayar,pokokTagihan); j=Math.min(bayar-p,jasaTagihan)}else{p=pokokTagihan; j=jasaTagihan; s=bayar-wajib}
  pokokEl.value=rupiah(p); jasaEl.value=rupiah(j); simpananEl.value=rupiah(s); document.getElementById("totalBayar").innerText=rupiah(bayar);
}
function buatPayloadKas(jumlah,kategori,tanggal,metode,aId,agId,idAnggota,nama){return {jumlah:Number(jumlah||0),kategori,tipe:"masuk",sumberKas:metode||"cash",tanggal:Number(tanggal),keterangan:`Angsuran ${nama||""}`.trim(),angsuranId:aId||"",anggotaId:agId||"",idAnggota:idAnggota||"",nama:nama||"",dibuatPada:Date.now()}}
async function cariSemuaKasAngsuran(aId){ try{const snap=await get(kasRef); const data=snap.val()||{}; const h=[]; for(const k in data){if(String(data[k].angsuranId||"")===String(aId)) h.push(k)} return h}catch(e){return []} }

// ===== NOTA OTOMATIS - PERSIS SS PINJAMAN =====
let tempNotaBase64=null, tempNotaBlobUrl=null, tempNotaId=null;
function dataURLToBlob(dataurl){try{const arr=dataurl.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]); let n=bstr.length; const u8arr=new Uint8Array(n); while(n--){u8arr[n]=bstr.charCodeAt(n);} return new Blob([u8arr],{type:mime});}catch(e){return null;}}
function revokeTempBlob(){if(tempNotaBlobUrl){URL.revokeObjectURL(tempNotaBlobUrl); tempNotaBlobUrl=null;}}

function cetakNotaAngsuran(id, autoOpen=true){
  const a=dataAngsuran[id]; if(!a) return;
  const p=dataPinjaman[a.pinjamanId]||{};
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:[80,200]}); let y=6;
  const tglIndo=t=>new Date(Number(t)).toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  const tglJam=new Date().toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  function dashedLine(yy){doc.setLineDash([1.5,1.5],0); doc.line(4,yy,76,yy); doc.setLineDash([]);}
  function dashedRect(){doc.setLineDash([1.2,1.2],0); doc.rect(2,2,76,190); doc.setLineDash([]);}
  function row(l,r,bold=false,size=9){doc.setFontSize(size); doc.setFont("helvetica",bold?"bold":"normal"); doc.text(l,6,y); doc.text(r,74,y,{align:"right"}); y+=5;}
  dashedRect();
  doc.setFontSize(12); doc.setFont("helvetica","bold"); doc.text("KOPERASI ARFA DRIVER",40,y,{align:"center"}); y+=6;
  doc.setFontSize(10); doc.text("BUKTI PEMBAYARAN ANGSURAN",40,y,{align:"center"}); y+=8; dashedLine(y); y+=7;
  row("No Pinjam", p.nomor||a.idPinjaman||"-");
  row("Tanggal", tglIndo(a.tanggal));
  row("Nama", a.nama||"-");
  row("No Anggota", a.idAnggota||"-");
  row("Metode", (a.metode||"-").toUpperCase());
  y+=2; dashedLine(y); y+=7;
  doc.setFontSize(11); doc.setFont("helvetica","bold"); doc.text("RINCIAN",6,y); y+=6;
  doc.setFontSize(9); doc.setFont("helvetica","normal");
  row("Jumlah Bayar", rp(a.jumlahBayar));
  row("Pokok", rp(a.pokok));
  row("Jasa", rp(a.jasa));
  if(a.bayarSimpanan>0) row("Sukarela", rp(a.bayarSimpanan));
  y+=2; dashedLine(y); y+=8;
  doc.setFontSize(12); doc.setFont("helvetica","bold");
  doc.text("TOTAL BAYAR",6,y); doc.text(rp(a.jumlahBayar),74,y,{align:"right"}); y+=6;
  const sisa=getSisaPinjaman(a.pinjamanId).sisaTotal;
  doc.setFontSize(9); doc.text(`Sisa TOTAL: ${rp(sisa)}`,6,y); y+=8; dashedLine(y); y+=8;
  if(a.buktiBase64){ try{ doc.setFontSize(8); doc.text("Bukti Transfer:",6,y); y+=4; doc.addImage(a.buktiBase64,'JPEG',6,y,68,30); y+=35; }catch(e){} dashedLine(y); y+=6; }
  doc.setFontSize(8); doc.setFont("helvetica","normal");
  doc.text("- Simpan sebagai bukti sah -",40,y,{align:"center"}); y+=5;
  doc.setFont("helvetica","bold"); doc.text("Terima kasih",40,y,{align:"center"}); y+=5;
  doc.setFont("helvetica","normal"); doc.text(tglJam,40,y,{align:"center"});

  const blob=doc.output('blob');
  revokeTempBlob();
  tempNotaBlobUrl=URL.createObjectURL(blob);
  tempNotaBase64=doc.output('datauristring');
  tempNotaId=id;

  // Simpan otomatis ke Firebase
  updateData(ref(db),{[`/angsuran/${id}/notaBase64`]:tempNotaBase64,[`/angsuran/${id}/notaTgl`]:Date.now()});

  if(autoOpen) window.open(tempNotaBlobUrl,'_blank');

  document.getElementById('judulNota').innerText=`Nota ${a.nama} - ${rp(a.jumlahBayar)}`;
  document.getElementById('namaNotaPreview').innerText=`${a.nama} | Bayar ${rp(a.jumlahBayar)}`;
  document.getElementById('statusNota').innerText=`✅ Nota otomatis terbuka | Sisa ${rp(sisa)}`;
  document.getElementById('popupNota').classList.add('show');

  // Enable tombol nota di form
  document.getElementById('btnNota').disabled=false;
  document.getElementById('btnNota').onclick=()=>cetakNotaAngsuran(id,true);
}

document.getElementById('btnBukaNota').onclick=()=>{ if(!tempNotaBlobUrl && tempNotaBase64){ const b=dataURLToBlob(tempNotaBase64); tempNotaBlobUrl=URL.createObjectURL(b);} if(tempNotaBlobUrl) window.open(tempNotaBlobUrl,'_blank'); };

document.getElementById('btnSimpanNota').onclick=async()=>{ if(!tempNotaBase64||!tempNotaId) return; await updateData(ref(db),{[`/angsuran/${tempNotaId}/notaBase64`]:tempNotaBase64,[`/angsuran/${tempNotaId}/notaTgl`]:Date.now()}); showToast("✅ Nota disimpan ke riwayat"); renderRiwayat(); };

function renderRiwayat(){
  const list=document.getElementById("listTransaksi"); if(!list) return;
  const arr=Object.entries(dataAngsuran).filter(([k,v])=>v&&v.nama).sort((a,b)=>Number(b[1].tanggal||0)-Number(a[1].tanggal||0));
  if(arr.length===0){list.innerHTML=`<div class="item">Belum ada transaksi</div>`; return}
  let html="";
  arr.forEach(([id,a])=>{
    const tgl=new Date(Number(a.tanggal)).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    const buktiImg=a.buktiBase64?`<div style="margin-top:8px;display:flex;align-items:center;gap:8px;background:#fffbeb;border:1px dashed #f59e0b;padding:8px;border-radius:10px"><img src="${a.buktiBase64}" style="width:42px;height:42px;object-fit:cover;border-radius:8px"><small>📎 Ada bukti</small></div>`:`<small style="color:#94a3b8">Cash • ${tgl}</small>`;
    const notaBadge=a.notaBase64?`<span class="badge-sudah">✅ Nota Tersimpan</span>`:`<span class="badge-belum">⚠️ Belum ada Nota</span>`;
    html+=`<div class="item"><div style="display:flex;justify-content:space-between"><b>${a.nama}</b><span>${notaBadge}</span></div><small>No: ${a.idPinjaman||"-"} | ${tgl}</small><div style="margin-top:6px">Pokok ${rupiah(a.pokok)} | Jasa ${rupiah(a.jasa)} | Total <b>${rupiah(a.jumlahBayar)}</b></div>${buktiImg}<div style="display:flex;gap:8px;margin-top:8px"><button class="btn-dark" onclick="cetakNotaAngsuran('${id}')" style="flex:1">📄 Buka Nota</button><button class="btn-warning" onclick="editAngsuran('${id}')" style="flex:1">✏️ Edit</button></div></div>`;
  });
  list.innerHTML=html;
}

document.getElementById("btnSimpan").onclick=async()=>{
  if(!pinIdAktif) return showToast("Pilih peminjam dulu",true);
  const jumlahBayar=getNumber(jumlahBayarEl.value); const p=dataPinjaman[pinIdAktif]; if(!p) return showToast("Pinjaman tidak ada",true);
  if(!tanggalEl.value) return showToast("Isi tanggal!",true);
  if(!metodeEl.value) return showToast("Pilih metode!",true);
  if(jumlahBayar<=0) return showToast("Jumlah bayar tidak boleh 0!",true);
  if(jumlahBayar<1000) return showToast("Minimal Rp 1.000",true);
  if(metodeEl.value==="bank" &&!document.getElementById("buktiBase64").value) return showToast("Bank wajib bukti!",true);
  const tanggal=tanggalInputKeTimestamp(tanggalEl.value); const metode=metodeEl.value;
  const {pokokTagihan,jasaTagihan}=hitungTagihanBerjalan(pinIdAktif);
  let alP=0,alJ=0,alS=0; if(jumlahBayar<=pokokTagihan+jasaTagihan){alP=Math.min(jumlahBayar,pokokTagihan); alJ=Math.min(jumlahBayar-alP,jasaTagihan)}else{alP=pokokTagihan; alJ=jasaTagihan; alS=jumlahBayar-(pokokTagihan+jasaTagihan)}
  try{
    const anggota=await getAnggotaByPinjaman(pinIdAktif); const buktiBase64=document.getElementById("buktiBase64").value;
    const baru=push(angsuranRef); const aId=baru.key;
    let kasPokokId=alP>0?push(kasRef).key:""; let kasJasaId=alJ>0?push(kasRef).key:""; let kasSimpananId=alS>0?push(kasRef).key:"";
    const updates={};
    updates["angsuran/"+aId]={pinjamanId:pinIdAktif,anggotaId:anggota.key,idAnggota:anggota.idAnggota,nama:anggota.nama,idPinjaman:p.nomor||pinIdAktif,tanggal,pokok:alP,jasa:alJ,bayarSimpanan:alS,jumlahBayar,metode,buktiBase64:buktiBase64||"",kasPokokId,kasJasaId,kasSimpananId,createdAt:Date.now()};
    if(kasPokokId) updates["kas/transaksi/"+kasPokokId]=buatPayloadKas(alP,"angsuran_pokok",tanggal,metode,aId,anggota.key,anggota.idAnggota,anggota.nama);
    if(kasJasaId) updates["kas/transaksi/"+kasJasaId]=buatPayloadKas(alJ,"pendapatan_jasa",tanggal,metode,aId,anggota.key,anggota.idAnggota,anggota.nama);
    if(kasSimpananId) updates["kas/transaksi/"+kasSimpananId]=buatPayloadKas(alS,"simpanan_sukarela",tanggal,metode,aId,anggota.key,anggota.idAnggota,anggota.nama);
    await updateData(ref(db),updates); 
    showToast(`Tersimpan ${anggota.nama} - Nota otomatis terbuka`);
    jumlahBayarEl.value=""; document.getElementById("buktiBase64").value=""; document.getElementById("previewBukti").innerHTML=""; document.getElementById("groupBukti").style.display="none"; updateInfo();
    // NOTA OTOMATIS BUKA
    setTimeout(()=>{ cetakNotaAngsuran(aId,true); }, 400);
  }catch(e){showToast("Gagal: "+e.message,true)}
};

window.editAngsuran=function(id){
  const a=dataAngsuran[id]; if(!a) return;
  document.getElementById("editAngsuranId").value=id; document.getElementById("editAngsuranNama").value=String(a.nama||""); document.getElementById("editAngsuranTanggal").value=timestampKeTanggalInput(a.tanggal); document.getElementById("editAngsuranMetode").value=a.metode||"cash"; document.getElementById("editJumlahBayar").value="Rp "+Number(a.jumlahBayar||0).toLocaleString("id-ID");
  document.getElementById("editBuktiTransfer").value="";
  const bukti=a.buktiBase64||""; document.getElementById("editBuktiBase64").value=bukti; document.getElementById("editPreviewBaru").innerHTML="";
  document.getElementById("editPreviewBukti").innerHTML=bukti?`<img src="${bukti}" style="width:100%;max-width:300px;border-radius:12px;border:2px solid #10b981"><br><small>✅ Ada - ${Math.round(bukti.length/1024)}KB</small>`:`<div style="padding:16px;color:#94a3b8">📭 Belum ada bukti</div>`;
  document.getElementById("modalEditAngsuran").classList.add("show");
};
document.getElementById("btnLihatFull").onclick=function(){const s=document.getElementById("editBuktiBase64").value; if(!s) return showToast("Belum ada bukti",true); window.open(s,"_blank")};
document.getElementById("btnSimpanGambar").onclick=function(){const s=document.getElementById("editBuktiBase64").value; if(!s) return showToast("Belum ada bukti",true); const a=document.createElement("a"); a.href=s; a.download=`bukti_${Date.now()}.jpg`; a.click()};
document.getElementById("btnHapusGambar").onclick=function(){if(!confirm("Hapus bukti?")) return; document.getElementById("editBuktiBase64").value=""; document.getElementById("editPreviewBukti").innerHTML=`<div style="padding:16px;color:#dc2626">🗑️ Bukti dihapus - klik Update</div>`; document.getElementById("editPreviewBaru").innerHTML="";};

document.getElementById("editJumlahBayar").addEventListener("input",function(){let a=this.value.replace(/\D/g,""); this.value=a?"Rp "+Number(a).toLocaleString("id-ID"):"";});
document.getElementById("btnUpdateAngsuran").onclick=async function(){
  const id=document.getElementById("editAngsuranId").value; const a=dataAngsuran[id]; if(!a) return;
  const jumlahBayar=getNumber(document.getElementById("editJumlahBayar").value); const tglInput=document.getElementById("editAngsuranTanggal").value; const metode=document.getElementById("editAngsuranMetode").value; const buktiBaru=document.getElementById("editBuktiBase64").value;
  if(jumlahBayar<=0) return showToast("Jumlah tidak boleh 0!",true);
  if(!tglInput) return showToast("Isi tanggal",true);
  if(metode==="bank" &&!buktiBaru) return showToast("Bank wajib bukti!",true);
  try{
    const {pokokTagihan,jasaTagihan}=hitungTagihanBerjalan(a.pinjamanId,id); let alP=0,alJ=0,alS=0;
    if(jumlahBayar<=pokokTagihan+jasaTagihan){alP=Math.min(jumlahBayar,pokokTagihan); alJ=Math.min(jumlahBayar-alP,jasaTagihan)}else{alP=pokokTagihan; alJ=jasaTagihan; alS=jumlahBayar-(pokokTagihan+jasaTagihan)}
    const tanggal=tanggalInputKeTimestamp(tglInput); const anggota=await getAnggotaByPinjaman(a.pinjamanId);
    const semuaKasLama=await cariSemuaKasAngsuran(id); const bersih={}; semuaKasLama.forEach(k=>bersih["kas/transaksi/"+k]=null); if(Object.keys(bersih).length>0) await updateData(ref(db),bersih);
    let kasPokokId=alP>0?push(kasRef).key:""; let kasJasaId=alJ>0?push(kasRef).key:""; let kasSimpananId=alS>0?push(kasRef).key:"";
    const updates={}; updates["angsuran/"+id]={...a,jumlahBayar,tanggal,metode,pokok:alP,jasa:alJ,bayarSimpanan:alS,buktiBase64:buktiBaru||"",kasPokokId,kasJasaId,kasSimpananId,updatedAt:Date.now()};
    if(kasPokokId) updates["kas/transaksi/"+kasPokokId]=buatPayloadKas(alP,"angsuran_pokok",tanggal,metode,id,anggota.key,anggota.idAnggota,anggota.nama);
    if(kasJasaId) updates["kas/transaksi/"+kasJasaId]=buatPayloadKas(alJ,"pendapatan_jasa",tanggal,metode,id,anggota.key,anggota.idAnggota,anggota.nama);
    if(kasSimpananId) updates["kas/transaksi/"+kasSimpananId]=buatPayloadKas(alS,"simpanan_sukarela",tanggal,metode,id,anggota.key,anggota.idAnggota,anggota.nama);
    await updateData(ref(db),updates); showToast("✅ Update berhasil"); document.getElementById("modalEditAngsuran").classList.remove("show"); renderRiwayat(); cetakNotaAngsuran(id,true);
  }catch(err){ showToast("Gagal: "+err.message,true); }
};
document.getElementById("btnHapusAngsuran").onclick=async function(){
  const id=document.getElementById("editAngsuranId").value; if(!confirm("Hapus angsuran & semua kas terkait?")) return;
  const a=dataAngsuran[id]; const semuaKas=await cariSemuaKasAngsuran(id); const updates={}; updates["angsuran/"+id]=null; semuaKas.forEach(k=>updates["kas/transaksi/"+k]=null); if(a.kasPokokId) updates["kas/transaksi/"+a.kasPokokId]=null; if(a.kasJasaId) updates["kas/transaksi/"+a.kasJasaId]=null; if(a.kasSimpananId) updates["kas/transaksi/"+a.kasSimpananId]=null;
  await updateData(ref(db),updates); showToast("Terhapus bersih"); document.getElementById("modalEditAngsuran").classList.remove("show"); document.getElementById("modalRiwayat").classList.remove("show");
};

const sekarang=new Date(); document.getElementById("tanggal").value=[sekarang.getFullYear(),String(sekarang.getMonth()+1).padStart(2,"0"),String(sekarang.getDate()).padStart(2,"0")].join("-");
