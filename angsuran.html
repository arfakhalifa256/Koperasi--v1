<style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, push, get, update as updateData } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let dataPinjaman={}, dataAngsuran={}, dataAnggotaCache={}, pinIdAktif=null;
const pinjamanRef=ref(db,"pinjaman"); const angsuranRef=ref(db,"angsuran"); const kasRef=ref(db,"kas/transaksi");
function rupiah(n){return Number(n||0).toLocaleString("id-ID",{style:"currency",currency:"IDR"})}
function rp(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function getNumber(v){return parseInt(String(v||"").replace(/\D/g,""))||0}
function showToast(m,e=false){const t=document.getElementById("toast");t.innerText=m;t.className="toast show"+(e?" error":"");setTimeout(()=>t.className="toast",3500)}
function tanggalInputKeTimestamp(v){if(!v) return Date.now(); const p=v.split("-"); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]),12,0,0,0).getTime()}
function timestampKeTanggalInput(ts){if(!ts) return ""; const d=new Date(Number(ts)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function formatHpKe62(hp){let h=String(hp||"").replace(/\D/g,""); if(!h) return ""; if(h.startsWith('0')) h='62'+h.slice(1); return h;}

// FIX AG AUTO
onValue(ref(db,"anggota"), s=>{
  dataAnggotaCache={};
  let idx=0;
  s.forEach(d=>{
    idx++;
    const v=d.val()||{};
    let kode = String(v.idAnggota||v.kode||v.kodeAnggota||"").trim();
    if(!kode || kode.startsWith("-") || kode.length>12 || !kode.toUpperCase().startsWith("AG")){
      kode = "AG" + String(idx).padStart(3,"0");
    }
    dataAnggotaCache[d.key]={key:d.key,idAnggota:kode.toUpperCase(),nama:v.nama||"",telepon:v.telepon||v.noHp||"",...v,idAnggota:kode.toUpperCase()};
  });
  loadPinjaman();
});
onValue(pinjamanRef, s=>{dataPinjaman={}; s.forEach(d=>{const v=d.val(); if(!v) return; dataPinjaman[d.key]={id:d.key,key:d.key,...v}}); loadPinjaman()});
onValue(angsuranRef, s=>{dataAngsuran={}; s.forEach(d=>{const v=d.val(); if(!v) return; dataAngsuran[d.key]={id:d.key,...v}}); loadPinjaman(); renderRiwayat();});

async function getAnggotaByPinjaman(pid){
  const p=dataPinjaman[pid]; if(!p) return {key:pid,idAnggota:"AG001",nama:"",telepon:""};
  const ag1 = dataAnggotaCache[p.idAnggota] || dataAnggotaCache[p.anggotaId];
  if(ag1) return {key:ag1.key,idAnggota:ag1.idAnggota,nama:ag1.nama||p.nama||"",telepon:ag1.telepon||""};
  if(p.kodeAnggota && String(p.kodeAnggota).toUpperCase().startsWith("AG")){
    return {key:p.idAnggota||pid,idAnggota:p.kodeAnggota.toUpperCase(),nama:p.nama||"",telepon:p.telepon||""};
  }
  for(const k in dataAnggotaCache){
    const ag=dataAnggotaCache[k];
    if(String(p.nama||"").toLowerCase().trim()===String(ag.nama||"").toLowerCase().trim()){
      return {key:k,idAnggota:ag.idAnggota,nama:ag.nama,telepon:ag.telepon};
    }
  }
  return {key:p.anggotaId||p.idAnggota||pid,idAnggota:p.kodeAnggota||"AG001",nama:String(p.nama||"").replace(/ -$/,"").trim(),telepon:p.telepon||""};
}

function getSisaPinjaman(id,excludeId=null){
  const p=dataPinjaman[id]; if(!p) return {sisaPokok:0,sisaJasa:0,bayarPokok:0,bayarJasa:0,sisaTotal:0,totalPinjam:0,totalBayar:0};
  let bayarPokok=0,bayarJasa=0;
  Object.values(dataAngsuran).forEach(a=>{ if(!a||a.id===excludeId) return; if(String(a.pinjamanId||"")===id){bayarPokok+=Number(a.pokok||0); bayarJasa+=Number(a.jasa||0)}});
  const totalPokok=Number(p.jumlah||0); const totalJasa=Number(p.jasa||0);
  const sisaPokok=Math.max(0,totalPokok-bayarPokok); const sisaJasa=Math.max(0,totalJasa-bayarJasa);
  return {sisaPokok,sisaJasa,bayarPokok,bayarJasa,sisaTotal:sisaPokok+sisaJasa,totalPinjam:totalPokok+totalJasa,totalBayar:bayarPokok+bayarJasa};
}
function hitungTagihanBerjalan(id,excludeId=null){
  const p=dataPinjaman[id]; if(!p) return {pokokTagihan:0,jasaTagihan:0,sisaPokok:0,sisaJasa:0};
  const {sisaPokok,sisaJasa}=getSisaPinjaman(id,excludeId);
  const pokokBulan=Number(p.angsuranPokok||Math.ceil(Number(p.jumlah||0)/Number(p.tenor||1)));
  const jasaBulan=Math.round(pokokBulan*0.20);
  return {pokokTagihan:Math.min(pokokBulan,sisaPokok),jasaTagihan:sisaPokok<=0?sisaJasa:Math.min(jasaBulan,sisaJasa),sisaPokok,sisaJasa};
}
let listPinjamanCache=[];
function loadPinjaman(){
  const listDiv=document.getElementById("pinjamanList"); const searchInput=document.getElementById("pinjamanSearch"); if(!listDiv||!searchInput) return;
  listPinjamanCache = Object.entries(dataPinjaman).filter(([id,p])=>p&&p.nama).sort((a,b)=>Number(b[1].tanggal||0)-Number(a[1].tanggal||0)).map(([id,p])=>{
    const s=getSisaPinjaman(id);
    const ag = dataAnggotaCache[p.idAnggota] || dataAnggotaCache[p.anggotaId];
    const kodeAG = p.kodeAnggota || ag?.idAnggota || "AG001";
    return {id, nama:String(p.nama).replace(/ -$/,"").trim(), nomor:p.nomor||id.slice(0,6), kodeAG, ...s, lunas:s.sisaTotal<=0};
  });
  function renderList(filter=""){const f=filter.toLowerCase().trim(); let filtered = f? listPinjamanCache.filter(x=> x.nama.toLowerCase().includes(f)||x.nomor.toLowerCase().includes(f)||x.kodeAG.toLowerCase().includes(f)) : listPinjamanCache.filter(x=>!x.lunas); if(filtered.length===0){ listDiv.innerHTML=`<div style="padding:14px;text-align:center;color:#94a3b8">Tidak ketemu "${filter}"</div>`; return; } let html=""; filtered.slice(0,30).forEach(x=>{html+=`<div class="p-item" data-id="${x.id}"><div><b>${x.nama}</b> <small>(${x.kodeAG} - ${x.nomor})</small><br><small>Sisa TOTAL <b style="color:#dc2626">${rupiah(x.sisaTotal)}</b></small></div><div><span style="font-size:9px;background:#dcfce7;padding:2px 6px;border-radius:6px">${Math.round(x.totalPinjam>0?x.totalBayar/x.totalPinjam*100:0)}%</span></div></div>`;}); listDiv.innerHTML=html; listDiv.querySelectorAll(".p-item").forEach(el=>{ el.onclick=()=>pilihPeminjam(el.dataset.id); });}
  searchInput.onfocus=()=>{ listDiv.style.display="block"; renderList(searchInput.value); }; searchInput.oninput=()=>{ listDiv.style.display="block"; renderList(searchInput.value); }; document.addEventListener("click",(e)=>{ if(!e.target.closest("#pinjamanSearch")&&!e.target.closest("#pinjamanList")) listDiv.style.display="none"; }); renderList("");
}
window.pilihPeminjam=function(id){
  const x=listPinjamanCache.find(v=>v.id===id); if(!x) return; pinIdAktif=id; document.getElementById("pinjamanSelect").value=id; document.getElementById("pinjamanSearch").value=`${x.nama} - ${x.kodeAG}`; document.getElementById("pinjamanList").style.display="none"; const box=document.getElementById("pinjamanTerpilih"); box.style.display="block"; box.innerHTML=`✅ <b>${x.nama}</b> (${x.kodeAG} - ${x.nomor}) | Sisa TOTAL <b style="color:#dc2626">${rupiah(x.sisaTotal)}</b>`; updateInfo();
}
function kompresFoto(file,cb){
  const r=new FileReader(); r.onload=e=>{const img=new Image(); img.onload=()=>{const c=document.createElement("canvas"); const maxW=1500; const sc=Math.min(1,maxW/img.width); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); const ctx=c.getContext("2d"); ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); cb(c.toDataURL("image/jpeg",0.92));}; img.src=e.target.result;}; r.readAsDataURL(file);
}
let jumlahBayarEl=document.getElementById("jumlahBayar"), pokokEl=document.getElementById("pokok"), jasaEl=document.getElementById("jasa"), simpananEl=document.getElementById("simpanan"), tanggalEl=document.getElementById("tanggal"), metodeEl=document.getElementById("metode");
jumlahBayarEl.addEventListener("input",function(){let a=this.value.replace(/\D/g,""); this.value=a?"Rp "+Number(a).toLocaleString("id-ID"):""; hitungAlokasi()});
metodeEl.addEventListener("change",function(){ const g=document.getElementById("groupBukti"); if(this.value==="bank"){g.style.display="block"}else{g.style.display="none"; document.getElementById("buktiBase64").value=""; document.getElementById("previewBukti").innerHTML=""}});
document.getElementById("buktiTransfer").addEventListener("change",function(e){const file=e.target.files[0]; if(!file) return; document.getElementById("previewBukti").innerHTML="⏳ Kompres..."; kompresFoto(file,b64=>{document.getElementById("buktiBase64").value=b64; document.getElementById("previewBukti").innerHTML=`<img src="${b64}" style="width:100%;max-width:250px;border-radius:12px;border:2px solid #10b981"><br><small>✅ ${Math.round(b64.length/1024)}KB</small>`});});
function updateInfo(){if(!pinIdAktif){document.getElementById("tagihan").value=""; jumlahBayarEl.value=""; pokokEl.value=""; jasaEl.value=""; simpananEl.value=""; document.getElementById("totalBayar").innerText=rupiah(0); document.getElementById("sisaPokok").innerText=rupiah(0); document.getElementById("sisaTotal").innerText=rupiah(0); return} const {pokokTagihan,jasaTagihan,sisaPokok}=hitungTagihanBerjalan(pinIdAktif); const {sisaTotal}=getSisaPinjaman(pinIdAktif); document.getElementById("tagihan").value=rupiah(pokokTagihan+jasaTagihan); document.getElementById("sisaPokok").innerText=rupiah(sisaPokok); document.getElementById("sisaTotal").innerText=rupiah(sisaTotal); hitungAlokasi();}
function hitungAlokasi(){if(!pinIdAktif) return; const bayar=getNumber(jumlahBayarEl.value); const {pokokTagihan,jasaTagihan}=hitungTagihanBerjalan(pinIdAktif); const wajib=pokokTagihan+jasaTagihan; let p=0,j=0,s=0; if(bayar<=wajib){p=Math.min(bayar,pokokTagihan); j=Math.min(bayar-p,jasaTagihan)}else{p=pokokTagihan; j=jasaTagihan; s=bayar-wajib} pokokEl.value=rupiah(p); jasaEl.value=rupiah(j); simpananEl.value=rupiah(s); document.getElementById("totalBayar").innerText=rupiah(bayar);}
function buatPayloadKas(jumlah,kategori,tanggal,metode,aId,agId,idAnggota,nama){return {jumlah:Number(jumlah||0),kategori,tipe:"masuk",sumberKas:metode||"cash",tanggal:Number(tanggal),keterangan:`Angsuran ${nama||""} - ${idAnggota||""}`.trim(),angsuranId:aId||"",anggotaId:agId||"",idAnggota:idAnggota||"",nama:nama||"",dibuatPada:Date.now()}}
async function cariSemuaKasAngsuran(aId){ try{const snap=await get(kasRef); const data=snap.val()||{}; const h=[]; for(const k in data){if(String(data[k].angsuranId||"")===String(aId)) h.push(k)} return h}catch(e){return []} }
let tempNotaBase64=null, tempNotaBlobUrl=null, tempNotaId=null;
function dataURLToBlob(dataurl){try{const arr=dataurl.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]); let n=bstr.length; const u8arr=new Uint8Array(n); while(n--){u8arr[n]=bstr.charCodeAt(n);} return new Blob([u8arr],{type:mime});}catch(e){return null;}}
function revokeTempBlob(){if(tempNotaBlobUrl){URL.revokeObjectURL(tempNotaBlobUrl); tempNotaBlobUrl=null;}}

    if(!hp){ const p=dataPinjaman[a.pinjamanId]; hp=formatHpKe62(dataAnggotaCache[p?.anggotaId||p?.idAnggota]?.telepon||""); }

function cetakNotaAngsuran(id, autoOpen=true){

    if(agCache && agCache.idAnggota && agCache.idAnggota.startsWith("AG")) kodeAG = agCache.idAnggota;
    else if(p.kodeAnggota && p.kodeAnggota.startsWith("AG")) kodeAG = p.kodeAnggota;
    else if(p.idAnggota && dataAnggotaCache[p.idAnggota]?.idAnggota) kodeAG = dataAnggotaCache[p.idAnggota].idAnggota;

  function dashedLine(yy){doc.setLineDash([1.5,1.5],0); doc.line(4,yy,76,yy); doc.setLineDash([]);}
  function dashedRect(){doc.setLineDash([1.2,1.2],0); doc.rect(2,2,76,190); doc.setLineDash([]);}
  function row(l,r){doc.setFontSize(9); doc.setFont("helvetica","normal"); doc.text(l,6,y); doc.text(r,74,y,{align:"right"}); y+=5;}
  dashedRect(); doc.setFontSize(12); doc.setFont("helvetica","bold"); doc.text("KOPERASI ARFA DRIVER",40,y,{align:"center"}); y+=6; doc.setFontSize(10); doc.text("BUKTI PEMBAYARAN ANGSURAN",40,y,{align:"center"}); y+=8; dashedLine(y); y+=7;
  row("No Pinjam", p.nomor||a.idPinjaman||"-"); row("Tanggal", tglIndo(a.tanggal)); row("Nama", a.nama||"-"); row("No Anggota", kodeAG); row("Metode", (a.metode||"-").toUpperCase()); y+=2; dashedLine(y); y+=7;
  doc.setFontSize(11); doc.setFont("helvetica","bold"); doc.text("RINCIAN",6,y); y+=6; doc.setFontSize(9); doc.setFont("helvetica","normal");
  row("Jumlah Bayar", rp(a.jumlahBayar)); row("Pokok", rp(a.pokok)); row("Jasa", rp(a.jasa)); if(a.bayarSimpanan>0) row("Sukarela", rp(a.bayarSimpanan)); y+=2; dashedLine(y); y+=8;
  doc.setFontSize(12); doc.setFont("helvetica","bold"); doc.text("TOTAL BAYAR",6,y); doc.text(rp(a.jumlahBayar),74,y,{align:"right"}); y+=6; const sisa=getSisaPinjaman(a.pinjamanId).sisaTotal; doc.setFontSize(9); doc.text(`Sisa TOTAL: ${rp(sisa)}`,6,y); y+=8; dashedLine(y); y+=8;
  if(a.buktiBase64){ try{ doc.setFontSize(9); doc.setFont("helvetica","bold"); doc.text("Bukti Transfer:",6,y); y+=5; const imgProps=doc.getImageProperties(a.buktiBase64); const pdfW=68; const pdfH=(imgProps.height*pdfW)/imgProps.width; const finalH=Math.min(pdfH,80); if(y+finalH>195){ doc.addPage([80,200]); y=6; dashedRect(); } doc.addImage(a.buktiBase64,'JPEG',6,y,pdfW,finalH,undefined,'FAST'); y+=finalH+6; }catch(e){} dashedLine(y); y+=6; }
  doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.text("- Simpan sebagai bukti sah -",40,y,{align:"center"}); y+=5; doc.setFont("helvetica","bold"); doc.text(`ID: ${kodeAG} - Koperasi Arfa`,40,y,{align:"center"}); y+=5; doc.setFont("helvetica","normal"); doc.text(tglJam,40,y,{align:"center"});
  const blob=doc.output('blob'); revokeTempBlob(); tempNotaBlobUrl=URL.createObjectURL(blob); tempNotaBase64=doc.output('datauristring'); tempNotaId=id;
  updateData(ref(db),{[`/angsuran/${id}/notaBase64`]:tempNotaBase64,[`/angsuran/${id}/notaTgl`]:Date.now(), [`/angsuran/${id}/idAnggota`]:kodeAG});
  if(autoOpen) window.open(tempNotaBlobUrl,'_blank');

function renderRiwayat(){
  const list=document.getElementById("listTransaksi");
  const searchVal=(document.getElementById("searchRiwayat")?.value||"").toLowerCase().trim();
  const filterTgl=document.getElementById("filterTanggal")?.value||"";
  const filterMet=document.getElementById("filterMetode")?.value||"";
  if(!list) return;
  let arr=Object.entries(dataAngsuran).filter(([k,v])=>v&&v.nama).sort((a,b)=>Number(b[1].tanggal||0)-Number(a[1].tanggal||0));
  if(searchVal){ arr=arr.filter(([id,a])=> String(a.nama||"").toLowerCase().includes(searchVal) || String(a.idPinjaman||"").toLowerCase().includes(searchVal) || String(a.idAnggota||"").toLowerCase().includes(searchVal)); }
  if(filterMet){ arr=arr.filter(([id,a])=> (a.metode||"")===filterMet); }
  if(filterTgl){ const now=Date.now(); arr=arr.filter(([id,a])=>{ const t=Number(a.tanggal||0); if(filterTgl==="today") return new Date(t).toDateString()===new Date(now).toDateString(); if(filterTgl==="week") return now - t < 7*24*60*60*1000; if(filterTgl==="month") return now - t < 30*24*60*60*1000; return true; }); }
  document.getElementById("jmlRiwayat").innerText=Object.keys(dataAngsuran).length;
  document.getElementById("infoJumlah").innerText=arr.length;
  document.getElementById("infoSearch").innerText=searchVal?`hasil cari "${searchVal}"`:"semua data";
  if(arr.length===0){ list.innerHTML=`<div style="padding:20px;text-align:center;color:#94a3b8"><div style="font-size:32px">🔍</div><b>Tidak ada data</b><br><small>Coba kata kunci lain</small><br><button onclick="document.getElementById('searchRiwayat').value='';document.getElementById('filterTanggal').value='';document.getElementById('filterMetode').value='';renderRiwayat()" style="margin-top:10px;padding:8px 12px;background:#eff6ff;border:1px solid #3b82f6;border-radius:8px">Reset Filter</button></div>`; return; }
  let html="";
  arr.slice(0,100).forEach(([id,a])=>{
    const tgl=new Date(Number(a.tanggal)).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
    const isKodeAcak = String(a.idAnggota||"").startsWith("-") || String(a.idAnggota||"").length>10;
    const badgeAG = isKodeAcak ? `<span style="background:#fecaca;color:#991b1b;padding:2px 6px;border-radius:6px;font-size:9px">⚠️ ${a.idAnggota?.slice(0,10)}... (KODE)</span>` : `<span style="background:#dcfce7;padding:2px 6px;border-radius:6px;font-size:10px">${a.idAnggota}</span>`;
    const buktiImg=a.buktiBase64?`<div style="margin-top:8px;display:flex;align-items:center;gap:8px;background:#fffbeb;border:1px dashed #f59e0b;padding:8px;border-radius:10px"><img src="${a.buktiBase64}" style="width:42px;height:42px;object-fit:cover;border-radius:8px"><small>📎 Ada bukti</small></div>`:`<small style="color:#94a3b8">💵 ${a.metode?.toUpperCase()||'CASH'} • ${tgl}</small>`;
    const notaBadge=a.notaBase64?`<span class="badge-sudah">✅ Nota</span>`:`<span class="badge-belum">Belum Nota</span>`;
    let tombolNotaTersimpan = "";
    if(a.notaBase64){ tombolNotaTersimpan = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="btn-dark" style="padding:10px;background:#0f3057;color:#fff;border:none;border-radius:10px;font-weight:700" onclick="lihatNotaTersimpan('${id}')">👁️ Buka Nota</button><button class="btn-success" style="padding:10px;background:#10b981;color:#fff;border:none;border-radius:10px;font-weight:700" onclick="downloadNotaTersimpan('${id}')">📥 Download</button></div>`; }
    html+=`<div class="item"><div style="display:flex;justify-content:space-between;align-items:start;gap:8px"><div><b style="font-size:13px">${a.nama}</b> ${badgeAG}<br><small style="color:#64748b">No: ${a.idPinjaman||"-"} | ${a.idAnggota||"-"}</small><br><small style="color:#94a3b8">${tgl}</small></div><span>${notaBadge}</span></div><div style="margin-top:8px;background:#f8fafc;padding:8px 10px;border-radius:8px;font-size:11px">Pokok <b>${rupiah(a.pokok)}</b> + Jasa <b>${rupiah(a.jasa)}</b> = Total <b style="color:#0f3057">${rupiah(a.jumlahBayar)}</b></div>${buktiImg}${tombolNotaTersimpan}<div class="item-actions" style="margin-top:8px"><button class="btn-wa" onclick="kirimWAAngsuran('${id}')">WA</button><button class="btn-dark" onclick="cetakNotaAngsuran('${id}')">Nota AG</button><button class="btn-warning" onclick="editAngsuran('${id}')">Edit</button></div></div>`;
  });
  if(arr.length>100) html+=`<div style="padding:12px;text-align:center;color:#64748b;font-size:11px">Menampilkan 100 dari ${arr.length}</div>`;
  list.innerHTML=html;
}

window.perbaikiIdAngsuranLama=async()=>{
  if(!confirm("Perbaiki semua angsuran yang ID nya masih -Osy... jadi AG...?")) return;
  const updates={}; let count=0;
  Object.values(dataAngsuran).forEach(a=>{
    let kode=String(a.idAnggota||"");
    if(!kode || kode.startsWith("-") || kode.length>10 || !kode.toUpperCase().startsWith("AG")){
      const p=dataPinjaman[a.pinjamanId];
      const agMatch = p ? (dataAnggotaCache[p.idAnggota] || dataAnggotaCache[p.anggotaId]) : null;
      const kodeBaru = agMatch?.idAnggota || p?.kodeAnggota || "";
      if(kodeBaru && kodeBaru.toUpperCase().startsWith("AG")){
        updates[`/angsuran/${a.id}/idAnggota`]=kodeBaru;
        count++;
      }
    }
  });
  if(count===0) return showToast("Semua sudah AG... bos ✅");
  await updateData(ref(db),updates);
  showToast(`✅ ${count} angsuran diperbaiki jadi AG...`);
  renderRiwayat();
};

    if(kasJasaId) updates["kas/transaksi/"+kasJasaId]=buatPayloadKas(alJ,"pendapatan_jasa",tanggal,metode,aId,anggota.key,anggota.idAnggota,anggota.nama);
    if(kasSimpananId) updates["kas/transaksi/"+kasSimpananId]=buatPayloadKas(alS,"simpanan_sukarela",tanggal,metode,aId,anggota.key,anggota.idAnggota,anggota.nama);
    await updateData(ref(db),updates); showToast(`Tersimpan ${anggota.nama} - ${anggota.idAnggota} - Nota + WA`); jumlahBayarEl.value=""; document.getElementById("buktiBase64").value=""; document.getElementById("previewBukti").innerHTML=""; document.getElementById("groupBukti").style.display="none"; updateInfo();
    setTimeout(()=>{ cetakNotaAngsuran(aId,true); },400);

    const tanggal=tanggalInputKeTimestamp(tglInput); const anggota=await getAnggotaByPinjaman(a.pinjamanId); const semuaKasLama=await cariSemuaKasAngsuran(id); const bersih={}; semuaKasLama.forEach(k=>bersih["kas/transaksi/"+k]=null); if(Object.keys(bersih).length>0) await updateData(ref(db),bersih);
    let kasPokokId=alP>0?push(kasRef).key:""; let kasJasaId=alJ>0?push(kasRef).key:""; let kasSimpananId=alS>0?push(kasRef).key:"";
    const updates={}; updates["angsuran/"+id]={...a,jumlahBayar,tanggal,metode,pokok:alP,jasa:alJ,bayarSimpanan:alS,buktiBase64:buktiBaru||"",kasPokokId,kasJasaId,kasSimpananId,idAnggota:anggota.idAnggota,updatedAt:Date.now()};
    if(kasPokokId) updates["kas/transaksi/"+kasPokokId]=buatPayloadKas(alP,"angsuran_pokok",tanggal,metode,id,anggota.key,anggota.idAnggota,anggota.nama);
    if(kasJasaId) updates["kas/transaksi/"+kasJasaId]=buatPayloadKas(alJ,"pendapatan_jasa",tanggal,metode,id,anggota.key,anggota.idAnggota,anggota.nama);
    if(kasSimpananId) updates["kas/transaksi/"+kasSimpananId]=buatPayloadKas(alS,"simpanan_sukarela",tanggal,metode,id,anggota.key,anggota.idAnggota,anggota.nama);
    await updateData(ref(db),updates); showToast("✅ Update AG + Nota + WA"); document.getElementById("modalEditAngsuran").classList.remove("show"); renderRiwayat(); cetakNotaAngsuran(id,true);
  }catch(err){ showToast("Gagal: "+err.message,true); }
};
document.getElementById("btnHapusAngsuran").onclick=async function(){
  const id=document.getElementById("editAngsuranId").value; if(!confirm("Hapus angsuran & semua kas terkait?")) return; const a=dataAngsuran[id]; const semuaKas=await cariSemuaKasAngsuran(id); const updates={}; updates["angsuran/"+id]=null; semuaKas.forEach(k=>updates["kas/transaksi/"+k]=null); if(a.kasPokokId) updates["kas/transaksi/"+a.kasPokokId]=null; if(a.kasJasaId) updates["kas/transaksi/"+a.kasJasaId]=null; if(a.kasSimpananId) updates["kas/transaksi/"+a.kasSimpananId]=null; await updateData(ref(db),updates); showToast("Terhapus bersih"); document.getElementById("modalEditAngsuran").classList.remove("show"); document.getElementById("modalRiwayat").classList.remove("show");
};
document.getElementById("btnRiwayat").addEventListener("click",()=>{renderRiwayat(); document.getElementById("modalRiwayat").classList.add("show")});
document.getElementById("btnCloseRiwayat").addEventListener("click",()=>{document.getElementById("modalRiwayat").classList.remove("show")});
document.getElementById("btnCloseEdit").addEventListener("click",()=>{document.getElementById("modalEditAngsuran").classList.remove("show")});
const sekarang=new Date(); document.getElementById("tanggal").value=[sekarang.getFullYear(),String(sekarang.getMonth()+1).padStart(2,"0"),String(sekarang.getDate()).padStart(2,"0")].join("-");
</script>
