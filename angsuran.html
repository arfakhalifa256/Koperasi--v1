<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angsuran Pinjaman - Koperasi ARFA</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
:root{--primary:#1e90ff;--primary-dark:#0f3057;--bg:#f1f5f9;--border:#e2e8f0;--shadow:0 2px 8px rgba(0,0,0,0.06);--radius:14px;--success:#10b981;--danger:#dc2626;--warning:#f59e0b;}
body{background:var(--bg);color:#1f2937;font-size:13px;padding-bottom:20px;}
header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;}.brand img{width:36px;height:36px;border-radius:50%;background:#fff;padding:2px;}
.menu-btn{cursor:pointer;font-size:22px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,0.15);}
.container{padding:15px;max-width:900px;margin:0 auto}.card{background:#fff;padding:18px;border-radius:var(--radius);margin-bottom:15px;box-shadow:var(--shadow)}
h2{margin-bottom:15px;font-size:16px;color:var(--primary-dark)}.form-group{margin-bottom:14px}label{display:block;margin-bottom:6px;font-weight:600;font-size:12px}
input,select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-size:13px}input[disabled]{background:#f8fafc}
button{padding:11px 14px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:10px}.btn-primary{background:var(--primary);color:#fff}.btn-danger{background:var(--danger);color:#fff}.btn-warning{background:var(--warning);color:#fff}.btn-success{background:var(--success);color:#fff}
.list{display:flex;flex-direction:column;gap:12px;margin-top:15px}.item{background:#fff;padding:14px;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:.3s;z-index:9999}.toast.show{opacity:1}.toast.error{background:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:999}.modal.show{display:flex}.modal-content{background:#fff;width:95%;max-width:500px;border-radius:16px;padding:20px}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.info-box{background:#eff6ff;padding:12px;border-radius:12px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center}
.sidebar{position:fixed;top:0;left:-260px;width:240px;height:100%;background:var(--primary-dark);padding:16px;transition:0.3s;z-index:9999}.sidebar.open{left:0;}.sidebar a{color:#fff;text-decoration:none;display:flex;gap:10px;padding:10px;border-radius:10px;font-size:12px}.sidebar a.active{background:rgba(255,255,255,0.2);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:999;}.overlay.active{display:block;}
</style>
</head>
<body>
<div id="sidebar" class="sidebar">
  <a href="dashboard.html">🏠 Beranda</a><a href="anggota.html">👤 Anggota</a><a href="kas.html">💵 Kas</a><a href="angsuran.html" class="active">📄 Angsuran</a><a href="pinjaman.html">💰 Pinjaman</a><a href="#" id="btnLogout">🚪 Logout</a>
</div>
<div id="overlay" class="overlay"></div>
<header><div class="brand"><img src="img/icon-192.png"><div>ANGSURAN ANGGOTA</div></div><span class="menu-btn" onclick="toggleSidebar()">☰</span></header>

<div class="container">
  <div class="card" id="formInput">
    <h2>Input Angsuran</h2>
    <div class="form-group"><label>Pilih Peminjam</label><select id="pinjamanSelect"></select></div>
    <div class="form-group"><label>Tanggal</label><input type="date" id="tanggal"></div>
    <div class="form-group"><label>Metode</label><select id="metode"><option value="">Pilih</option><option value="cash">Cash</option><option value="bank">Bank</option></select></div>
    <div class="form-group"><label>Tagihan Bulan Ini</label><input type="text" id="tagihan" disabled></div>
    <div class="form-group"><label>Jumlah Bayar</label><input type="text" id="jumlahBayar" placeholder="Rp 0"></div>
    <div class="form-group"><label>Pokok (auto)</label><input type="text" id="pokok" disabled></div>
    <div class="form-group"><label>Jasa (auto)</label><input type="text" id="jasa" disabled></div>
    <div class="form-group"><label>Sukarela (auto)</label><input type="text" id="simpanan" disabled></div>
    <div class="info-box"><div>Total<br><b id="totalBayar">Rp0</b></div><div>Sisa Pokok<br><b id="sisaPokok">Rp0</b></div><div>Sisa Jasa<br><b id="sisaJasa">Rp0</b></div></div>
    <div class="btn-group"><button type="button" class="btn-primary" id="btnSimpan">💾 Simpan</button><button type="button" class="btn-warning" id="btnNota" disabled>🧾 Cetak Nota</button></div>
  </div>
  <div class="card"><button type="button" class="btn-success" id="btnRiwayat">📋 Lihat Riwayat</button><div class="list" id="listTransaksi" style="display:none;"></div></div>
</div>

<div id="modalEditAngsuran" class="modal"><div class="modal-content"><div style="text-align:right"><button onclick="tutupEditAngsuran()" style="background:#dc2626;color:#fff;padding:5px 10px;border-radius:6px;border:none">✕</button></div><h2>Edit Angsuran</h2><input type="hidden" id="editAngsuranId"><div class="form-group"><label>Nama</label><input type="text" id="editAngsuranNama" disabled></div><div class="form-group"><label>Tanggal</label><input type="date" id="editAngsuranTanggal"></div><div class="form-group"><label>Metode</label><select id="editAngsuranMetode"><option value="cash">Cash</option><option value="bank">Bank</option></select></div><div class="form-group"><label>Jumlah Bayar</label><input type="text" id="editJumlahBayar"></div><div class="btn-group"><button type="button" class="btn-primary" id="btnUpdateAngsuran">Update</button><button type="button" class="btn-danger" id="btnHapusAngsuran">Hapus</button></div></div></div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, push, set, update as updateData, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const role=(localStorage.getItem("role")||"user").toLowerCase(); const username=localStorage.getItem("username");
if(!username){alert("Login dulu"); location.href="index.html";}
window.toggleSidebar=()=>{document.getElementById("sidebar").classList.toggle("open");document.getElementById("overlay").classList.toggle("active");};
document.getElementById("overlay").onclick=window.toggleSidebar;
document.getElementById("btnLogout").onclick=(e)=>{e.preventDefault(); if(confirm("Logout?")){localStorage.clear(); location.href="index.html";}};

let dataPinjaman={}, dataAngsuran={}, dataAnggotaCache={}, pinIdAktif=null;
const pinjamanRef=ref(db,"pinjaman"), angsuranRef=ref(db,"angsuran");

function rupiah(n){return Number(n||0).toLocaleString("id-ID",{style:"currency",currency:"IDR"});}
function getNumber(v){return parseInt(String(v).replace(/\D/g,''))||0;}
function showToast(m,e=false){const t=document.getElementById("toast"); t.innerText=m; t.className="toast show"+(e?" error":""); setTimeout(()=>t.className="toast",3000);}
function normalisasiWA(no){let n=String(no||"").replace(/\D/g,""); if(n.startsWith("0")) n="62"+n.slice(1); return /^62\d{9,14}$/.test(n)?n:"";}
function normalisasiNama(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"").trim();}

onValue(ref(db,"anggota"), s=>{ dataAnggotaCache={}; s.forEach(d=>{ dataAnggotaCache[d.key]={key:d.key,...d.val()}; }); loadPinjaman(); });
onValue(pinjamanRef, s=>{ dataPinjaman={}; s.forEach(d=>{ dataPinjaman[d.key]={id:d.key,...d.val()}; }); loadPinjaman(); });
onValue(angsuranRef, s=>{ dataAngsuran={}; s.forEach(d=>{ dataAngsuran[d.key]={id:d.key,...d.val()}; }); loadPinjaman(); renderRiwayat(); });

function getSisaPinjaman(id){
  const p=dataPinjaman[id]; if(!p) return {sisaPokok:0,sisaJasa:0};
  let bP=0,bJ=0; Object.values(dataAngsuran).forEach(a=>{if(a.pinjamanId===id){bP+=Number(a.pokok||0); bJ+=Number(a.jasa||0);}});
  return {sisaPokok:Math.max(0,Number(p.jumlah||0)-bP), sisaJasa:Math.max(0,Number(p.jasa||0)-bJ)};
}
function hitungTagihanBerjalan(id){
  const p=dataPinjaman[id]; if(!p) return {pokokTagihan:0,jasaTagihan:0,sisaPokok:0,sisaJasa:0};
  const {sisaPokok,sisaJasa}=getSisaPinjaman(id);
  const pokokBulan=Number(p.angsuranPokok||Math.ceil(Number(p.jumlah)/Number(p.tenor||1)));
  const jasaBulan=Math.round(pokokBulan*0.20);
  return {pokokTagihan:Math.min(pokokBulan,sisaPokok), jasaTagihan:sisaPokok<=0?sisaJasa:Math.min(jasaBulan,sisaJasa), sisaPokok, sisaJasa};
}
function loadPinjaman(){
  const sel=document.getElementById("pinjamanSelect"); let html=`<option value="">Pilih Peminjam</option>`;
  Object.entries(dataPinjaman).forEach(([id,p])=>{
    const {sisaPokok,sisaJasa}=getSisaPinjaman(id);
    let label=(sisaPokok<=0&&sisaJasa<=0)?'LUNAS':`Sisa Pokok ${rupiah(sisaPokok)} | Jasa ${rupiah(sisaJasa)}`;
    let dis=(sisaPokok<=0&&sisaJasa<=0)?'disabled':'';
    let namaBersih=String(p.nama||"").replace(/ -$/,"").trim();
    html+=`<option value="${id}" ${dis}>${namaBersih} - ${p.nomor||id} | ${label}</option>`;
  });
  sel.innerHTML=html;
}
function renderRiwayat(){
  const list=document.getElementById("listTransaksi"); let html="";
  const arr=Object.entries(dataAngsuran).sort((a,b)=>Number(b[1].tanggal)-Number(a[1].tanggal));
  if(arr.length===0){list.innerHTML=`<div class="item">Belum ada transaksi</div>`; return;}
  arr.forEach(([id,a])=>{
    const tgl=a.tanggal?new Date(a.tanggal).toLocaleDateString("id-ID"):"-";
    let namaBersih=String(a.nama||"").replace(/ -$/,"").trim();
    html+=`<div class="item"><div><b>${namaBersih}</b><br><small>No: ${a.idPinjaman||'-'} | ${tgl}</small></div><div>Pokok ${rupiah(a.pokok)} | Jasa ${rupiah(a.jasa)} | Total <b>${rupiah(a.jumlahBayar)}</b></div><div class="btn-group"><button class="btn-primary" onclick="cetakNotaAngsuran('${id}')">🧾 Cetak</button><button class="btn-success" onclick="kirimNotaRiwayat('${id}')">📤 WA</button><button class="btn-warning" onclick="editAngsuran('${id}')">Edit</button></div></div>`;
  });
  list.innerHTML=html;
}

const jumlahBayarEl=document.getElementById("jumlahBayar"), pokokEl=document.getElementById("pokok"), jasaEl=document.getElementById("jasa"), simpananEl=document.getElementById("simpanan"), tanggalEl=document.getElementById("tanggal"), metodeEl=document.getElementById("metode"), btnNota=document.getElementById("btnNota");
document.getElementById("pinjamanSelect").onchange=function(){ pinIdAktif=this.value; updateInfo(); };
function updateInfo(){
  if(!pinIdAktif){document.getElementById("tagihan").value=""; jumlahBayarEl.value=""; pokokEl.value=""; jasaEl.value=""; simpananEl.value=""; document.getElementById("totalBayar").innerText=rupiah(0); document.getElementById("sisaPokok").innerText=rupiah(0); document.getElementById("sisaJasa").innerText=rupiah(0); return;}
  const {pokokTagihan,jasaTagihan,sisaPokok,sisaJasa}=hitungTagihanBerjalan(pinIdAktif);
  document.getElementById("tagihan").value=rupiah(pokokTagihan+jasaTagihan);
  document.getElementById("sisaPokok").innerText=rupiah(sisaPokok); document.getElementById("sisaJasa").innerText=rupiah(sisaJasa); hitungAlokasi();
}
function hitungAlokasi(){
  if(!pinIdAktif) return; const bayar=getNumber(jumlahBayarEl.value); const {pokokTagihan,jasaTagihan}=hitungTagihanBerjalan(pinIdAktif); const wajib=pokokTagihan+jasaTagihan; let p=0,j=0,s=0;
  if(bayar<=wajib){p=Math.min(bayar,pokokTagihan); j=Math.min(bayar-p,jasaTagihan);}else{p=pokokTagihan; j=jasaTagihan; s=bayar-wajib;}
  pokokEl.value=rupiah(p); jasaEl.value=rupiah(j); simpananEl.value=rupiah(s); document.getElementById("totalBayar").innerText=rupiah(bayar);
}
jumlahBayarEl.addEventListener("input", function(){ let a=this.value.replace(/\D/g,''); this.value=a?"Rp "+Number(a).toLocaleString("id-ID"):""; hitungAlokasi(); });

async function getAnggotaByPinjaman(pinjamanId){
  const p=dataPinjaman[pinjamanId]; if(!p) return null;
  if(p.anggotaId && dataAnggotaCache[p.anggotaId]){ const ag=dataAnggotaCache[p.anggotaId]; return {key:ag.key, idAnggota:ag.id||ag.idAnggota, nama:ag.nama, telepon:ag.telepon}; }
  for(let k in dataAnggotaCache){ if(dataAnggotaCache[k].id===p.idAnggota || dataAnggotaCache[k].idAnggota===p.idAnggota){ const ag=dataAnggotaCache[k]; return {key:k, idAnggota:ag.id, nama:ag.nama, telepon:ag.telepon}; } }
  let namaP=normalisasiNama(p.nama);
  for(let k in dataAnggotaCache){ if(normalisasiNama(dataAnggotaCache[k].nama)===namaP){ const ag=dataAnggotaCache[k]; return {key:k, idAnggota:ag.id, nama:ag.nama, telepon:ag.telepon}; } }
  return {key:p.anggotaId||pinjamanId, idAnggota:p.idAnggota||"-", nama:String(p.nama||"").replace(/ -$/,"").trim(), telepon:""};
}

document.getElementById("btnSimpan").onclick=async()=>{
  if(!pinIdAktif) return showToast("Pilih peminjam",true);
  const jumlahBayar=getNumber(jumlahBayarEl.value); const p=dataPinjaman[pinIdAktif]; const tanggal=new Date(tanggalEl.value).getTime()||Date.now(); const metode=metodeEl.value;
  if(!tanggalEl.value) return showToast("Isi tanggal",true); if(!metode) return showToast("Pilih metode",true); if(jumlahBayar<=0) return showToast("Isi jumlah bayar",true);
  const {pokokTagihan,jasaTagihan}=hitungTagihanBerjalan(pinIdAktif); let alP=0,alJ=0,alS=0; if(jumlahBayar<=pokokTagihan+jasaTagihan){alP=Math.min(jumlahBayar,pokokTagihan); alJ=Math.min(jumlahBayar-alP,jasaTagihan);}else{alP=pokokTagihan; alJ=jasaTagihan; alS=jumlahBayar-(pokokTagihan+jasaTagihan);}
  try{
    const anggota=await getAnggotaByPinjaman(pinIdAktif); if(!anggota) return showToast("Data anggota tidak ditemukan", true);
    const baru=push(angsuranRef);
    await set(baru,{pinjamanId:pinIdAktif, anggotaId:anggota.key, idAnggota:anggota.idAnggota, nama:anggota.nama, idPinjaman:p.nomor||pinIdAktif, tanggal, pokok:alP, jasa:alJ, bayarSimpanan:alS, jumlahBayar, metode});
    showToast(`Tersimpan ${anggota.nama}`); jumlahBayarEl.value=""; updateInfo(); btnNota.disabled=false; btnNota.onclick=()=>cetakNotaAngsuran(baru.key); cetakNotaAngsuran(baru.key);
  }catch(e){ showToast("Gagal: "+e.message,true); }
};

window.cetakNotaAngsuran=function(id){
  const a=dataAngsuran[id]; if(!a) return; const {jsPDF}=window.jspdf; const doc=new jsPDF("p","mm","a4"); let y=15;
  doc.text("KOPERASI ARFA DRIVER",105,y,{align:"center"}); y+=8; doc.text("Nama: "+a.nama,15,y); y+=6; doc.text("Tanggal: "+new Date(a.tanggal).toLocaleDateString("id-ID"),15,y); y+=6; doc.text("Total: "+rupiah(a.jumlahBayar),15,y); doc.save("nota_"+a.nama+".pdf");
};

window.kirimNotaRiwayat=async function(id){
  const a=dataAngsuran[id]; if(!a) return showToast("Data angsuran tidak ada",true);
  let ag=dataAnggotaCache[a.anggotaId];
  if(!ag){
    for(let k in dataAnggotaCache){
      if(dataAnggotaCache[k].id===a.idAnggota || dataAnggotaCache[k].idAnggota===a.idAnggota || normalisasiNama(dataAnggotaCache[k].nama)===normalisasiNama(a.nama)){
        ag=dataAnggotaCache[k]; break;
      }
    }
  }
  if(!ag){
    const snap=await get(ref(db,"anggota"));
    const all=snap.val()||{};
    for(let k in all){ if(normalisasiNama(all[k].nama)===normalisasiNama(a.nama)){ ag=all[k]; break; } }
  }
  if(!ag) return showToast("Anggota tidak ditemukan di master: "+a.nama, true);
  let noWA=normalisasiWA(ag.telepon);
  if(!noWA) return showToast("No WA kosong: "+ag.telepon+" ("+ag.nama+")", true);
  let pesan=`*BUKTI ANGSURAN*%0AKoperasi ARFA%0ANama: ${ag.nama}%0ANo: ${a.idPinjaman||'-'}%0ATgl: ${new Date(a.tanggal).toLocaleDateString('id-ID')}%0ABayar: ${rupiah(a.jumlahBayar)}%0APokok: ${rupiah(a.pokok)}%0AJasa: ${rupiah(a.jasa)} Terima kasih`;
  window.open(`https://wa.me/${noWA}?text=${pesan}`,'_blank');
};

window.editAngsuran=function(id){ const a=dataAngsuran[id]; if(!a) return; document.getElementById("editAngsuranId").value=id; document.getElementById("editAngsuranNama").value=String(a.nama||"").replace(/ -$/,"").trim(); document.getElementById("editAngsuranTanggal").value=a.tanggal?new Date(a.tanggal).toISOString().split("T")[0]:""; document.getElementById("editAngsuranMetode").value=a.metode||"cash"; document.getElementById("editJumlahBayar").value="Rp "+Number(a.jumlahBayar).toLocaleString("id-ID"); document.getElementById("modalEditAngsuran").classList.add("show"); };
window.tutupEditAngsuran=()=>document.getElementById("modalEditAngsuran").classList.remove("show");
document.getElementById("btnRiwayat").onclick=()=>{ const l=document.getElementById("listTransaksi"); l.style.display=l.style.display==="none"?"flex":"none"; };
document.getElementById("btnUpdateAngsuran").onclick=async()=>{ const id=document.getElementById("editAngsuranId").value; const jb=getNumber(document.getElementById("editJumlahBayar").value); await updateData(ref(db,"angsuran/"+id),{jumlahBayar:jb, tanggal:new Date(document.getElementById("editAngsuranTanggal").value).getTime(), metode:document.getElementById("editAngsuranMetode").value}); showToast("Update berhasil"); tutupEditAngsuran(); };
document.getElementById("btnHapusAngsuran").onclick=async()=>{ const id=document.getElementById("editAngsuranId").value; if(!confirm("Hapus?")) return; await remove(ref(db,"angsuran/"+id)); showToast("Hapus berhasil"); tutupEditAngsuran(); };
document.getElementById("tanggal").value=new Date().toISOString().split("T")[0];
</script>
</body>
</html>
