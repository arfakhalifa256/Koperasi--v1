/* =========================================================

========================================================= */

function rupiah(n){

  return Number(n || 0).toLocaleString(
    "id-ID",
    {
      style:"currency",
      currency:"IDR"
    }
  );

}


function getNumber(v){

  return parseInt(
    String(v || "").replace(/\D/g,"")
  ) || 0;

}


function showToast(message,error=false){

  const t =
    document.getElementById("toast");

  t.innerText = message;

  t.className =
    "toast show" + (error ? " error" : "");

  setTimeout(()=>{
    t.className="toast";
  },3500);

}


function normalisasiWA(no){

  let n =
    String(no || "")
      .replace(/\D/g,"");

  if(n.startsWith("0")){
    n = "62" + n.slice(1);
  }

  return /^62\d{9,14}$/.test(n)
    ? n
    : "";

}


function normalisasiNama(s){

  return String(s || "")
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"")
    .trim();

}


/* =========================================================
   TANGGAL
========================================================= */

function tanggalInputKeTimestamp(value){

  if(!value) return Date.now();

  const parts = value.split("-");

  if(parts.length !== 3){
    return Date.now();
  }

  const tahun = Number(parts[0]);
  const bulan = Number(parts[1]) - 1;
  const hari = Number(parts[2]);

  return new Date(
    tahun,
    bulan,
    hari,
    0,
    0,
    0,
    0
  ).getTime();

}


function timestampKeTanggalInput(timestamp){

  if(!timestamp) return "";

  const d = new Date(Number(timestamp));

  const tahun =
    d.getFullYear();

  const bulan =
    String(d.getMonth()+1).padStart(2,"0");

  const hari =
    String(d.getDate()).padStart(2,"0");

  return `${tahun}-${bulan}-${hari}`;

}

/* =========================================================
   CARI ID ANGGOTA
========================================================= */

function getMemberId(ag){

  if(!ag) return "";

  return String(
    ag.idAnggota ??
    ag.anggotaId ??
    ag.memberId ??
    ag.idMember ??
    ag.id ??
    ag.barcode ??
    ag.key ??
    ""
  );

}


/* =========================================================
   CARI ANGGOTA DARI PINJAMAN
========================================================= */

async function getAnggotaByPinjaman(pinjamanId){

  const p =
    dataPinjaman[pinjamanId];

  if(!p) return null;


  const kandidat = [
    p.anggotaId,
    p.idAnggota,
    p.memberId,
    p.idMember,
    p.barcode
  ]
  .filter(Boolean)
  .map(v=>String(v).trim().toUpperCase());


  /* CARI BERDASARKAN KEY */
  for(const k in dataAnggotaCache){

    const ag =
      dataAnggotaCache[k];

    const nilai = [
      k,
      ag.id,
      ag.idAnggota,
      ag.anggotaId,
      ag.memberId,
      ag.idMember,
      ag.barcode
    ]
    .filter(Boolean)
    .map(v=>String(v).trim().toUpperCase());

    if(kandidat.some(x=>nilai.includes(x))){

      return {
        key:k,
        idAnggota:getMemberId(ag),
        nama:ag.nama || p.nama || "",
        telepon:
          ag.telepon ||
          ag.noHp ||
          ag.hp ||
          ag.phone ||
          ""
      };

    }

  }


  /* CARI NAMA */
  const namaP =
    normalisasiNama(p.nama);

  if(namaP){

    for(const k in dataAnggotaCache){

      const ag =
        dataAnggotaCache[k];

      if(
        normalisasiNama(ag.nama) === namaP
      ){

        return {
          key:k,
          idAnggota:getMemberId(ag),
          nama:ag.nama || p.nama || "",
          telepon:
            ag.telepon ||
            ag.noHp ||
            ag.hp ||
            ag.phone ||
            ""
        };

      }

    }

  }


  return {
    key:
      p.anggotaId ||
      p.idAnggota ||
      pinjamanId,

    idAnggota:
      p.idAnggota ||
      p.anggotaId ||
      "-",

    nama:
      String(p.nama || "")
        .replace(/ -$/,"")
        .trim(),

    telepon:""
  };

}


/* =========================================================
   SISA PINJAMAN
   excludeId dipakai saat EDIT
========================================================= */

function getSisaPinjaman(
  id,
  excludeId=null
){

  const p =
    dataPinjaman[id];

  if(!p){

    return {
      sisaPokok:0,
      sisaJasa:0
    };

  }


  let bayarPokok = 0;
  let bayarJasa = 0;


  Object.values(dataAngsuran)
    .forEach(a=>{

      if(
        a.pinjamanId === id &&
        a.id !== excludeId
      ){

        bayarPokok +=
          Number(a.pokok || 0);

        bayarJasa +=
          Number(a.jasa || 0);

      }

    });


  return {

    sisaPokok:
      Math.max(
        0,
        Number(p.jumlah || 0) -
        bayarPokok
      ),

    sisaJasa:
      Math.max(
        0,
        Number(p.jasa || 0) -
        bayarJasa
      )

  };

}


/* =========================================================
   TAGIHAN BERJALAN
========================================================= */

function hitungTagihanBerjalan(
  id,
  excludeId=null
){

  const p =
    dataPinjaman[id];

  if(!p){

    return {
      pokokTagihan:0,
      jasaTagihan:0,
      sisaPokok:0,
      sisaJasa:0
    };

  }


  const {
    sisaPokok,
    sisaJasa
  } =
    getSisaPinjaman(
      id,
      excludeId
    );


  const pokokBulan =
    Number(
      p.angsuranPokok ||
      Math.ceil(
        Number(p.jumlah || 0) /
        Number(p.tenor || 1)
      )
    );


  const jasaBulan =
    Math.round(
      pokokBulan * 0.20
    );


  return {

    pokokTagihan:
      Math.min(
        pokokBulan,
        sisaPokok
      ),

    jasaTagihan:
      sisaPokok <= 0
        ? sisaJasa
        : Math.min(
            jasaBulan,
            sisaJasa
          ),

    sisaPokok,
    sisaJasa

  };

}


/* =========================================================
   LOAD PINJAMAN
========================================================= */

function loadPinjaman(){

  const sel =
    document.getElementById(
      "pinjamanSelect"
    );

  if(!sel) return;


  let html =
    `<option value="">Pilih Peminjam</option>`;


  Object.entries(dataPinjaman)
    .forEach(([id,p])=>{

      const {
        sisaPokok,
        sisaJasa
      } =
        getSisaPinjaman(id);


      const lunas =
        sisaPokok <= 0 &&
        sisaJasa <= 0;


      const label =
        lunas
          ? "LUNAS"
          : `Sisa Pokok ${rupiah(sisaPokok)} | Jasa ${rupiah(sisaJasa)}`;


      const namaBersih =
        String(p.nama || "")
          .replace(/ -$/,"")
          .trim();


      html += `
        <option
          value="${id}"
          ${lunas ? "disabled" : ""}
        >
          ${namaBersih} - ${p.nomor || id} | ${label}
        </option>
      `;

    });


  sel.innerHTML = html;

}


/* =========================================================
   RIWAYAT
========================================================= */

function renderRiwayat(){

  const list =
    document.getElementById(
      "listTransaksi"
    );

  let html = "";


  const arr =
    Object.entries(dataAngsuran)
      .sort(
        (a,b)=>
          Number(b[1].tanggal || 0) -
          Number(a[1].tanggal || 0)
      );


  if(arr.length === 0){

    list.innerHTML =
      `<div class="item">Belum ada transaksi</div>`;

    return;

  }


  arr.forEach(([id,a])=>{

    const tgl =
      a.tanggal
        ? new Date(
            Number(a.tanggal)
          ).toLocaleDateString("id-ID")
        : "-";


    const namaBersih =
      String(a.nama || "")
        .replace(/ -$/,"")
        .trim();


    html += `
      <div class="item">

        <div>
          <b>${namaBersih}</b><br>

          <small>
            No: ${a.idPinjaman || "-"}
            |
            ${tgl}
          </small>
        </div>

        <div style="margin-top:6px">
          Pokok ${rupiah(a.pokok)}
          |
          Jasa ${rupiah(a.jasa)}
          |
          Total
          <b>${rupiah(a.jumlahBayar)}</b>
        </div>

        <div class="btn-group">

          <button
            class="btn-primary"
            onclick="cetakNotaAngsuran('${id}')">
            🧾 Cetak
          </button>

          <button
            class="btn-success"
            onclick="kirimNotaRiwayat('${id}')">
            📤 WA
          </button>

          <button
            class="btn-warning"
            onclick="editAngsuran('${id}')">
            Edit
          </button>

        </div>

      </div>
    `;

  });


  list.innerHTML = html;

}

    pokokEl.value="";
    jasaEl.value="";

    document.getElementById(
      "sisaPokok"
    ).innerText=rupiah(0);

    document.getElementById(
      "sisaJasa"
    ).innerText=rupiah(0);

    return;

  }


  const {
    pokokTagihan,
    jasaTagihan,
    sisaPokok,
    sisaJasa
  } =
    hitungTagihanBerjalan(
      pinIdAktif
    );


  document.getElementById(
    "tagihan"

    rupiah(
      pokokTagihan +
      jasaTagihan

    "sisaPokok"

  document.getElementById(

    rupiah(sisaJasa);


  hitungAlokasi();

}

   ALOKASI PEMBAYARAN
========================================================= */

function hitungAlokasi(){

  if(!pinIdAktif) return;


  const bayar =
    getNumber(
      jumlahBayarEl.value
    );


  const {
    pokokTagihan,
    jasaTagihan
  } =
    hitungTagihanBerjalan(
      pinIdAktif
    );


  const wajib =
    pokokTagihan +
    jasaTagihan;


  let p=0;
  let j=0;
  let s=0;


  if(bayar <= wajib){

    p =
      Math.min(
        bayar,
        pokokTagihan
      );

    j =
      Math.min(
        bayar - p,
        jasaTagihan
      );

  }else{

    p =
      pokokTagihan;

    j =
      jasaTagihan;

    s =
      bayar - wajib;

  }


  pokokEl.value =
    rupiah(p);

  jasaEl.value =
    rupiah(j);

  simpananEl.value =
    rupiah(s);

  document.getElementById(
    "totalBayar"
  ).innerText =
    rupiah(bayar);

}


jumlahBayarEl.addEventListener(
  "input",
  function(){

    let a =
      this.value.replace(/\D/g,"");

    this.value =
      a
        ? "Rp " +
          Number(a)
            .toLocaleString("id-ID")
        : "";

    hitungAlokasi();

  }
);


/* =========================================================
   BUAT DATA TRANSAKSI KAS
========================================================= */

function buatPayloadKas(
  jumlah,
  kategori,
  tanggal,
  metode,
  angsuranId,
  anggotaId,
  idAnggota,
  nama
){

  return {

    jumlah:Number(jumlah || 0),

    kategori:kategori,

    tipe:"masuk",

    sumberKas:
      metode || "cash",

    tanggal:
      Number(tanggal),

    keterangan:
      `Angsuran ${nama || ""}`.trim(),

    angsuranId:
      angsuranId || "",

    anggotaId:
      anggotaId || "",

    idAnggota:
      idAnggota || "",

    nama:
      nama || "",

    dibuatPada:
      Date.now()

  };

}


/* =========================================================
   CARI TRANSAKSI KAS BERDASARKAN ANGSURAN
========================================================= */

async function cariKasAngsuran(
  angsuranId,
  kategori
){

  try{

    const snap =
      await get(kasRef);

    const data =
      snap.val() || {};


    for(const key in data){

      const x =
        data[key] || {};


      if(
        String(x.angsuranId || "") ===
        String(angsuranId) &&
        String(x.kategori || "") ===
        String(kategori)
      ){

        return {
          key,
          data:x
        };

      }

    }

  }catch(e){

    console.error(
      "Gagal mencari kas:",
      e
    );

  }

  return null;

}


/* =========================================================
   SINKRON SATU KOMPONEN KAS
========================================================= */

async function sinkronKasKomponen({

  angsuranId,
  anggotaId,
  idAnggota,
  nama,
  jumlah,
  kategori,
  tanggal,
  metode,
  kasIdLama

}){

  const nilai =
    Number(jumlah || 0);


  let kasId =
    kasIdLama || "";


  /* CARI ID LAMA JIKA BELUM TERSIMPAN */
  if(!kasId){

    const lama =
      await cariKasAngsuran(
        angsuranId,
        kategori
      );

    if(lama){
      kasId = lama.key;
    }

  }


  /* NILAI 0 = HAPUS */
  if(nilai <= 0){

    if(kasId){

      await remove(
        ref(
          db,
          "kas/transaksi/" +
          kasId
        )
      );

    }

    return "";

  }


  /* JIKA BELUM ADA, BUAT BARU */
  if(!kasId){

    const baru =
      push(kasRef);

    kasId =
      baru.key;

  }


  await set(
    ref(
      db,
      "kas/transaksi/" +
      kasId
    ),

    buatPayloadKas(
      nilai,
      kategori,
      tanggal,
      metode,
      angsuranId,
      anggotaId,
      idAnggota,
      nama
    )

  );


  return kasId;

}

window.kirimNotaRiwayat =
async function(id){

  const a =
    dataAngsuran[id];

  if(!a){

    return showToast(
      "Data angsuran tidak ada",
      true
    );

  }


  let ag =
    dataAnggotaCache[
      a.anggotaId
    ];


  if(!ag){

    for(
      const k in dataAnggotaCache
    ){

      const x =
        dataAnggotaCache[k];


      const nilai = [

        k,
        x.id,
        x.idAnggota,
        x.anggotaId,
        x.memberId,
        x.idMember,
        x.barcode

      ]
      .filter(Boolean)
      .map(
        v =>
          String(v)
            .trim()
            .toUpperCase()
      );


      const target = [

        a.anggotaId,
        a.idAnggota

      ]
      .filter(Boolean)
      .map(
        v =>
          String(v)
            .trim()
            .toUpperCase()
      );


      if(
        target.some(
          v=>nilai.includes(v)
        )
      ){

        ag=x;
        break;

      }

    }

  }


  if(!ag){

    const snap =
      await get(
        ref(db,"anggota")
      );


    const all =
      snap.val() || {};


    for(
      const k in all
    ){

      if(
        normalisasiNama(
          all[k].nama
        ) ===
        normalisasiNama(
          a.nama
        )
      ){

        ag = {
          key:k,
          ...all[k]
        };

        break;

      }

    }

  }


  if(!ag){

    return showToast(
      "Anggota tidak ditemukan di master: " +
      a.nama,
      true
    );

  }


  const noTelepon =
    ag.telepon ||
    ag.noHp ||
    ag.hp ||
    ag.phone ||
    "";


  const noWA =
    normalisasiWA(
      noTelepon
    );


  if(!noWA){

    return showToast(
      "No WA belum diisi untuk " +
      (ag.nama || a.nama),
      true
    );

  }


  const tanggal =
    new Date(
      Number(a.tanggal)
    ).toLocaleDateString(
      "id-ID"
    );


  const pesan =

`*BUKTI ANGSURAN*
Koperasi ARFA
Nama: ${ag.nama || a.nama}
No Pinjaman: ${a.idPinjaman || "-"}
Tanggal: ${tanggal}
Bayar: ${rupiah(a.jumlahBayar)}
Pokok: ${rupiah(a.pokok)}
Jasa: ${rupiah(a.jasa)}
Sukarela: ${rupiah(a.bayarSimpanan)}

Terima kasih.`;


  window.open(
    `https://wa.me/${noWA}?text=${
      encodeURIComponent(pesan)
    }`,
    "_blank"
  );

};

/* =========================================================
   HAPUS ANGSURAN + HAPUS KAS
========================================================= */

document
  .getElementById(
    "btnHapusAngsuran"
  )
  .onclick =
async function(){

  const id =
    document.getElementById(
      "editAngsuranId"
    ).value;


  const a =
    dataAngsuran[id];


  if(!a){

    return showToast(
      "Data angsuran tidak ditemukan",
      true
    );

  }


  if(
    !confirm(
      "Hapus angsuran ini?\n\n" +
      "Transaksi kas terkait juga akan dihapus."
    )
  ){

    return;

  }


  try{

    /*
     * CARI ID KAS DARI DATA ANGSURAN
     */

    const kasIds = new Set();


    if(a.kasPokokId)
      kasIds.add(a.kasPokokId);

    if(a.kasJasaId)
      kasIds.add(a.kasJasaId);

    if(a.kasSimpananId)
      kasIds.add(a.kasSimpananId);


    /*
     * CARI JUGA TRANSAKSI KAS LAMA
     * BERDASARKAN angsuranId
     */

    const snap =
      await get(kasRef);


    const semuaKas =
      snap.val() || {};


    for(
      const key in semuaKas
    ){

      const x =
        semuaKas[key] || {};


      if(
        String(x.angsuranId || "") ===
        String(id)
      ){

        kasIds.add(key);

      }

    }


    /*
     * MULTI LOCATION DELETE
     */

    const updates = {};


    updates[
      "angsuran/" + id
    ] = null;


    kasIds.forEach(kasId=>{

      updates[
        "kas/transaksi/" +
        kasId
      ] = null;

    });


    await updateData(
      ref(db),
      updates
    );


    showToast(
      "Angsuran dan transaksi kas berhasil dihapus"
    );


    tutupEditAngsuran();


  }catch(e){

    console.error(e);

    showToast(
      "Gagal hapus: " +
      e.message,
      true
    );

  }

};

      l.style.display === "none"
        ? "flex"
        : "none";

  };

const sekarang =
  new Date();


tanggalEl.value =
  [
    sekarang.getFullYear(),
    String(
      sekarang.getMonth()+1
    ).padStart(2,"0"),
    String(
      sekarang.getDate()
    ).padStart(2,"0")
  ].join("-");
