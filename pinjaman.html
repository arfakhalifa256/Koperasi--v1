<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Pinjaman V12 - Nota Persis SS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#3b82f6;--bg:#f1f5f9;--border:#e2e8f0}
body{font-family:'Poppins',sans-serif;background:var(--bg);font-size:13px;color:#1f2937}
header{background:linear-gradient(to right,#1e90ff,#0f3057);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:101}
.container{padding:14px;max-width:1200px;margin:0 auto}
.card{background:#fff;padding:16px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:1px solid var(--border)}
.form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;position:relative}
.form-group label{font-size:11px;font-weight:600;color:#6b7280}
.form-group input,.form-group select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;background:#fff}
.btn-primary{width:100%;padding:10px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;margin-top:3px}
.pinjaman-card{background:#f8fafc;border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.pinjaman-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.pinjaman-actions button{flex:1;padding:7px 8px;border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;min-width:75px}
.btn-edit{background:#f59e0b;color:#fff}.btn-delete{background:#dc2626;color:#fff}.btn-nota{background:#0f3057;color:#fff}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:2000;padding:10px}
.popup-box{background:#fff;padding:20px;border-radius:16px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto}
.popup-box.large{max-width:640px}
.popup-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.popup-btns button{flex:1;padding:9px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.btn-update{background:var(--primary);color:#fff}.btn-cancel{background:#e5e7eb;color:#111}
.custom-alert{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.custom-alert-box{width:100%;max-width:320px;background:#fff;border-radius:18px;padding:24px 20px;text-align:center}
.search-list{position:absolute;top:62px;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;max-height:240px;overflow:auto;display:none;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.s-item{padding:9px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:12px;display:flex;justify-content:space-between}
.s-item:hover{background:#eff6ff}
.nota-badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700}
.badge-sudah{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.badge-belum{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
</style>
</head>
<body>
<header>DATA PINJAMAN V12 - NOTA PERSIS SS</header>
<div class="container">
  <div class="card">
    <h3 style="background:#ffedd5;text-align:center;padding:10px;border-radius:10px;margin-bottom:12px">Tambah Pinjaman + Bukti</h3>
    <div class="form-group"><label>Anggota</label><input type="text" id="anggotaSearch" placeholder="🔍 Ketik nama..." autocomplete="off"><div id="anggotaList" class="search-list"></div><input type="hidden" id="anggota"><div id="anggotaTerpilih" style="display:none;margin-top:6px;background:#eff6ff;padding:6px 10px;border-radius:8px;font-size:11px"></div></div>
    <div class="form-group"><label>No Telepon</label><input type="text" id="telepon" readonly></div>
    <div class="form-group"><label>No Pinjaman</label><input type="text" id="noPinjaman" disabled></div>
    <div class="form-group"><label>Tanggal</label><input type="date" id="tanggal"></div>
    <div class="form-group"><label>Metode</label><select id="metode"><option value="">Pilih</option><option value="cash">Cash</option><option value="bank">Bank</option></select></div>
    <div class="form-group"><label>Jumlah</label><input type="number" id="jumlah" oninput="hitungJasa()"></div>
    <div class="form-group"><label>Jasa 20%</label><input type="number" id="jasa" readonly></div>
    <div class="form-group" id="groupBukti" style="display:none;background:#fffbeb;border:2px dashed #f59e0b;padding:12px;border-radius:12px"><label>📎 Bukti Transfer</label><input type="file" id="buktiTransfer" accept="image/*"><div id="previewBukti"></div><input type="hidden" id="buktiBase64"></div>
    <div class="form-group"><label>Keterangan</label><input type="text" id="ket"></div>
    <button class="btn-primary" onclick="simpanPinjaman()">💾 Simpan</button>
    <button class="btn-primary" style="background:#fff;color:#1f2937;border:1px solid var(--border);margin-top:8px" onclick="bukaRiwayat()">📋 Lihat Pinjaman (<span id="jmlPinjaman">0</span>)</button>
  </div>
</div>

<div id="popupRiwayat" class="popup"><div class="popup-box large">
  <div style="display:flex;justify-content:space-between"><h3>Daftar Pinjaman</h3><button onclick="tutupRiwayat()" style="background:#dc2626;padding:6px 12px;color:#fff;border:none;border-radius:8px">✕</button></div>
  <input type="text" id="searchPinjaman" placeholder="Cari..." style="width:100%;padding:9px;margin:10px 0;border:1px solid #e2e8f0;border-radius:8px">
  <div id="tabelPinjaman" style="max-height:75vh;overflow-y:auto"></div>
</div></div>

<div id="popupEdit" class="popup"><div class="popup-box">
  <h3>Edit</h3>
  <div class="form-group"><label>No Pinjaman</label><input type="text" id="editNoPinjaman" disabled></div>
  <div class="form-group"><label>Anggota</label><input type="text" id="editAnggotaSearch"><div id="editAnggotaList" class="search-list"></div><input type="hidden" id="editAnggota"></div>
  <div class="form-group"><label>Tanggal</label><input type="date" id="editTanggal"></div>
  <div class="form-group"><label>Metode</label><select id="editMetode"><option value="cash">Cash</option><option value="bank">Bank</option></select></div>
  <div class="form-group"><label>Jumlah</label><input type="number" id="editJumlah" oninput="hitungJasaEdit()"></div>
  <div class="form-group"><label>Jasa</label><input type="number" id="editJasa" readonly></div>
  <div class="form-group"><label>Bukti</label><div id="editPreviewBukti"></div><input type="file" id="editBuktiTransfer" accept="image/*"><div id="editPreviewBaru"></div><input type="hidden" id="editBuktiBase64"></div>
  <div class="form-group"><label>Keterangan</label><input type="text" id="editKet"></div>
  <div class="popup-btns"><button class="btn-update" onclick="updatePinjaman()">Update</button><button class="btn-cancel" onclick="tutupPopup()">Batal</button></div>
</div></div>

<!-- POPUP NOTA TANPA IFRAME - BUKA LANGSUNG -->
<div id="popupNota" class="popup" style="z-index:3000"><div class="popup-box large" style="max-width:400px;text-align:center">
  <h3 id="judulPreviewNota" style="font-size:14px">Nota Siap</h3>
  <div style="background:#f8fafc;border:2px dashed #cbd5e1;border-radius:12px;padding:18px;margin:14px 0">
    <div style="font-size:38px">📄</div>
    <b id="namaNotaPreview" style="font-size:12px"></b><br>
    <small id="statusNotaUpload" style="font-size:11px"></small>
  </div>
  <div class="popup-btns">
    <button style="background:#0f3057;color:#fff" onclick="bukaNotaTemp()">👁️ Buka PDF</button>
    <button style="background:#10b981;color:#fff" onclick="downloadNotaTemp()">📥 Download</button>
  </div>
  <div class="popup-btns" style="margin-top:8px">
    <button style="background:#3b82f6;color:#fff" onclick="uploadNotaTemp()">☁️ Simpan ke Riwayat</button>
    <button class="btn-cancel" onclick="tutupNotaPopup()">Tutup</button>
  </div>
</div></div>

<div id="customAlert" class="custom-alert"><div class="custom-alert-box"><div id="alertText"></div><button onclick="tutupAlert()" style="background:#3b82f6;padding:10px;border-radius:10px;color:#fff;width:100%;margin-top:10px;border:0">OK</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, update, remove, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const anggotaRef=ref(db,"anggota"), pinjamanRef=ref(db,"pinjaman"), angsuranRef=ref(db,"angsuran"), kasTransaksiRef=ref(db,"kas/transaksi");
let dataPinjaman={}, dataAnggota={}, dataAnggotaList=[], dataAngsuran={}, editId=null;
let tempNotaBase64=null, tempNotaBlobUrl=null, tempNotaId=null, tempNotaNama="", tempNotaNomor="";
const format=x=>new Intl.NumberFormat("id-ID").format(Number(x)||0);
const inputDate=t=>{if(!t) return ""; const d=new Date(Number(t)); return isNaN(d.getTime())?"":new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
const formatTanggal=t=>{if(!t) return "-"; const d=new Date(Number(t)); return isNaN(d.getTime())?"-":d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});};
const escapeHTML=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showAlert(m){document.getElementById("alertText").innerText=m; document.getElementById("customAlert").style.display="flex";}
window.tutupAlert=()=>document.getElementById("customAlert").style.display="none";
window.hitungJasa=()=>{document.getElementById("jasa").value=Math.round(Number(document.getElementById("jumlah").value||0)*0.2);};
window.hitungJasaEdit=()=>{document.getElementById("editJasa").value=Math.round(Number(document.getElementById("editJumlah").value||0)*0.2);};
function kompresFoto(file,cb){const r=new FileReader(); r.onload=e=>{const img=new Image(); img.onload=()=>{const c=document.createElement("canvas"); const maxW=900; const sc=Math.min(1,maxW/img.width); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); cb(c.toDataURL("image/jpeg",0.65));}; img.src=e.target.result;}; r.readAsDataURL(file);}
function dataURLToBlob(dataurl){try{const arr=dataurl.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]); let n=bstr.length; const u8arr=new Uint8Array(n); while(n--){u8arr[n]=bstr.charCodeAt(n);} return new Blob([u8arr],{type:mime});}catch(e){return null;}}
function revokeTempBlob(){if(tempNotaBlobUrl){URL.revokeObjectURL(tempNotaBlobUrl); tempNotaBlobUrl=null;}}
onValue(anggotaRef,snap=>{dataAnggota=snap.val()||{}; dataAnggotaList=Object.entries(dataAnggota).map(([k,m])=>({id:k,nama:String(m?.nama||"").trim(),idAnggota:String(m?.idAnggota||""),telepon:String(m?.telepon||m?.noHp||"")})).filter(x=>x.nama&&!x.nama.endsWith("-")).sort((a,b)=>a.nama.localeCompare(b.nama,"id")); initSearchable();});
onValue(pinjamanRef,snap=>{dataPinjaman={}; snap.forEach(c=>{const v=c.val(); if(v&&typeof v==="object") dataPinjaman[c.key]={...v,id:c.key};}); document.getElementById("jmlPinjaman").innerText=Object.keys(dataPinjaman).length; renderPinjaman();});
onValue(angsuranRef,snap=>{dataAngsuran=snap.val()||{};});
function initSearchable(){
  const s=document.getElementById("anggotaSearch"), l=document.getElementById("anggotaList"), h=document.getElementById("anggota"), t=document.getElementById("telepon");
  const es=document.getElementById("editAnggotaSearch"), el=document.getElementById("editAnggotaList"), eh=document.getElementById("editAnggota");
  function rend(f,target,onSel){const ff=f.toLowerCase().trim(); let filtered=ff?dataAnggotaList.filter(x=>x.nama.toLowerCase().includes(ff)):dataAnggotaList.slice(0,30); target.innerHTML=filtered.slice(0,50).map(x=>`<div class="s-item" data-id="${escapeHTML(x.id)}"><div><b>${escapeHTML(x.nama)}</b><br><small>${escapeHTML(x.idAnggota)}</small></div><small>pilih</small></div>`).join(''); target.querySelectorAll(".s-item").forEach(e=>{e.onclick=()=>onSel(e.dataset.id);});}
  function pilih(id){const x=dataAnggotaList.find(v=>v.id===id); if(!x) return; h.value=x.id; s.value=x.nama; t.value=x.telepon||"-"; document.getElementById("anggotaTerpilih").style.display="block"; document.getElementById("anggotaTerpilih").innerText="✅ "+x.nama; l.style.display="none";}
  function pilihE(id){const x=dataAnggotaList.find(v=>v.id===id); if(!x) return; eh.value=x.id; es.value=x.nama; el.style.display="none";}
  s.onfocus=()=>{l.style.display="block"; rend(s.value,l,pilih);}; s.oninput=()=>{h.value=""; t.value=""; document.getElementById("anggotaTerpilih").style.display="none"; l.style.display="block"; rend(s.value,l,pilih);};
  es.onfocus=()=>{el.style.display="block"; rend(es.value,el,pilihE);}; es.oninput=()=>{eh.value=""; el.style.display="block"; rend(es.value,el,pilihE);};
}
function renderPinjaman(){
  const tabel=document.getElementById("tabelPinjaman"); const search=(document.getElementById("searchPinjaman")?.value||"").toLowerCase().trim();
  let list=Object.values(dataPinjaman).sort((a,b)=>Number(b.tanggal||0)-Number(a.tanggal||0));
  if(search) list=list.filter(p=>String(p.nama||"").toLowerCase().includes(search)||String(p.nomor||"").toLowerCase().includes(search));
  tabel.innerHTML=""; if(!list.length){tabel.innerHTML='<div style="padding:20px;text-align:center;color:#6b7280">Tidak ada data</div>'; return;}
  list.forEach(p=>{
    const jasa=Number(p.jasa??Math.round(Number(p.jumlah||0)*0.2));
    const bukti=p.buktiBase64?`<div style="margin-top:6px"><img src="${p.buktiBase64}" style="width:100%;max-width:200px;border-radius:10px;border:1px solid #e2e8f0"></div>`:`<small style="color:#94a3b8">Tanpa bukti</small>`;
    // TIDAK GABUNG IFRAME - CUMA BADGE STATUS
    let notaInfo="";
    if(p.notaPencairanBase64){
      notaInfo=`<div style="margin-top:10px;background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center">
        <span class="nota-badge badge-sudah">✅ Nota Tersimpan</span>
        <small style="font-size:9px">${p.notaPencairanTgl?new Date(Number(p.notaPencairanTgl)).toLocaleString("id-ID"):""}</small>
      </div>
      <div style="display:flex;gap:6px;margin-top:6px"><button onclick="lihatNotaTersimpan('${p.id}')" style="flex:1;padding:7px;background:#0f3057;color:#fff;border:none;border-radius:8px">👁️ Buka PDF</button><button onclick="downloadNotaTersimpan('${p.id}')" style="flex:1;padding:7px;background:#10b981;color:#fff;border:none;border-radius:8px">📥 Download</button><button onclick="hapusNotaTersimpan('${p.id}')" style="padding:7px;background:#fee2e2;color:#dc2626;border:none;border-radius:8px">🗑️</button></div>`;
    }else{
      notaInfo=`<div style="margin-top:10px"><span class="nota-badge badge-belum">⚠️ Belum ada Nota</span></div>`;
    }
    const div=document.createElement("div"); div.className="pinjaman-card";
    div.innerHTML=`<div style="display:flex;justify-content:space-between"><b>${escapeHTML(p.nomor||"-")}</b><span style="font-size:11px;color:#334155">${escapeHTML(p.nama||"")}</span></div><div style="font-size:11px;margin-top:4px">${formatTanggal(p.tanggal)} • Rp ${format(p.jumlah)} + Jasa Rp ${format(jasa)}</div>${bukti}${notaInfo}<div class="pinjaman-actions" style="margin-top:10px"><button class="btn-nota" onclick="cetakNota('${p.id}')">📄 Buat Nota</button><button class="btn-edit" onclick="editPinjaman('${p.id}')">Edit</button><button class="btn-delete" onclick="hapusPinjaman('${p.id}')">Hapus</button></div>`;
    tabel.appendChild(div);
  });
}
document.getElementById("searchPinjaman")?.addEventListener("input",renderPinjaman);
window.bukaRiwayat=()=>{document.getElementById("popupRiwayat").style.display="flex"; renderPinjaman();};
window.tutupRiwayat=()=>document.getElementById("popupRiwayat").style.display="none";
window.tutupPopup=()=>{document.getElementById("popupEdit").style.display="none"; editId=null;};
async function previewNoPinjaman(){const snap=await get(ref(db,"counter/pinjaman")); let no=(snap.val()||0)+1; return "PJ"+String(no).padStart(3,"0");}
async function generateNoPinjaman(){const c=ref(db,"counter/pinjaman"); const r=await runTransaction(c,v=>(v||0)+1); return "PJ"+String(r.snapshot.val()).padStart(3,"0");}
window.addEventListener("load",async()=>{document.getElementById("tanggal").value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10); try{document.getElementById("noPinjaman").value=await previewNoPinjaman();}catch(e){document.getElementById("noPinjaman").value="Otomatis";}});
document.getElementById("metode").addEventListener("change",function(){const g=document.getElementById("groupBukti"); if(this.value==="bank") g.style.display="flex"; else{ g.style.display="none"; document.getElementById("buktiBase64").value=""; document.getElementById("previewBukti").innerHTML="";}});
document.getElementById("buktiTransfer").addEventListener("change",e=>{const f=e.target.files?.[0]; if(!f) return; kompresFoto(f,b=>{document.getElementById("buktiBase64").value=b; document.getElementById("previewBukti").innerHTML=`<img src="${b}" style="width:100%;max-width:200px;border-radius:10px">`;});});
window.simpanPinjaman=async()=>{
  const id=document.getElementById("anggota").value; if(!id) return showAlert("Pilih anggota dulu");
  const ag=dataAnggota[id]; const tgl=document.getElementById("tanggal").value; const jml=Number(document.getElementById("jumlah").value); const met=document.getElementById("metode").value;
  if(!tgl||!met||!jml) return showAlert("Lengkapi form");
  const nomor=await generateNoPinjaman(); const tanggal=new Date(tgl+"T00:00:00").getTime(); const bukti=document.getElementById("buktiBase64").value||"";
  const kas=await push(kasTransaksiRef,{tanggal,keterangan:`Pinjaman ${ag.nama} (${nomor})`,tipe:"keluar",kategori:"pinjaman",sumberKas:met,jumlah:jml,idAnggota:id,namaAnggota:ag.nama});
  await push(pinjamanRef,{nomor,idAnggota:id,nama:ag.nama,tanggal,jumlah:jml,jasa:Math.round(jml*0.2),sumberKas:met,ket:document.getElementById("ket").value,kasId:kas.key,status:"belum",buktiBase64:bukti});
  document.getElementById("jumlah").value=""; document.getElementById("jasa").value=""; document.getElementById("buktiBase64").value=""; document.getElementById("previewBukti").innerHTML=""; document.getElementById("groupBukti").style.display="none"; document.getElementById("anggotaSearch").value=""; document.getElementById("anggota").value=""; document.getElementById("telepon").value=""; document.getElementById("anggotaTerpilih").style.display="none"; document.getElementById("noPinjaman").value=await previewNoPinjaman(); bukaRiwayat();
};
window.editPinjaman=id=>{const p=dataPinjaman[id]; editId=id; document.getElementById("editNoPinjaman").value=p.nomor; document.getElementById("editAnggota").value=p.idAnggota; document.getElementById("editAnggotaSearch").value=p.nama; document.getElementById("editTanggal").value=inputDate(p.tanggal); document.getElementById("editMetode").value=p.sumberKas; document.getElementById("editJumlah").value=p.jumlah; document.getElementById("editJasa").value=p.jasa; document.getElementById("editKet").value=p.ket||""; document.getElementById("editBuktiBase64").value=p.buktiBase64||""; document.getElementById("editPreviewBukti").innerHTML=p.buktiBase64?`<img src="${p.buktiBase64}" style="width:100%">`:"Belum ada"; document.getElementById("popupEdit").style.display="flex";};
window.updatePinjaman=async()=>{if(!editId) return; let pL=dataPinjaman[editId]; let tanggal=new Date(document.getElementById("editTanggal").value+"T00:00:00").getTime(); let jml=Number(document.getElementById("editJumlah").value); let jasa=Number(document.getElementById("editJasa").value); let met=document.getElementById("editMetode").value; let bukti=document.getElementById("editBuktiBase64").value||""; const up={}; up[`/pinjaman/${editId}`]={...pL,tanggal,jumlah:jml,jasa,sumberKas:met,ket:document.getElementById("editKet").value,buktiBase64:bukti}; await update(ref(db),up); tutupPopup(); bukaRiwayat();};
window.hapusPinjaman=async id=>{if(!confirm("Hapus?")) return; let p=dataPinjaman[id]; await remove(ref(db,`pinjaman/${id}`)); if(p.kasId) await remove(ref(db,`kas/transaksi/${p.kasId}`)); renderPinjaman();};

// === CETAK NOTA PERSIS SEPERTI SS BOS ===
window.cetakNota=async id=>{
  const p=dataPinjaman[id]; if(!p) return showAlert("Data tidak ketemu");
  const {jsPDF}=window.jspdf;
  // ukuran 80mm x 200mm kayak struk
  const doc=new jsPDF({unit:"mm",format:[80,200]}); 
  let y=6;
  const rupiah=n=>"Rp "+Number(n||0).toLocaleString("id-ID");
  const tglIndo=t=>{
    if(!t) return "-";
    const d=new Date(Number(t));
    return d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  };
  const tglJam = new Date().toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  
  function dashedLine(yy){
    doc.setLineDash([1.5,1.5],0);
    doc.setDrawColor(0);
    doc.line(4,yy,76,yy);
    doc.setLineDash([]);
  }
  function dashedRect(){
    doc.setLineDash([1.2,1.2],0);
    doc.rect(2,2,76,190);
    doc.setLineDash([]);
  }
  function row(left,right,bold=false,size=9){
    doc.setFontSize(size);
    doc.setFont("helvetica",bold?"bold":"normal");
    doc.text(left,6,y);
    doc.text(right,74,y,{align:"right"});
    y+=5;
  }

  dashedRect();
  // Header
  doc.setFontSize(13); doc.setFont("helvetica","bold");
  doc.text("KOPERASI ARFA DRIVER",40,y,{align:"center"}); y+=6;
  doc.setFontSize(11); doc.text("BUKTI PENCAIRAN PINJAMAN",40,y,{align:"center"}); y+=8;
  dashedLine(y); y+=7;

  // Data pinjaman
  doc.setFontSize(9); doc.setFont("helvetica","normal");
  row("No Pinjam", p.nomor||"-");
  row("Tanggal", tglIndo(p.tanggal));
  row("Nama", p.nama||"-");
  // No Anggota ambil dari dataAnggota kalau ada
  const noAnggota = dataAnggota[p.idAnggota]?.idAnggota || "-";
  row("No Anggota", noAnggota);
  row("Metode", (p.sumberKas||"-").toUpperCase());
  y+=2; dashedLine(y); y+=7;

  // Rincian
  doc.setFontSize(11); doc.setFont("helvetica","bold");
  doc.text("RINCIAN",6,y); y+=6;
  doc.setFontSize(9); doc.setFont("helvetica","normal");
  const jasa=Number(p.jasa??Math.round(Number(p.jumlah||0)*0.2));
  row("Jumlah Pinjam", rupiah(p.jumlah));
  row("Jasa 20%", rupiah(jasa));
  y+=2; dashedLine(y); y+=8;

  // Total
  doc.setFontSize(13); doc.setFont("helvetica","bold");
  doc.text("TOTAL TERIMA",6,y);
  doc.text(rupiah(p.jumlah),74,y,{align:"right"}); y+=6;
  doc.setFontSize(9); doc.setFont("helvetica","bold");
  doc.text(`Total Kembali: ${rupiah(Number(p.jumlah||0)+jasa)}`,6,y); y+=8;
  dashedLine(y); y+=8;

  // Ket
  if(p.ket){
    doc.setFontSize(10); doc.setFont("helvetica","bold");
    doc.text(`Ket: ${p.ket}`,6,y); y+=7;
    dashedLine(y); y+=8;
  }

  // Footer
  doc.setFontSize(9); doc.setFont("helvetica","normal");
  doc.text("- Simpan sebagai bukti sah -",40,y,{align:"center"}); y+=6;
  doc.setFont("helvetica","bold"); doc.text("Terima kasih",40,y,{align:"center"}); y+=6;
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  doc.text(tglJam,40,y,{align:"center"});

  // LANGSUNG BUKA PDF DI TAB BARU
  const blob=doc.output('blob');
  revokeTempBlob();
  tempNotaBlobUrl=URL.createObjectURL(blob);
  tempNotaBase64=doc.output('datauristring');
  tempNotaId=id; tempNotaNama=p.nama; tempNotaNomor=p.nomor;

  window.open(tempNotaBlobUrl, '_blank');

  document.getElementById('judulPreviewNota').innerText=`Nota ${p.nomor} Siap`;
  document.getElementById('namaNotaPreview').innerText=`${p.nomor} - ${p.nama} - ${rupiah(p.jumlah)}`;
  document.getElementById('statusNotaUpload').innerText=p.notaPencairanBase64?"✅ Sudah pernah disimpan, PDF sudah terbuka":"✅ PDF sudah terbuka di tab baru - Klik Simpan ke Riwayat";
  document.getElementById('popupNota').style.display="flex";
};

window.tutupNotaPopup=()=>{document.getElementById('popupNota').style.display="none"; revokeTempBlob();};
window.bukaNotaTemp=()=>{ if(!tempNotaBlobUrl){ if(tempNotaBase64){ const blob=dataURLToBlob(tempNotaBase64); tempNotaBlobUrl=URL.createObjectURL(blob);} else return showAlert("Belum ada nota"); } window.open(tempNotaBlobUrl,'_blank'); };
window.downloadNotaTemp=()=>{ if(!tempNotaBase64) return showAlert("Belum ada nota"); const a=document.createElement('a'); a.href=tempNotaBase64; a.download=`Nota_${tempNotaNomor}_${tempNotaNama}.pdf`; a.click(); };
window.uploadNotaTemp=async()=>{
  if(!tempNotaBase64||!tempNotaId) return showAlert("Buat nota dulu");
  const st=document.getElementById('statusNotaUpload'); st.innerText="⏳ Menyimpan...";
  try{
    await update(ref(db),{ [`/pinjaman/${tempNotaId}/notaPencairanBase64`]:tempNotaBase64, [`/pinjaman/${tempNotaId}/notaPencairanTgl`]:Date.now() });
    st.innerText="✅ Berhasil disimpan ke riwayat"; showAlert("✅ Nota berhasil disimpan"); renderPinjaman();
  }catch(e){ st.innerText="❌ Gagal: "+e.message; }
};
window.lihatNotaTersimpan=id=>{
  const p=dataPinjaman[id]; if(!p?.notaPencairanBase64) return showAlert("Belum ada nota");
  const blob=dataURLToBlob(p.notaPencairanBase64);
  if(blob){ const url=URL.createObjectURL(blob); window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),8000); }
  else{ window.open(p.notaPencairanBase64,'_blank'); }
};
window.downloadNotaTersimpan=id=>{const p=dataPinjaman[id]; if(!p?.notaPencairanBase64) return; const a=document.createElement('a'); a.href=p.notaPencairanBase64; a.download=`Nota_${p.nomor}_${p.nama}.pdf`; a.click();};
window.hapusNotaTersimpan=async id=>{if(!confirm("Hapus nota tersimpan?")) return; await update(ref(db),{ [`/pinjaman/${id}/notaPencairanBase64`]:null, [`/pinjaman/${id}/notaPencairanTgl`]:null }); showAlert("Nota dihapus"); renderPinjaman();};
document.getElementById("editBuktiTransfer").addEventListener("change",e=>{const f=e.target.files?.[0]; if(!f) return; kompresFoto(f,b=>{document.getElementById("editBuktiBase64").value=b; document.getElementById("editPreviewBaru").innerHTML=`<img src="${b}" style="width:100%;max-width:200px;border-radius:10px">`;});});
</script>
</body>
</html>
