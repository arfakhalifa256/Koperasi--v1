<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Kartu Anggota - Koperasi ARFA</title>
<meta property="og:title" content="Kartu Anggota Koperasi ARFA">
<meta property="og:description" content="Scan kartu anggota resmi">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:#ffedd5;color:#1f2937;padding:12px;max-width:650px;margin:auto}
.head{background:linear-gradient(135deg,#0f3057,#1e90ff);color:#fff;padding:16px;border-radius:20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.06);margin-bottom:12px;border:1px solid #eef2f7}
.search{position:sticky;top:10px;z-index:10;display:flex;gap:8px;margin-bottom:12px;background:#ffedd5;padding:4px 0}
.search input{flex:1;padding:13px 14px;border-radius:14px;border:1px solid #e2e8f0;outline:none;font-size:13px}
.btn{padding:11px 15px;border-radius:12px;border:none;color:#fff;font-weight:700;cursor:pointer}
.btn-primary{background:#1e90ff}.btn-wa{background:#25D366}
.profile{display:flex;gap:12px;align-items:center}
.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#dbeafe,#1e90ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex-shrink:0}
.badge{padding:5px 12px;border-radius:20px;font-size:10px;font-weight:800;margin-top:5px;border:1px solid;display:inline-block}
.badge-lunas{background:#dcfce7;color:#15803d;border-color:#86efac}.badge-belum{background:#fee2e2;color:#b91c1c;border-color:#fca5a5}.badge-aktif{background:#dbeafe;color:#1d4ed8}
.qr-section{margin-top:14px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:15px;padding:14px;text-align:center}
.qr{display:flex;justify-content:center;min-height:140px;align-items:center}.barcode{margin-top:12px;display:flex;justify-content:center;min-height:60px}
.valid{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;font-weight:800;text-align:center}
.valid.lunas{background:#dcfce7;color:#166534}.valid.belum{background:#fee2e2;color:#991b1b}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.summary-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px}.summary-label{font-size:9px;color:#64748b}.summary-value{font-size:13px;font-weight:800;margin-top:2px}
.loading{text-align:center;padding:40px;color:#64748b}
.wa-notice{background:#fff3cd;border:1px solid #ffe69c;padding:10px;border-radius:12px;font-size:11px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="head"><div><div style="font-weight:800">👤 Kartu Anggota</div><small id="scanInfo">Memuat data...</small></div><a href="dashboard.html" style="color:#fff;background:rgba(255,255,255,.18);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none"><span class="material-icons">home</span></a></div>

<div id="waNotice" class="wa-notice">📱 Dibuka dari WhatsApp - Jika barcode tidak muncul, klik <b>Buka di Chrome</b> di pojok kanan atas WA.</div>

<div class="search" id="searchBar"><input id="inputCari" placeholder="Cari ID / Nama / HP..."><button class="btn btn-primary" onclick="cariAnggota(document.getElementById('inputCari').value)">Cari</button></div>

<div id="hasil"><div class="card loading">⏳ Menghubungkan ke server...</div></div>

<script>
const BASE_URL = "https://koperasiarfa.my.id/cari-anggota.html";
const urlParams = new URLSearchParams(location.search);
const SCAN_CODE = (urlParams.get("scan") || urlParams.get("cari") || "").trim().toUpperCase();
const IS_WA = /WhatsApp|FBAN|FBAV/i.test(navigator.userAgent) || urlParams.has("scan");

if(IS_WA) document.getElementById("waNotice").style.display="block";
if(SCAN_CODE) document.getElementById("searchBar").style.display="none";

const firebaseConfig={databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let anggota={}, pinjaman={}, angsuran={}, siap=false;

function norm(v){return String(v??"").trim().toUpperCase();}
function safe(v){return String(v==null?"":v).trim();}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function rupiah(n){return "Rp "+(Number(n)||0).toLocaleString("id-ID");}
function getId(a){return norm(a.idAnggota||a.anggotaId||a.id||"");}
function getNama(a){return safe(a.nama);}

// LOGIKA BENAR - SAMA KAYAK DASHBOARD
function hitung(idAnggota, key){
  let totalPokok=0, totalJasa=0, pokokBayar=0, jasaBayar=0;
  const aliasAnggota = new Set([safe(idAnggota).toLowerCase(), safe(key).toLowerCase()].filter(Boolean));
  Object.entries(pinjaman).forEach(([pid,p])=>{
    const kandidat = [p?.idAnggota,p?.anggotaId,p?.memberId,p?.kodeAnggota].map(safe).map(s=>s.toLowerCase());
    if(!kandidat.some(x=>x && aliasAnggota.has(x))) return;
    const pokok=Number(p?.jumlah??p?.pokok??0);
    const jasa=Number(p?.jasa??Math.round(pokok*0.20));
    const aliasPin = new Set([pid,p?.id,p?.idPinjaman,p?.noPinjaman,p?.nomor].map(safe).map(s=>s.toLowerCase()).filter(Boolean));
    let bp=0,bj=0;
    Object.values(angsuran).forEach(a=>{
      const k2=[a?.pinjamanId,a?.idPinjaman,a?.idLoan,a?.noPinjaman,a?.id].map(safe).map(s=>s.toLowerCase());
      if(!k2.some(x=>x && aliasPin.has(x))) return;
      bp+=Number(a?.pokok||0); bj+=Number(a?.jasa||0);
    });
    totalPokok+=pokok; totalJasa+=jasa; pokokBayar+=bp; jasaBayar+=bj;
  });
  return {totalPokok,totalJasa,total:totalPokok+totalJasa,pokokBayar,jasaBayar,sisa:Math.max(0,(totalPokok+totalJasa)-(pokokBayar+jasaBayar))};
}

// GANTI BAGIAN Promise.all...sampai bawah dengan ini bos
Promise.all([db.ref("anggota").once("value"),db.ref("pinjaman").once("value"),db.ref("angsuran").once("value")]).then(r=>{
  anggota=r[0].val()||{}; pinjaman=r[1].val()||{}; angsuran=r[2].val()||{};
  siap=true;
  document.getElementById("scanInfo").innerText=Object.keys(anggota).length+" anggota • Link WA aktif";

  if(SCAN_CODE){
    // langsung cari, gak perlu klik tombol
    document.getElementById("inputCari").value=SCAN_CODE;
    // sembunyikan search biar kayak kartu resmi
    document.getElementById("searchBar").style.display="none";
    cariAnggota(SCAN_CODE);
  } else {
    document.getElementById("hasil").innerHTML=`<div class="card loading">Ketik ID atau scan QR untuk lihat kartu</div>`;
  }
});

function cariAnggota(q){
  const div=document.getElementById("hasil");
  if(!siap){
    div.innerHTML=`<div class="card loading">⏳ Memuat data ${esc(q)}...</div>`;
    setTimeout(()=>cariAnggota(q),400);
    return;
  }
  const qUp=norm(q);
  if(!qUp){div.innerHTML=`<div class="card loading">Masukkan ID anggota</div>`;return;}

  // cari persis dulu (AG001), baru includes
  let exact = Object.entries(anggota).find(([k,v])=> getId(v)===qUp || safe(v.barcode).toUpperCase()===qUp);
  let list = exact? [exact] : Object.entries(anggota).filter(([k,v])=> getId(v).includes(qUp) || safe(v.barcode).toUpperCase().includes(qUp) || getNama(v).toUpperCase().includes(qUp));

  if(!list.length){div.innerHTML=`<div class="card" style="text-align:center">❌ <b>${esc(qUp)}</b> tidak ditemukan<br><br><button class="btn btn-primary" onclick="document.getElementById('searchBar').style.display='flex'">🔍 Cari lagi</button></div>`;return;}

  // kalau dari WA (?scan=) cuma tampil 1 kartu pertama biar bersih
  if(SCAN_CODE) list = [list[0]];

  let html="";
  list.forEach(([k,v])=>{html+=render(k,v);});
  div.innerHTML=html;

  setTimeout(()=>{
    list.forEach(([k,v])=>{
      const barcode=getId(v);
      const qrEl=document.getElementById(`qr-${k}`);
      const bcEl=document.getElementById(`bc-${k}`);
      if(qrEl){qrEl.innerHTML=""; try{new QRCode(qrEl,{text:BASE_URL+"?scan="+encodeURIComponent(barcode),width:150,height:150});}catch{}}
      if(bcEl){try{JsBarcode(bcEl,barcode,{format:"CODE128",width:2,height:60,displayValue:true,fontSize:14});}catch{}}
    });
  },200);
}


function render(key,v){
  const id=getId(v); const nama=getNama(v)||"-"; const hp=safe(v.telepon||v.hp||"-"); const alamat=safe(v.alamat||"-");
  const h=hitung(id,key);
  const sisa=h.sisa;
  let badge, validCls, validTxt;
  if(String(v.status||"").toLowerCase()==="keluar"){
    badge=`<span class="badge" style="background:#fee2e2;color:#991b1b">KELUAR</span>`; validCls="belum"; validTxt="🚪 KELUAR";
  }else if(h.total>0 && sisa>0){
    badge=`<span class="badge badge-belum">BELUM LUNAS - Sisa ${rupiah(sisa)}</span>`; validCls="belum"; validTxt=`❌ BELUM LUNAS - Sisa ${rupiah(sisa)}`;
  }else if(h.total>0 && sisa===0){
    badge=`<span class="badge badge-lunas">LUNAS</span>`; validCls="lunas"; validTxt=`✅ LUNAS - ${rupiah(h.total)}`;
  }else{
    badge=`<span class="badge badge-aktif">AKTIF</span>`; validCls="lunas"; validTxt="✅ AKTIF - Tidak ada pinjaman";
  }
  return `<div class="card"><div class="profile"><div class="avatar">${esc(nama.charAt(0))}</div><div style="flex:1"><div style="font-weight:800">${esc(nama)}</div><div style="font-size:11px;color:#64748b">ID: ${esc(id)} • ${esc(hp)}</div><div style="font-size:10px;color:#64748b">📍 ${esc(alamat)}</div><div style="margin-top:6px">${badge}</div></div></div>
  <div class="qr-section"><div style="font-size:11px;font-weight:800;color:#0f3057;margin-bottom:8px">KARTU ANGGOTA</div><div id="qr-${key}" class="qr"></div><svg id="bc-${key}" class="barcode"></svg><div class="valid ${validCls}">${validTxt}</div>
  <div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-primary" style="flex:1" onclick="window.print()">🖨️ Cetak</button><button class="btn btn-wa" style="flex:1" onclick="shareWA('${esc(id)}')">📤 Share WA</button></div>
  <div style="margin-top:8px;font-size:9px;word-break:break-all;color:#94a3b8">${BASE_URL}?scan=${esc(id)}</div></div></div>
  <div class="card"><div style="font-weight:800;font-size:13px;margin-bottom:8px">📊 Ringkasan</div><div class="summary-grid"><div class="summary-box"><div class="summary-label">Total Pinjam</div><div class="summary-value">${rupiah(h.total)}</div></div><div class="summary-box"><div class="summary-label">Sisa</div><div class="summary-value" style="${sisa>0?'color:#dc2626':''}">${rupiah(sisa)}</div></div><div class="summary-box"><div class="summary-label">Pokok Bayar</div><div class="summary-value">${rupiah(h.pokokBayar)}</div></div><div class="summary-box"><div class="summary-label">Jasa Bayar</div><div class="summary-value">${rupiah(h.jasaBayar)}</div></div></div></div>`;
}

function shareWA(id){
  const text=`Kartu Anggota Koperasi ARFA%0AID: ${id}%0ALihat Kartu: ${BASE_URL}?scan=${id}`;
  window.open(`https://wa.me/?text=${text}`,"_blank");
}
document.getElementById("inputCari").addEventListener("keypress",e=>{if(e.key==="Enter")cariAnggota(e.target.value);});
</script>
</body>
</html>
