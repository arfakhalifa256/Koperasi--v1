<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:#ffedd5;color:#1f2937;padding:12px;max-width:650px;margin:auto;padding-bottom:90px}

.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:10px;min-width:520px}th{background:#f8fafc;color:#64748b;padding:9px;text-align:left;font-size:9px;white-space:nowrap}td{padding:9px;border-bottom:1px solid #f1f5f9;vertical-align:top}.money{text-align:right;font-weight:700;white-space:nowrap}

<body>
<div class="head"><div><div class="head-title">👤 Kartu Anggota V7 FIX</div><small id="scanInfo">Memuat data...</small></div><a href="scan.html" class="scan-button"><span class="material-icons">qr_code_scanner</span></a></div>
<div class="search" id="searchBar"><input id="inputCari" placeholder="Cari ID / Nama / HP..."><button class="btn btn-primary" onclick="cariAnggota(document.getElementById('inputCari').value)"><span class="material-icons" style="font-size:18px">search</span>Cari</button></div>
<div id="hasil"><div class="card loading">⏳ Memuat data anggota...</div></div>
<script>
const BASE_URL = "https://koperasiarfa.my.id/barcode-cari.html";
const APP_VERSION = "20261011-7";
function buatLinkKartu(kode){ return BASE_URL + "?scan=" + encodeURIComponent(kode) + "&v=" + APP_VERSION; }
const urlParams=new URLSearchParams(location.search);
const IS_FROM_WA=urlParams.has("scan");
const firebaseConfig={databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com"};
if(!firebase.apps.length){firebase.initializeApp(firebaseConfig);}
const db=firebase.database();
let semuaAnggota={},semuaSimpanan={},semuaPinjaman={},semuaAngsuran={},dataSiap=false;
function normalizeId(v){return String(v??"").trim().toUpperCase();}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function getMemberId(v){if(!v)return"";return normalizeId(v.idAnggota||v.anggotaId||v.memberId||v.idMember||v.id||"");}
function getNama(v){return String(v?.nama||v?.name||"").trim();}
function getHP(v){return String(v?.telepon||v?.hp||v?.noHp||"").trim();}
function getBarcode(v){return String(v?.barcode||getMemberId(v)||"").trim();}
function rupiah(v){return"Rp "+(Number(v)||0).toLocaleString("id-ID");}
function tanggal(v){if(v==null||v==="")return"-";let d;if(typeof v==="number"||/^\d+$/.test(String(v))){d=new Date(Number(v));}else{d=new Date(v);}if(isNaN(d.getTime()))return String(v);return d.toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"});}
function extractPJ(text){const m=String(text||"").match(/\(?(PJ\d+)\)?/i);return m?m[1].toUpperCase():"";}
function getJasaFixLoan(p){
  let jasa = Number(p.jasa||0);
  if(jasa===0 && Number(p.jumlah||p.nominal||p.totalPinjaman||0)>0){
    jasa = Math.round(Number(p.jumlah||p.nominal||p.totalPinjaman||0)*0.2);
  }
  return jasa;
}
function simpanBase64(base64, filename){
  try{
    const a=document.createElement("a");
    a.href=base64;
    a.download=filename+".jpg";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){ alert("Gagal simpan, coba screenshot manual"); }
}
window.simpanBuktiPinjaman=function(key){
  const p=semuaPinjaman[key];
  if(!p||!p.buktiBase64) return alert("Bukti tidak ada");
  simpanBase64(p.buktiBase64, "BUKTI_PINJAMAN_"+(p.nomor||key));
}
window.simpanBuktiAngsuran=function(key){
  const a=semuaAngsuran[key];
  if(!a||!a.buktiBase64) return alert("Bukti tidak ada");
  simpanBase64(a.buktiBase64, "BUKTI_ANGSURAN_"+(a.idPinjaman||key)+"_"+tanggal(a.tanggal).replace(/\//g,"-"));
}
window.lihatFull=function(key,tipe){
  let src="";
  if(tipe==="pinjaman") src=semuaPinjaman[key]?.buktiBase64;
  else src=semuaAngsuran[key]?.buktiBase64;
  if(!src) return alert("Bukti tidak ada");
  const w=window.open();
  w.document.write(`<img src="${src}" style="width:100%">`);
}
function getMemberReferences(anggota, anggotaKey){
  const refs = new Set();
  const tambah = v => { const x = normalizeId(v); if(x) refs.add(x); };
  [anggotaKey, anggota?.id, anggota?.idAnggota, anggota?.anggotaId, anggota?.memberId, anggota?.idMember, anggota?.barcode].forEach(tambah);
  const id = getMemberId(anggota);
  Object.entries(semuaAnggota).forEach(([k,v])=>{ if(id && getMemberId(v) === id) tambah(k); });
  return refs;
}
function punyaReferensiAnggota(data, refs){
  if(!data ||!refs?.size) return false;
  const fields = ["idAnggota", "anggotaId", "memberId", "idMember", "barcode", "anggotaKey", "keyAnggota"];
  return fields.some(field=>{ const value = data[field]; return value!= null && refs.has(normalizeId(value)); });
}
function getSimpananAnggota(anggota, anggotaKey){
  const refs = getMemberReferences(anggota, anggotaKey);
  return Object.entries(semuaSimpanan).filter(([key, data])=>{ return punyaReferensiAnggota(data, refs) || refs.has(normalizeId(key)); }).map(([key,data])=>({...data,key}));
}
function getLoanRefs(p, key){
  const refs = new Set();
  const tambah = v => { const x = normalizeId(v); if(x) refs.add(x); };
  [key, p?.id, p?.idPinjaman, p?.pinjamanId, p?.loanId, p?.noPinjaman, p?.nomor, extractPJ(p?.nama), extractPJ(p?.keterangan)].forEach(tambah);
  return refs;
}
function getLoanForInstallment(a){
  const ids = [a?.pinjamanId, a?.idPinjaman, a?.loanId, a?.idPinjamanRef, a?.noPinjaman].map(normalizeId).filter(Boolean);
  for(const [key,p] of Object.entries(semuaPinjaman)){
    const refs = getLoanRefs(p,key);
    if(ids.some(id=>refs.has(id))){ return {key,p}; }
  }
  return null;
}
function getAngsuranAnggota(anggota, anggotaKey){
  const refs = getMemberReferences(anggota, anggotaKey);
  return Object.entries(semuaAngsuran).filter(([key,a])=>{
      if(punyaReferensiAnggota(a,refs)) return true;
      if(refs.has(normalizeId(key))) return true;
      const loan = getLoanForInstallment(a);
      return!!loan && punyaReferensiAnggota(loan.p,refs);
    }).map(([key,a])=>({...a,key}));
}
function getPinjamanAnggota(anggota, anggotaKey){
  const refs = getMemberReferences(anggota, anggotaKey);
  const angsuran = getAngsuranAnggota(anggota, anggotaKey);
  const hasil = new Map();
  Object.entries(semuaPinjaman).forEach(([key,p])=>{ if(punyaReferensiAnggota(p,refs)){ hasil.set(key,{...p,key}); } });
  angsuran.forEach(a=>{ const loan = getLoanForInstallment(a); if(loan &&!hasil.has(loan.key)){ hasil.set(loan.key,{...loan.p,key:loan.key}); } });
  if(hasil.size===0){
    const nama = getNama(anggota).trim().toLowerCase();
    if(nama){ Object.entries(semuaPinjaman).forEach(([key,p])=>{ const namaPin = String(p.namaAnggota || p.anggota || "").trim().toLowerCase(); if(namaPin===nama) hasil.set(key,{...p,key}); }); }
  }
  return [...hasil.values()].map(p=>{
    const nomor = extractPJ(p.noPinjaman) || extractPJ(p.nama) || String(p.idPinjaman || p.nomor || p.noPinjaman || p.key);
    return {...p, nomor, jumlah: Number(p.jumlah?? p.nominal?? p.totalPinjaman?? 0) };
  });
}
function getNomorPinjaman(a){
  const loan = getLoanForInstallment(a);
  if(loan){ return extractPJ(loan.p.noPinjaman) || extractPJ(loan.p.nama) || String(loan.p.idPinjaman || loan.p.nomor || loan.key); }
  return extractPJ(a?.nama) || String(a?.idPinjaman || a?.pinjamanId || a?.loanId || a?.noPinjaman || "-");
}

Promise.all([db.ref("anggota").once("value"),db.ref("simpanan").once("value"),db.ref("pinjaman").once("value"),db.ref("angsuran").once("value")]).then(results=>{
  semuaAnggota=results[0].val()||{}; semuaSimpanan=results[1].val()||{}; semuaPinjaman=results[2].val()||{}; semuaAngsuran=results[3].val()||{};
  dataSiap=true;
  document.getElementById("scanInfo").innerText=Object.keys(semuaAnggota).length+" anggota";
  const kode=urlParams.get("scan")||urlParams.get("cari");
  if(kode){
    document.getElementById("inputCari").value=kode;
    if(IS_FROM_WA){document.getElementById("searchBar").style.display="none"; document.getElementById("scanInfo").innerText="Kartu & Riwayat Anggota - Koperasi ARFA";}
    cariAnggota(kode);
  }else{
    document.getElementById("hasil").innerHTML=`<div class="card empty"><span class="material-icons" style="font-size:40px">qr_code_2</span><br><br>Scan QR atau ketik ID anggota</div>`;
  }
});

// ===== FIX UTAMA DISINI =====
function getLoanAccounting(anggota, anggotaKey){
  const loans = getPinjamanAnggota(anggota,anggotaKey).sort((a,b)=>{ const ta = new Date(a.tanggal || a.timestamp || 0).getTime() || 0; const tb = new Date(b.tanggal || b.timestamp || 0).getTime() || 0; return ta-tb; });
  const installments = getAngsuranAnggota(anggota,anggotaKey).sort((a,b)=>{ const ta = new Date(a.tanggal || a.timestamp || a.waktu || 0).getTime() || 0; const tb = new Date(b.tanggal || b.timestamp || b.waktu || 0).getTime() || 0; return ta-tb; });
  const result = loans.map(p=>{
    const jasaFix = getJasaFixLoan(p);
    return {...p, pokokAwal: Math.max(0,Number(p.jumlah || p.nominal || 0)), jasaAwal: jasaFix, pokokTerbayar: 0, jasaTerbayar: 0, sisaPokok: 0, sisaJasa: 0, statusHitung: "" };
  });
  const refsByLoan = result.map(p=>getLoanRefs(p,p.key));
  const legacy = [];
  installments.forEach(a=>{
    const pokok = Math.max(0,Number(a.pokok || 0)); const jasa = Math.max(0,Number(a.jasa || 0));
    const loanIds = [a.pinjamanId, a.idPinjaman, a.loanId, a.idPinjamanRef, a.noPinjaman].map(normalizeId).filter(Boolean);
    let index = -1;
    if(loanIds.length){ index = refsByLoan.findIndex(refs=> loanIds.some(id=>refs.has(id))); }else{ legacy.push({a,pokok,jasa}); }
    if(index>=0){ result[index].pokokTerbayar += pokok; result[index].jasaTerbayar += jasa; }
  });
  let idx = 0;
  legacy.forEach(item=>{
    let sisa = item.pokok;
    while(sisa>0 && idx<result.length){
      const loan = result[idx]; const belum = Math.max(0,loan.pokokAwal-loan.pokokTerbayar);
      if(belum<=0){ idx++; continue; }
      const alokasi = Math.min(sisa,belum); loan.pokokTerbayar += alokasi; sisa -= alokasi;
      if(loan.pokokTerbayar>=loan.pokokAwal) idx++;
    }
    // jasa legacy tidak ada mapping spesifik, masuk ke pinjaman pertama yang belum lunas jasanya
    if(item.jasa>0){
      let jSisa=item.jasa;
      for(let l of result){
        if(jSisa<=0) break;
        let belumJ = Math.max(0,l.jasaAwal - l.jasaTerbayar);
        if(belumJ>0){ let al = Math.min(jSisa,belumJ); l.jasaTerbayar+=al; jSisa-=al; }
      }
    }
  });
  result.forEach(p=>{
    p.sisaPokok = Math.max(0,p.pokokAwal-p.pokokTerbayar);
    p.sisaJasa = Math.max(0,p.jasaAwal-p.jasaTerbayar);
    // === LOGIKA BARU: LUNAS HANYA KALAU POKOK 0 DAN JASA 0 ===
    if(p.sisaPokok<=0 && p.sisaJasa<=0){
      p.statusHitung = "Lunas";
    } else {
      p.statusHitung = "Belum Lunas";
    }
  });
  return { loans: result, totalPinjaman: result.reduce((s,p)=>s+p.pokokAwal,0), totalJasaTagih: result.reduce((s,p)=>s+p.jasaAwal,0), totalPokokTerbayar: result.reduce((s,p)=>s+p.pokokTerbayar,0), sisaPinjaman: result.reduce((s,p)=>s+p.sisaPokok,0), totalJasaTerbayar: result.reduce((s,p)=>s+p.jasaTerbayar,0), sisaJasa: result.reduce((s,p)=>s+p.sisaJasa,0), installments };
}

function cariAnggota(q){
  const hasilDiv=document.getElementById("hasil");
  if(!dataSiap){hasilDiv.innerHTML=`<div class="card loading">⏳ Memuat data...</div>`;setTimeout(()=>cariAnggota(q),500);return;}
  if(!q||!q.trim()){hasilDiv.innerHTML=`<div class="card empty">Ketik ID anggota.</div>`;return;}
  const qUp=q.trim().toUpperCase();
  const list=Object.entries(semuaAnggota).filter(([key,v])=>{
    const id=getMemberId(v);const barcode=getBarcode(v);const nama=getNama(v);const hp=getHP(v);const firebaseKey=normalizeId(key);
    return(id.includes(qUp)||barcode.toUpperCase().includes(qUp)||nama.toUpperCase().includes(qUp)||hp.toUpperCase().includes(qUp)||firebaseKey.includes(qUp));
  });
  if(!list.length){hasilDiv.innerHTML=`<div class="card empty">❌<br><br>${esc(qUp)} tidak ditemukan.</div>`;return;}
  let html="";list.forEach(([key,v])=>{html+=renderAnggota(key,v);});
  hasilDiv.innerHTML=html;
  list.forEach(([key,v])=>{
    const id=getMemberId(v);const barcode=getBarcode(v);const nama=getNama(v);
    const urlShare=buatLinkKartu(barcode||id);
    try{
      const qr=document.getElementById(`qr-${key}`);
      if(qr){new QRCode(qr,{text:urlShare,width:140,height:140,correctLevel:QRCode.CorrectLevel.H});}
      const bc=document.getElementById(`bc-${key}`);
      if(bc){JsBarcode(bc,barcode||id,{format:"CODE128",width:1.6,height:42,displayValue:true,fontSize:10,margin:5});}
    }catch(e){}
    if(!IS_FROM_WA){
      const card=document.querySelector(`[data-key="${CSS.escape(key)}"]`);
      if(card){
        const wa=card.querySelector(".btn-wa");
        if(wa){wa.onclick=()=>{const pesan="Kartu Anggota Koperasi ARFA\n\nID Anggota: "+id+"\nNama: "+nama+"\nBarcode: "+barcode+"\n\nLihat Kartu & Riwayat Anggota:\n"+urlShare;window.open("https://wa.me/?text="+encodeURIComponent(pesan),"_blank");};}
        const copy=card.querySelector(".btn-copy");
        if(copy){copy.onclick=()=>{navigator.clipboard?navigator.clipboard.writeText(urlShare).then(()=>alert("✅ Link disalin:\n\n"+urlShare)):prompt("Salin link:",urlShare);}}
      }
    }
  });
}

function renderAnggota(key,v){
  const id=getMemberId(v);const barcode=getBarcode(v);const nama=getNama(v)||"-";const hp=getHP(v)||"-";const alamat=v.alamat||"-";const status=String(v.status||"aktif").toLowerCase();
  const urlShare=buatLinkKartu(barcode||id);
  return `<div class="card" data-key="${esc(key)}"><div class="profile"><div class="avatar">${esc(nama.charAt(0).toUpperCase())}</div><div style="flex:1"><div class="profile-name">${esc(nama)}</div><div class="profile-info">📞 ${esc(hp)}</div><div class="profile-info">📍 ${esc(alamat)}</div><span class="badge">${esc(id)}</span><span class="badge ${status==="keluar"?"badge-keluar":"badge-aktif"}">${esc(status)}</span></div></div><div class="qr-section"><div class="qr-title">QR KARTU ANGGOTA</div><div id="qr-${esc(key)}" class="qr"></div><svg id="bc-${esc(key)}" class="barcode"></svg>${!IS_FROM_WA?`<div class="link-box">${esc(urlShare)}</div><div class="action-row"><button class="btn btn-success btn-wa">WhatsApp</button><button class="btn btn-light btn-copy">📋 Copy</button></div>`:`<div class="valid">✅ Kartu Valid - Koperasi ARFA</div>`}</div></div>${renderRingkasan(v,key)}${renderSimpanan(v,key)}${renderPinjaman(v,key)}${renderAngsuran(v,key)}`;
}

function renderRingkasan(anggota,anggotaKey){
  const simpanan = getSimpananAnggota(anggota,anggotaKey);
  const akun = getLoanAccounting(anggota,anggotaKey);
  let totalSimpanan=0,totalSukarela=0,totalWajib=0,totalPokok=0;
  simpanan.forEach(s=>{
    const jumlah = Number(s.jumlah || s.nominal || s.nilai || 0);
    const jenis = String(s.jenis || "").toLowerCase();
    const tipe = String(s.tipe || "").toLowerCase();
    const keluar = ["tarik","pencair","keluar"].includes(jenis) || tipe==="keluar";
    const nilai = keluar? -jumlah : jumlah;
    totalSimpanan += nilai;
    if(jenis==="sukarela") totalSukarela += nilai;
    if(jenis==="wajib") totalWajib += nilai;
    if(jenis==="pokok") totalPokok += nilai;
  });
  const totalAngsuran = akun.installments.reduce((sum,a)=>sum+Number(a.pokok||0)+Number(a.jasa||0),0);
  return `<div class="card">
    <div class="section-title"><span class="material-icons" style="font-size:18px">dashboard</span> Ringkasan Anggota - FIX JASA</div>
    <div class="summary-grid">
      <div class="summary-box"><div class="summary-label">Total Simpanan</div><div class="summary-value">${rupiah(totalSimpanan)}</div></div>
      <div class="summary-box"><div class="summary-label">Simpanan Sukarela</div><div class="summary-value">${rupiah(totalSukarela)}</div></div>
      <div class="summary-box"><div class="summary-label">Simpanan Wajib</div><div class="summary-value">${rupiah(totalWajib)}</div></div>
      <div class="summary-box"><div class="summary-label">Simpanan Pokok</div><div class="summary-value">${rupiah(totalPokok)}</div></div>
      <div class="summary-box"><div class="summary-label">Total Pinjaman</div><div class="summary-value">${rupiah(akun.totalPinjaman)}</div></div>
      <div class="summary-box"><div class="summary-label">Jasa Tagih 20%</div><div class="summary-value">${rupiah(akun.totalJasaTagih)}</div></div>
      <div class="summary-box"><div class="summary-label">Pokok Terbayar</div><div class="summary-value">${rupiah(akun.totalPokokTerbayar)}</div></div>
      <div class="summary-box"><div class="summary-label">Jasa Terbayar</div><div class="summary-value">${rupiah(akun.totalJasaTerbayar)}</div></div>
      <div class="summary-box" style="border:2px solid #ef4444;background:#fef2f2"><div class="summary-label">Sisa Pokok</div><div class="summary-value" style="color:#dc2626">${rupiah(akun.sisaPinjaman)}</div></div>
      <div class="summary-box" style="border:2px solid #f59e0b;background:#fffbeb"><div class="summary-label">Sisa Jasa</div><div class="summary-value" style="color:#d97706">${rupiah(akun.sisaJasa)}</div></div>
      <div class="summary-box"><div class="summary-label">Total Angsuran</div><div class="summary-value">${rupiah(totalAngsuran)}</div></div>
      <div class="summary-box"><div class="summary-label">Total Sisa (Pokok+Jasa)</div><div class="summary-value">${rupiah(akun.sisaPinjaman+akun.sisaJasa)}</div></div>
    </div>
  </div>`;
}

function renderSimpanan(anggota,anggotaKey){
  const list=getSimpananAnggota(anggota,anggotaKey);
  if(!list.length)return`<div class="card"><div class="section-title">💰 Riwayat Simpanan</div><div class="empty">Belum ada riwayat simpanan.</div></div>`;
  list.sort((a,b)=>Number(b.tanggal||b.timestamp||b.waktu||0)-Number(a.tanggal||a.timestamp||a.waktu||0));
  let rows="";list.forEach(s=>{const jenis=s.jenis||s.tipe||"-";const jumlah=Number(s.jumlah||s.nominal||s.nilai||0);const keluar=["tarik","pencair","keluar"].includes(String(jenis).toLowerCase());rows+=`<tr><td>${esc(tanggal(s.tanggal||s.timestamp||s.waktu))}</td><td>${esc(jenis)}</td><td class="money" style="color:${keluar?"#dc2626":"#16a34a"};">${keluar?"- ":"+ "}${rupiah(jumlah)}</td></tr>`;});
  return `<div class="card"><div class="section-title">💰 Riwayat Simpanan</div><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Jumlah</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function renderPinjaman(anggota,anggotaKey){
  const akun = getLoanAccounting(anggota,anggotaKey);
  const list = akun.loans;
  if(!list.length){ return `<div class="card"><div class="section-title">💳 Riwayat Pinjaman</div><div class="empty">Belum ada pinjaman.</div></div>`; }
  let html = "";
  list.slice().reverse().forEach(p=>{
    const jumlah = p.pokokAwal;
    const jasaFix = p.jasaAwal;
    const terbayar = Math.min(jumlah,p.pokokTerbayar);
    const jasaTerbayar = p.jasaTerbayar;
    const sisa = p.sisaPokok;
    const sisaJasa = p.sisaJasa;
    const lunas = p.statusHitung==="Lunas";
    const statusClass = lunas? "badge-aktif" : "badge-keluar";
    const statusText = lunas? "LUNAS (Pokok & Jasa)" : (sisa<=0 && sisaJasa>0? `BELUM LUNAS - Jasa ${rupiah(sisaJasa)}` : sisaJasa<=0 && sisa>0? `BELUM LUNAS - Pokok ${rupiah(sisa)}` : `BELUM LUNAS - Sisa ${rupiah(sisa+sisaJasa)}`);
    const buktiBox = p.buktiBase64? `
      <div style="margin-top:10px;background:#fffbeb;border:2px dashed #f59e0b;border-radius:12px;padding:10px;text-align:center">
        <div style="font-size:10px;font-weight:800;color:#92400e;margin-bottom:6px">📎 BUKTI PENCAIRAN</div>
        <img src="${p.buktiBase64}" style="width:100%;max-width:280px;border-radius:10px;border:1px solid #e2e8f0;cursor:pointer" onclick="lihatFull('${p.key}','pinjaman')">
        <div style="display:flex;gap:6px;margin-top:8px">
          <button onclick="lihatFull('${p.key}','pinjaman')" style="flex:1;background:#3b82f6;color:#fff;padding:9px;border-radius:8px;border:none;font-size:10px;font-weight:700">🔍 Lihat</button>
          <button onclick="simpanBuktiPinjaman('${p.key}')" style="flex:1;background:#10b981;color:#fff;padding:9px;border-radius:8px;border:none;font-size:10px;font-weight:700">💾 Simpan</button>
        </div>
      </div>` : `<div style="margin-top:6px;font-size:9px;color:#94a3b8">Tanpa bukti</div>`;
    html += `<div class="loan-card" style="${!lunas?'border:2px solid #f59e0b':''}">
      <div class="loan-header"><div><div class="loan-number">No. Pinjaman: ${esc(p.nomor||p.key)}</div><div class="loan-date">${tanggal(p.tanggal||p.timestamp)} | Pokok ${rupiah(jumlah)} + Jasa ${rupiah(jasaFix)}</div></div><span class="badge ${statusClass}">${esc(statusText)}</span></div>
      <div class="loan-grid"><div class="loan-item"><small>Jumlah Pokok</small><b>${rupiah(jumlah)}</b></div><div class="loan-item"><small>Jasa Tagih 20%</small><b>${rupiah(jasaFix)}</b></div><div class="loan-item"><small>Pokok Terbayar</small><b>${rupiah(terbayar)}</b></div><div class="loan-item"><small>Jasa Dibayar</small><b>${rupiah(jasaTerbayar)}</b></div><div class="loan-item" style="${sisa>0?'background:#fee2e2;border:1px solid #fecaca':''}"><small>Sisa Pokok</small><b style="color:${sisa>0?"#dc2626":"#16a34a"}">${rupiah(sisa)}</b></div><div class="loan-item" style="${sisaJasa>0?'background:#fffbeb;border:1px solid #fde68a':''}"><small>Sisa Jasa</small><b style="color:${sisaJasa>0?"#d97706":"#16a34a"}">${rupiah(sisaJasa)}</b></div></div>
      ${buktiBox}
    </div>`;
  });
  return `<div class="card"><div class="section-title">💳 Riwayat Pinjaman - FIX JASA BELUM LUNAS</div>${html}</div>`;
}

function renderAngsuran(anggota,anggotaKey){
  const list=getAngsuranAnggota(anggota,anggotaKey);
  if(!list.length)return`<div class="card"><div class="section-title">💵 Riwayat Angsuran</div><div class="empty">Belum ada riwayat angsuran.</div></div>`;
  list.sort((a,b)=>Number(b.tanggal||b.timestamp||b.waktu||0)-Number(a.tanggal||a.timestamp||a.waktu||0));
  let rows="";list.forEach(a=>{
    const pokok=Number(a.pokok||0);const jasa=Number(a.jasa||0);const total=pokok+jasa;const nomorPinjaman=getNomorPinjaman(a);
    const buktiCell = a.buktiBase64? `<img src="${a.buktiBase64}" style="width:55px;height:55px;object-fit:cover;border-radius:8px;border:1px solid #10b981;cursor:pointer" onclick="lihatFull('${a.key}','angsuran')"><br><button onclick="simpanBuktiAngsuran('${a.key}')" style="background:#10b981;color:#fff;padding:3px 6px;border-radius:6px;border:none;font-size:8px;margin-top:4px;width:auto">💾 Simpan</button>` : `<span style="color:#94a3b8;font-size:8px">-</span>`;
    rows+=`<tr><td>${tanggal(a.tanggal||a.timestamp||a.waktu)}<br>${buktiCell}</td><td><strong style="color:#0f3057;font-size:10px;">${esc(nomorPinjaman)}</strong><br><small>${esc(a.metode||"-")}</small></td><td class="money">${rupiah(pokok)}</td><td class="money">${rupiah(jasa)}</td><td class="money"><b>${rupiah(total)}</b></td></tr>`;
  });
  return `<div class="card"><div class="section-title">💵 Riwayat Angsuran + Bukti</div><div class="table-wrap"><table><thead><tr><th>Tanggal & Bukti</th><th>No. Pinjaman</th><th>Pokok</th><th>Jasa</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
document.getElementById("inputCari").addEventListener("input",e=>{cariAnggota(e.target.value);});
</script>
</body>
</html>
