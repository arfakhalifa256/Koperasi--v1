<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manajemen User</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#1e90ff; --primary-dark:#0f6ecf; --danger:#ef4444;
  --success:#16a34a; --warning:#f59e0b; --bg:#f4f7fb;
  --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --shadow:0 4px 12px rgba(15,23,42,.06); --radius:14px
}

html, body {width: 100%;max-width: 100%;overflow-x: hidden;font-family:'Poppins',Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;}
*{box-sizing: border-box;}

/* ===== HEADER ===== */
header {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; padding: 14px 16px; display: flex;
  justify-content: space-between; align-items: center;
  box-shadow: 0 4px 16px rgba(30,144,255,0.25); position: sticky; top: 0; z-index: 100;
}
.brand {display: flex; align-items: center; gap: 12px;}
.brand img {width: 42px; height: 42px; border-radius: 14px; background: #fff; padding: 4px;}
.brand-text.subtitle {font-size: 10px; opacity: 0.85; letter-spacing:0.8px;}
.brand-text.title {font-size: 18px; font-weight: 700;}
.header-right{display:flex; align-items:center; gap:12px;}
.user-info{text-align:right; display:none;}
.user-name{font-size:13px; font-weight:700;}
.user-role{font-size:10px; background:rgba(255,255,255,0.25); padding:3px 8px; border-radius:20px; font-weight:600;}
.btn-back {background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor:pointer}
@media(min-width:480px){.user-info{display:block}}

.content{padding:16px; max-width:760px; margin:0 auto; padding-bottom:100px}
h2{text-align:center;color:var(--primary);margin:16px 0;font-size:18px; font-weight:700}

.card{
  background:var(--card); border-radius:var(--radius);
  padding:18px; margin-bottom:16px;
  box-shadow:var(--shadow); border:1px solid var(--border);
}

label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;margin-top:12px;color:#374151}
input,select{
  width:100%;border:1.5px solid var(--border); border-radius:12px;
  padding:12px 14px; font-size:14px; outline:none; background:#fff;
  font-family:'Poppins',sans-serif; transition:.2s; margin-bottom:10px
}
input:focus,select:focus{border-color:var(--primary); box-shadow:0 0 0 4px rgba(30,144,255,.12)}

.btn{
  width:100%;border:none;border-radius:12px; padding:13px 14px;
  font-size:14px; font-weight:700;color:#fff;cursor:pointer;
  margin-top:14px; transition:.2s; background:var(--primary)
}
.btn:hover{transform:translateY(-1px); background:var(--primary-dark)}
.btn-cancel{background:#9ca3af}

.row{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px;}
.small{font-size:12px; color:var(--muted);}
.icon-btn{width:34px; height:34px; border:none; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; color:#fff; transition:.2s}
.icon-btn.edit{background:var(--warning);}
.icon-btn.hapus{background:var(--danger);}

/* ===== POPUP ===== */
.popup{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9998}
.popup-box{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25); animation:pop.2s}
@keyframes pop{from{transform:scale(0.9); opacity:0}}
.popup-title{font-size:18px;font-weight:700;margin-bottom:12px;color:#111827}

.toast{position:fixed;left:50%;bottom:24px; transform:translateX(-50%); background:#111827;color:#fff; padding:12px 18px;border-radius:10px; opacity:0;pointer-events:none; transition:.25s;z-index:9999; font-weight:600}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="img/icon-192.png">
    <div class="brand-text">
      <div class="subtitle">SCHOOL BUS</div>
      <div class="title">ARFA</div>
    </div>
  </div>
  <div class="header-right">
    <div class="user-info">
      <div class="user-name" id="namaHeader">Admin</div>
      <div class="user-role" id="roleHeader">ADMIN</div>
    </div>
    <button class="btn-back" onclick="kembali()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
  </div>
</header>

<div class="content">
  <h2>👤 Manajemen User</h2>
  <div class="card">
    <label>Username</label>
    <input type="text" id="username" placeholder="Username" readonly>
    <label>Password Baru</label>
    <input type="text" id="password" placeholder="Kosongkan jika tidak ganti">
    <button class="btn" onclick="simpanUser()">💾 Tambah User Baru</button>
  </div>
  <div id="listUser"></div>
</div>

<!-- ===== POPUP EDIT ===== -->
<div id="popupEdit" class="popup">
  <div class="popup-box">
    <div class="popup-title">✏️ Edit User</div>
    <label>Username</label>
    <input type="text" id="editUsername" readonly>
    <label>Password Baru</label>
    <input type="text" id="editPassword" placeholder="Kosongkan jika tidak ganti">
    <label>Role</label>
    <select id="editRole" onchange="toggleDriverEdit()">
      <option value="admin">Admin</option>
      <option value="driver">Driver</option>
    </select>
    <label id="labelDriverEdit" style="display:none">Pilih Driver</label>
    <select id="editDriverId" style="display:none">
      <option value="">-- Pilih Driver --</option>
    </select>
    <button class="btn" onclick="updateUser()">Update</button>
    <button class="btn btn-cancel" onclick="closePopup()">Batal</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, deleteDoc, doc, updateDoc, getDoc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSy...", authDomain: "schoolbus-6a7fd.firebaseapp.com", projectId: "schoolbus-6a7fd"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const roleLogin = (localStorage.getItem("role") || "").toLowerCase();
const userLogin = localStorage.getItem("username") || "Admin";
document.getElementById("namaHeader").innerText = userLogin;
document.getElementById("roleHeader").innerText = roleLogin.toUpperCase();

if (localStorage.getItem("login")!== "true") window.location.href = "index.html";
if (roleLogin!== "admin") {alert("Akses ditolak!"); window.location.href = "dashboard.html";}

let editId = null; let driverMap = {};

function showToast(msg){const t = document.getElementById("toast"); t.innerText = msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2500);}

function loadDriverRealtime() {
  const select = document.getElementById("editDriverId");
  onSnapshot(collection(db, "drivers"), (snapshot) => {
    select.innerHTML = '<option value="">-- Pilih Driver --</option>';
    driverMap = {};
    snapshot.forEach((docSnap) => {
      const d = docSnap.data(); const nama = d.nama || d.namaDriver || "-";
      driverMap[docSnap.id] = nama;
      const opt = document.createElement("option"); opt.value = docSnap.id; opt.textContent = nama;
      select.appendChild(opt);
    });
  });
}

window.toggleDriverEdit = function () {
  const roleInput = document.getElementById("editRole").value;
  const show = roleInput === "driver";
  document.getElementById("editDriverId").style.display = show? "block" : "none";
  document.getElementById("labelDriverEdit").style.display = show? "block" : "none";
}

function loadUserRealtime() {
  const list = document.getElementById("listUser");
  onSnapshot(collection(db, "users"), (snapshot) => {
    list.innerHTML = "";
    snapshot.forEach((docSnap) => {
      const u = docSnap.data();
      if (u.role === "admin" && u.username!== "admin") return;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="row"><b>${u.username}</b>
          <span class="small" style="background:#eff6ff; color:#1e40af; padding:3px 8px; border-radius:20px;">${u.role}</span>
        </div>
        <div class="row small">Driver: ${u.namaDriver || driverMap[u.driverId] || "-"}</div>
        <div class="row">
          <button class="icon-btn edit" onclick='editUser(${JSON.stringify(u)})'>✏️</button>
          <button class="icon-btn hapus" onclick="hapusUser('${docSnap.id}')">🗑️</button>
        </div>
      `;
      list.appendChild(card);
    });
  });
}

async function simpanUser() {
  const username = document.getElementById("username").value.trim().toLowerCase();
  const password = document.getElementById("password").value.trim();
  if (!username ||!password) { showToast("Username & password wajib"); return; }
  try {
    await setDoc(doc(db, "users", username), {
      username, password, role: "driver", // default driver
      driverId: "", namaDriver: "", createdAt: Date.now()
    });
    showToast("✅ User berhasil ditambah");
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
  } catch (err) { alert("Gagal: " + err.message); }
}
window.simpanUser = simpanUser;

window.editUser = function (u) {
  editId = u.username;
  document.getElementById("editUsername").value = u.username;
  document.getElementById("editPassword").value = "";
  document.getElementById("editRole").value = u.role;
  document.getElementById("editDriverId").value = u.driverId || "";
  toggleDriverEdit();
  document.getElementById("popupEdit").style.display = "flex";
}

window.updateUser = async function () {
  const password = document.getElementById("editPassword").value.trim();
  const roleInput = document.getElementById("editRole").value;
  const driverId = document.getElementById("editDriverId").value;
  const namaDriver = driverMap[driverId] || "";

  const payload = { role: roleInput, updatedAt: Date.now() };
  if(password) payload.password = password; // cuma update kalau diisi
  payload.driverId = roleInput === "driver"? driverId : "";
  payload.namaDriver = roleInput === "driver"? namaDriver : "";

  try {
    await updateDoc(doc(db, "users", editId), payload);
    showToast("✅ User berhasil diupdate");
    closePopup();
  } catch (err) { alert("Gagal: " + err.message); }
}

window.hapusUser = async function (id) {
  if (!confirm("Hapus user ini?")) return;
  try { await deleteDoc(doc(db, "users", id)); showToast("✅ User dihapus"); }
  catch (err) { alert("Gagal hapus: " + err.message); }
}

window.closePopup = function(){document.getElementById("popupEdit").style.display = "none"; editId = null;}
window.kembali=function(){window.location.href="dashboard.html";}

loadDriverRealtime();
loadUserRealtime();
</script>
</body>
</html>
