<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola User - Koperasi ARFA</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:#f1f5f9;color:#1f2937;font-size:13px;margin:0;}
header{background:linear-gradient(to right,#1e90ff,#0f3057);color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;}
.brand img{width:36px;height:36px;border-radius:50%;background:#fff;padding:2px;}
.menu-btn{cursor:pointer;font-size:22px;}
.sidebar{position:fixed;top:0;left:-260px;width:240px;height:100%;background:#0f3057;padding:16px;transition:.3s;z-index:9999;overflow-y:auto;}
.sidebar.open{left:0;}
.sidebar-logo{display:flex;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,.2);}
.sidebar-logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#fff;padding:2px;}
.sidebar-logo h3{color:#fff;margin:0;font-size:15px;font-weight:600;}
.sidebar-section{color:rgba(255,255,255,.6);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px 12px;}
.sidebar a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:10px;border-radius:10px;margin-bottom:2px;font-size:10px;font-weight:500;transition:.2s;}
.sidebar a:hover{background:rgba(255,255,255,.15);transform:translateX(4px);}
.sidebar a.active{background:rgba(255,255,255,.2);}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);display:none;z-index:999;}
.overlay.active{display:block;}
.container{padding:16px;max-width:900px;margin:auto;}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:16px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.card h3{margin:0 0 14px;font-size:15px;}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:#6b7280;margin-bottom:4px;}
.form-group input, .form-group select{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:'Poppins',sans-serif;}
.btn-primary{width:100%;padding:11px;border:none;border-radius:8px;background:#1e90ff;color:white;font-weight:600;cursor:pointer;}
table{width:100%;border-collapse:collapse;font-size:11px;background:#fff;}
th{background:#087f5b;color:#fff;padding:10px;text-align:left;}
td{padding:10px;border-bottom:1px solid #eee;}
.action-btns{display:flex;gap:5px;}
.icon-btn{border:none;background:none;cursor:pointer;font-size:16px;}
.icon-btn.delete{color:#dc2626;}
.icon-btn.reset{color:#f59e0b;}
.badge-admin{background:#dbeafe;color:#1d4ed8;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:700;}
.badge-anggota{background:#dcfce7;color:#166534;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:700;}
@media(min-width:768px){body{margin-left:240px;}.sidebar{left:0;}.overlay{display:none!important;}.menu-btn{display:none;}.form-grid{grid-template-columns:1fr 1fr 1fr .8fr;}}
</style>
</head>
<body>

<div id="sidebar" class="sidebar">
  <div class="sidebar-logo"><img src="img/icon-192.png"><h3>Menu Koperasi</h3></div>
  <a href="dashboard.html">🏠 Beranda</a>
  <div class="sidebar-section">Data Master</div>
  <a href="anggota.html">👤 Data Anggota</a>
  <a href="kas.html">💵 Kas</a>
  <div class="sidebar-section">Pengaturan</div>
  <a href="user.html" class="active">⚙️ Kelola User</a>
  <a href="#" id="btnLogout">🚪 Logout</a>
</div>
<div id="overlay" class="overlay"></div>

<header>
  <div class="brand"><img src="img/icon-192.png"><div>KELOLA USER</div></div>
  <span class="menu-btn" onclick="toggleSidebar()">☰</span>
</header>

<div class="container">
  <div class="card">
    <h3>➕ Tambah User Baru</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>Pilih Anggota</label>
        <select id="selectAnggota">
          <option value="">-- Pilih Anggota --</option>
        </select>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Contoh: budi01" disabled>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="text" id="password" placeholder="123456">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="role">
          <option value="anggota">Anggota</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" onclick="tambahUser()" style="margin-top:12px;">💾 Simpan User</button>
  </div>

  <div class="card">
    <h3>📋 Daftar User</h3>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Nama Anggota</th><th>Username</th><th>Role</th><th>Aksi</th></tr></thead>
        <tbody id="userTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, get, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const usersRef = ref(db,"/users");
const anggotaRef = ref(db,"/anggota");

const usernameLogin = localStorage.getItem("username");
const roleLogin = localStorage.getItem("role");

if(roleLogin !== 'admin'){ alert("Akses ditolak. Hanya Admin"); location.href='dashboard.html'; }

let daftarAnggota = {}; // untuk simpan id -> nama

/* LOAD DATA ANGGOTA KE DROPDOWN */
onValue(anggotaRef, snapshot=>{
  const select = document.getElementById("selectAnggota");
  select.innerHTML = '<option value="">-- Pilih Anggota --</option>';
  daftarAnggota = {};
  if(snapshot.exists()){
    snapshot.forEach(child=>{
      const a = child.val();
      if(a.id && a.nama){
        daftarAnggota[a.id] = a.nama; // AG001: Budi
        select.innerHTML += `<option value="${a.id}">${a.id} - ${a.nama}</option>`;
      }
    });
  }
});

/* AUTO ISI USERNAME SAAT PILIH ANGGOTA */
document.getElementById("selectAnggota").addEventListener("change", function(){
  const id = this.value;
  document.getElementById("username").value = id.toLowerCase(); // default username = ag001
});

/* LOAD DATA USER KE TABEL */
onValue(usersRef, snapshot=>{
  const table = document.getElementById("userTable");
  table.innerHTML = "";
  if(snapshot.exists()){
    const users = snapshot.val();
    for(const key in users){
      const u = users[key];
      const isMe = u.username === usernameLogin;
      const namaAnggota = daftarAnggota[u.userId] || '-'; // cari nama dari id
      table.innerHTML += `
        <tr>
          <td><b>${namaAnggota}</b><br><span style="font-size:10px;color:#666;">ID: ${u.userId || '-'}</span></td>
          <td>${u.username} ${isMe? '<span style="color:green;font-size:10px;">(Anda)</span>':''}</td>
          <td>
            <select onchange="ubahRole('${key}', this.value)" ${isMe?'disabled':''}>
              <option value="anggota" ${u.role==='anggota'?'selected':''}>Anggota</option>
              <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
            </select>
          </td>
          <td>
            <div class="action-btns">
              <button class="icon-btn reset" onclick="resetPassword('${key}')" title="Reset Password">🔑</button>
              <button class="icon-btn delete" onclick="hapusUser('${key}','${u.username}')" title="Hapus User" ${isMe?'disabled':''}>🗑️</button>
            </div>
          </td>
        </tr>
      `;
    }
  } else {
    table.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#999;padding:20px;">Belum ada user</td></tr>`;
  }
});

/* TAMBAH USER */
window.tambahUser = async function(){
  const userId = document.getElementById("selectAnggota").value;
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const role = document.getElementById("role").value;

  if(!userId){ alert("Pilih anggota dulu"); return; }
  if(!username){ alert("Username wajib diisi"); return; }
  if(!password){ alert("Password wajib diisi"); return; }

  // cek username sudah ada
  const snap = await get(usersRef);
  let ada = false;
  snap.forEach(c=>{ if(c.val().username === username) ada=true; });
  if(ada){ alert("Username sudah digunakan"); return; }

  await push(usersRef, {
    username: username,
    password: password,
    role: role,
    userId: userId // <-- INI PENTING UNTUK FILTER
  });

  document.getElementById("selectAnggota").value = "";
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  alert("User berhasil ditambahkan");
}

/* UBAH ROLE */
window.ubahRole = async function(key, roleBaru){
  await update(ref(db,"/users/" + key), {role: roleBaru});
}

/* RESET PASSWORD */
window.resetPassword = async function(key){
  const passBaru = prompt("Masukkan password baru:");
  if(passBaru){
    await update(ref(db,"/users/" + key), {password: passBaru});
    alert("Password berhasil direset");
  }
}

/* HAPUS USER */
window.hapusUser = async function(key, username){
  if(confirm(`Yakin hapus user ${username}?`)){
    await remove(ref(db,"/users/" + key));
  }
}

/* SIDEBAR & LOGOUT */
window.toggleSidebar = function(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("active");
};
document.getElementById("overlay").addEventListener("click", toggleSidebar);
document.getElementById("btnLogout").addEventListener("click", (e)=>{
  e.preventDefault();
  if(confirm("Yakin mau logout?")){
    localStorage.clear();
    location.href = "index.html";
  }
});
</script>
</body>
</html>
