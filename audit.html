<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Koperasi ARFA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
  
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
header{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:white;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

  *{box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f1f5f9;padding:10px}
header{background:linear-gradient(90deg,#1e90ff,#0f3057);color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:15px}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2{color:#0f3057;font-size:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:10px}
th{background:#1e90ff;color:#fff;padding:8px;text-align:left}
td{padding:7px;border-bottom:1px solid #e2e8f0}
.btn{padding:9px 12px;border:none;border-radius:8px;background:#1e90ff;color:#fff;font-weight:600;cursor:pointer}
.btn.red{background:#dc2626}
input,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px}
.label{font-size:10px;color:#64748b;margin-bottom:3px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="material-icons">books</span>
    AUDIT KAS
  </div>

  <span
    onclick="window.location='dashboard.html'"
    class="material-icons"
    style="cursor:pointer">
    home
  </span>
</header>
  
<div class="card">
  <h2>1. Opname Kas Bulanan</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div><div class="label">Tanggal Opname</div><input type="date" id="tglOpname"></div>
    <div><div class="label">Dilakukan Oleh</div><input type="text" id="namaOpname" readonly></div>
    <div><div class="label">cash Fisik</div><input type="number" id="kasFisik" placeholder="0"></div>
    <div><div class="label">Bank Fisik</div><input type="number" id="bankFisik" placeholder="0"></div>
    <div style="grid-column:1/-1"><div class="label">Catatan</div><input type="text" id="catatanOpname" placeholder="Contoh: Selisih Nihil"></div>
  </div>
  <button class="btn" onclick="simpanOpname()" style="margin-top:10px">💾 Simpan Opname</button>
</div>

<div class="card">
  <h2>Riwayat Opname Terakhir</h2>
  <div id="riwayatOpname" style="overflow-x:auto">Memuat...</div>
</div>

<div class="card">
  <h2>2. Log Aktivitas Kas</h2>
  <button class="btn red" onclick="exportAuditPDF()">📄 Export Berita Acara PDF</button>
  <div style="overflow-x:auto;margin-top:10px">
    <table>
      <thead><tr><th>Tanggal</th><th>Aksi</th><th>User</th><th>Keterangan</th><th style="text-align:right">Jumlah</th></tr></thead>
      <tbody id="logTable"></tbody>
    </table>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,push,onValue,get} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const username = localStorage.getItem("username") || "Bendahara";
const role = localStorage.getItem("role") || "user";
document.getElementById("namaOpname").value = username;
document.getElementById("tglOpname").value = new Date().toISOString().slice(0,10);

let dataLog = [];
const formatRp = n => Number(n||0).toLocaleString("id-ID");

// 1. AMBIL LOG
onValue(ref(db,"audit/log"), snap=>{
  dataLog = [];
  const tbody = document.getElementById("logTable");
  tbody.innerHTML = "";
  if(!snap.exists()){
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#888;padding:10px">Belum ada aktivitas</td></tr>`;
    return;
  }
  const logs = [];
  snap.forEach(child=> logs.push({key: child.key, ...child.val()}));
  logs.sort((a,b)=> b.tanggal - a.tanggal);
  dataLog = logs;
  logs.forEach(d=>{
    tbody.innerHTML += `
      <tr>
        <td>${new Date(d.tanggal).toLocaleString("id-ID")}</td>
        <td><b>${d.aksi}</b></td>
        <td>${d.user}</td>
        <td>${d.keterangan}</td>
        <td style="text-align:right">Rp ${formatRp(d.jumlah)}</td>
      </tr>
    `;
  })
})

// 2. AMBIL DATA OPNAME TERAKHIR
onValue(ref(db,"audit/opname"), snap=>{
  const arr = [];
  snap.forEach(child=> arr.push({id:child.key,...child.val()}));
  arr.sort((a,b)=> (b.waktu || 0) - (a.waktu || 0)); // kasih fallback 0

  const div = document.getElementById("riwayatOpname");
  if(arr.length === 0){
    div.innerHTML = `<div style="text-align:center;color:#888;padding:10px">Belum ada data opname</div>`;
    return;
  }
  let html = `<table><thead><tr><th>Tanggal</th><th>Kas Fisik</th><th>Bank Fisik</th><th>Oleh</th><th>Catatan</th></tr></thead><tbody>`;
  arr.slice(0,10).forEach(d=>{
    html += `<tr>
      <td>${d.tanggal}</td>
      <td>Rp ${formatRp(d.kasFisik)}</td>
      <td>Rp ${formatRp(d.bankFisik)}</td>
      <td>${d.oleh}</td>
      <td>${d.catatan || "-"}</td>
    </tr>`;
  })
  html += `</tbody></table>`;
  div.innerHTML = html;
})

// 3. SIMPAN OPNAME + CATAT LOG
window.simpanOpname = async function(){
  const kasFisik = Number(document.getElementById("kasFisik").value) || 0; // FIX: kasFisik
  const bankFisik = Number(document.getElementById("bankFisik").value) || 0;
  const data = {
    tanggal: document.getElementById("tglOpname").value,
    kasFisik: kasFisik, // FIX: kasFisik
    bankFisik: bankFisik,
    catatan: document.getElementById("catatanOpname").value,
    oleh: username,
    waktu: Date.now()
  }
  if(!data.tanggal){ alert("Tanggal wajib diisi"); return; }
  try{
    await push(ref(db,"audit/opname"), data);
    // Catat ke log juga
    await push(ref(db,"audit/log"),{
      tanggal: Date.now(),
      aksi: "OPNAME KAS",
      user: username,
      role: role,
      keterangan: `Kas: Rp ${formatRp(kasFisik)} | Bank: Rp ${formatRp(bankFisik)} - ${data.catatan}`, // FIX: kasFisik
      jumlah: kasFisik + bankFisik
    });
    alert("Opname tersimpan ✅");
    document.getElementById("kasFisik").value = ""; // FIX: kasFisik
    document.getElementById("bankFisik").value = "";
    document.getElementById("catatanOpname").value = "";
  } catch(err){ alert("Gagal simpan: " + err.message); }
}

// 4. EXPORT PDF - AMBIL DATA TERBARU LANGSUNG
window.exportAuditPDF = async function(){
  if(dataLog.length === 0){ alert("Belum ada data log"); return; }
  
  const snapOpname = await get(ref(db,"audit/opname"));
  const arrOpname = [];
  snapOpname.forEach(child=> arrOpname.push(child.val()));
  arrOpname.sort((a,b)=> (b.waktu || 0) - (a.waktu || 0)); // FIX: kasih fallback
  const opnameTerbaru = arrOpname[0] || {};

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("p","mm","a4");
  
  doc.setFontSize(16); doc.text("BERITA ACARA OPNAME & AUDIT KAS", 105, 15, {align:"center"});
  doc.setFontSize(11); doc.text("KOPERASI ARFA SEJAHTERA", 105, 22, {align:"center"});
  doc.setFontSize(9); doc.text("Tanggal Cetak: " + new Date().toLocaleDateString("id-ID"), 14, 30);
  
  let y = 38;
  doc.setFontSize(11); doc.text("A. HASIL OPNAME KAS TERAKHIR", 14, y); y+=6;
  
  doc.autoTable({
    startY:y, 
    head:[["Uraian","Jumlah"]],
    body:[
      ["Tanggal Opname", opnameTerbaru.tanggal || "-"],
      ["Dilakukan Oleh", opnameTerbaru.oleh || "-"],
      ["Kas Fisik", "Rp " + formatRp(opnameTerbaru.kasFisik)],
      ["Bank Fisik", "Rp " + formatRp(opnameTerbaru.bankFisik)],
      ["Catatan", opnameTerbaru.catatan || "-"]
    ], 
    theme:"grid", 
    styles:{fontSize:9},
    headStyles:{fillColor: [30, 144, 255]}
  })
  
  y = doc.lastAutoTable.finalY + 10;
  doc.text("B. LOG AKTIVITAS TERAKHIR 30 DATA", 14, y); y+=6;
  const bodyLog = dataLog.slice(0,30).map(d=>[
    new Date(d.tanggal).toLocaleString("id-ID"), d.aksi, d.user, d.keterangan, "Rp "+formatRp(d.jumlah)
  ]);
  doc.autoTable({startY:y, head:[["Tgl & Jam","Aksi","User","Keterangan","Jumlah"]], body:bodyLog, theme:"grid", styles:{fontSize:7}, headStyles:{fillColor: [30, 144, 255]}});
  
  y = doc.lastAutoTable.finalY + 20;
  doc.setFontSize(10);
  doc.text("Mengetahui,", 30, y); doc.text("Yang Bertugas,", 150, y); y+=6;
  doc.text("Pengawas", 30, y); doc.text("Bendahara", 150, y); y+=20;
  doc.text("(___________________)", 30, y); doc.text("(___________________)", 150, y);
  
  doc.save(`BA_Audit_${new Date().toISOString().slice(0,10)}.pdf`);
}
  window.kembali=function(){
  window.location.href="dashboard.html";
}
  
</script>
</body>
</html>
