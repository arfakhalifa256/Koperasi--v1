<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Koperasi ARFA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f1f5f9;padding:10px}
header{background:linear-gradient(90deg,#1e90ff,#0f3057);color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2{color:#0f3057;font-size:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:10px}
th{background:#1e90ff;color:#fff;padding:8px;text-align:left}
td{padding:7px;border-bottom:1px solid #e2e8f0}
.btn{padding:9px 12px;border:none;border-radius:8px;background:#1e90ff;color:#fff;font-weight:600;cursor:pointer}
.btn.red{background:#dc2626}
input{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px}
.label{font-size:10px;color:#64748b;margin-bottom:3px}
</style>
</head>
<body>
<header><div><span class="material-icons">books</span> AUDIT KAS</div><span onclick="location='dashboard.html'" class="material-icons" style="cursor:pointer">home</span></header>

<div class="card" style="background:linear-gradient(135deg,#0f3057,#1e90ff);color:#fff;border:none">
  <h2 style="color:#fff">📌 OPNAME TERAKHIR</h2>
  <div id="boxTerakhir" style="font-size:11px">Memuat...</div>
</div>

<div class="card">
  <h2>1. Opname Kas Bulanan</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div><div class="label">Tanggal Opname</div><input type="date" id="tglOpname"></div>
    <div><div class="label">Dilakukan Oleh</div><input type="text" id="namaOpname" readonly style="background:#f1f5f9"></div>
    <div><div class="label">Kas Fisik</div><input type="number" id="kasFisik" placeholder="0"></div>
    <div><div class="label">Bank Fisik</div><input type="number" id="bankFisik" placeholder="0"></div>
    <div style="grid-column:1/-1"><div class="label">Catatan</div><input type="text" id="catatanOpname" placeholder="Contoh: Selisih Nihil"></div>
  </div>
  <button class="btn" onclick="simpanOpname()" style="margin-top:10px">💾 Simpan Opname</button>
</div>


<div class="card">
  <h2>2. Log Aktivitas Kas</h2>
  <button class="btn red" onclick="exportAuditPDF()">📄 Export Berita Acara PDF</button>
  <div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>Tanggal</th><th>Aksi</th><th>User</th><th>Keterangan</th><th>Jumlah</th></tr></thead><tbody id="logTable"></tbody></table></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,push,onValue,get,set} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
const username=localStorage.getItem("username");let role=localStorage.getItem("role");if(role)role=role.toLowerCase().trim();
if(!username){alert("Session habis");location.href="index.html";}
if(role!=="admin"){alert("Hanya admin");location.href="dashboard.html";}
document.getElementById("namaOpname").value=username;document.getElementById("tglOpname").valueAsDate=new Date();
let dataLog=[];const formatRp=n=>Number(n||0).toLocaleString("id-ID");

onValue(ref(db,"audit/opname_terakhir"),snap=>{
  const box=document.getElementById("boxTerakhir");
  if(!snap.exists()){box.innerHTML="Belum ada opname";return;}
  const d=snap.val();
  box.innerHTML=`<div style="display:flex;justify-content:space-between"><div><b>${d.tanggal}</b><br>Oleh: ${d.oleh}<br><small>${d.catatan||'-'}</small></div><div style="text-align:right">Kas: Rp ${formatRp(d.kasFisik)}<br>Bank: Rp ${formatRp(d.bankFisik)}<br><b>Total: Rp ${formatRp((d.kasFisik||0)+(d.bankFisik||0))}</b></div></div>`;
});

onValue(ref(db,"audit/log"),snap=>{
  const tbody=document.getElementById("logTable");tbody.innerHTML="";
  if(!snap.exists()){tbody.innerHTML=`<tr><td colspan="5" style="text-align:center">Belum ada aktivitas</td></tr>`;return;}
  const logs=[];snap.forEach(c=>logs.push(c.val()));logs.sort((a,b)=>b.tanggal-a.tanggal);dataLog=logs;
  logs.forEach(d=>{tbody.innerHTML+=`<tr><td>${new Date(d.tanggal).toLocaleString("id-ID")}</td><td><b>${d.aksi}</b></td><td>${d.user}</td><td>${d.keterangan}</td><td style="text-align:right">Rp ${formatRp(d.jumlah)}</td></tr>`});
});

onValue(ref(db,"audit/opname"),snap=>{
  const arr=[];snap.forEach(c=>arr.push(c.val()));arr.sort((a,b)=>(b.waktu||0)-(a.waktu||0));
  const div=document.getElementById("riwayatOpname");
  if(!arr.length){div.innerHTML="Belum ada data";return;}
  let h=`<table><thead><tr><th>Tanggal</th><th>Kas</th><th>Bank</th><th>Oleh</th><th>Catatan</th></tr></thead><tbody>`;
  arr.slice(0,10).forEach(d=>{h+=`<tr><td>${d.tanggal}</td><td>Rp ${formatRp(d.kasFisik)}</td><td>Rp ${formatRp(d.bankFisik)}</td><td>${d.oleh}</td><td>${d.catatan||'-'}</td></tr>`});
  div.innerHTML=h+`</tbody></table>`;
});

window.simpanOpname=async()=>{
  const kasFisik=Number(document.getElementById("kasFisik").value)||0;
  const bankFisik=Number(document.getElementById("bankFisik").value)||0;
  const tgl=document.getElementById("tglOpname").value;
  const catatan=document.getElementById("catatanOpname").value;
  if(!tgl){alert("Tanggal wajib diisi");return;}
  const data={tanggal:tgl,kasFisik,bankFisik,catatan,oleh:username,waktu:Date.now()};
  const logData={tanggal:Date.now(),aksi:"OPNAME KAS",user:username,role,keterangan:`Kas: Rp ${formatRp(kasFisik)} | Bank: Rp ${formatRp(bankFisik)} - ${catatan||'Nihil'}`,jumlah:kasFisik+bankFisik};
  await push(ref(db,"audit/opname"),data);
  await set(ref(db,"audit/opname_terakhir"),data);
  await push(ref(db,"audit/log"),logData);
  await set(ref(db,"audit/log_terakhir"),logData);
  alert("Opname tersimpan ✅");
  document.getElementById("kasFisik").value="";document.getElementById("bankFisik").value="";document.getElementById("catatanOpname").value="";
};
window.exportAuditPDF=async()=>{ /* sama seperti sebelumnya */ };
</script>
</body>
</html>
