<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kwitansi Koperasi ARFA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
.card{background:#f8fafc;padding:20px;border-radius:10px;margin-bottom:20px;border:1px solid #e5e7eb;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
label.form{font-size:12px;font-weight:600;display:block;margin-bottom:6px;}
input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;}
#canvasTtd{width:100%;max-width:300px;height:100px;border:1px dashed #999;border-radius:8px;background:#fff;cursor:crosshair;touch-action:none;}
.btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;}
.btn-pdf{background:#f97316;color:#fff;}.btn-print{background:#1e90ff;color:#fff;}.btn-clear{background:#ef4444;color:#fff;font-size:12px;padding:6px 10px;}
.btn-group{display:flex;gap:10px;margin-top:15px;}
.kwitansi-preview{border:2px solid #000;padding:20px;position:relative;background:#fff;min-height:380px;overflow:hidden;}
.watermark-preview{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:260px;opacity:0.08;z-index:0;pointer-events:none;}
.kwitansi-content{position:relative;z-index:1;}
.header-k{display:flex;justify-content:space-between;margin-bottom:18px;}
.row-k{display:flex;margin-bottom:10px;align-items:flex-start;}
.row-k label{width:140px;font-size:12px;font-weight:600;padding-top:7px;}
.row-k.kotak{flex:1;border:1px solid #000;padding:6px 8px;font-size:13px;min-height:26px;background:#fff;line-height:1.4;}
.row-k.kotak-2baris{min-height:42px;}
.row-bawah{display:flex;justify-content:space-between;margin-top:25px;}
.box-rp{border:1px solid #000;padding:8px 10px;font-weight:bold;width:150px;text-align:center;background:#fff;}
.ttd{text-align:center;font-size:12px;width:200px;background:#fff;}
.ttd img{max-width:150px;max-height:60px;margin:5px auto;display:block;}
@media print{.no-print{display:none!important;}.watermark-preview{opacity:0.06!important;}}
</style>
</head>
<body>


<div class="card no-print">
<h3>1. Data Kwitansi</h3>

<div class="form-grid">
  <!-- CARD 1 -->
  <div class="form-card">
    <label class="form-label">🏢 Nama Perusahaan</label>
    <input type="text" id="perusahaan" value="  " placeholder="Nama Koperasi">
  </div>

  <!-- CARD 2 -->
  <div class="form-card">
    <label class="form-label">📍 ALAMAT</label>
    <input type="text" id="alamat" value="" placeholder="">
  </div>

  <!-- CARD 3 -->
  <div class="form-card">
    <label class="form-label">🧾 No. Kwitansi</label>
    <input type="text" id="noKwitansi" value="0001" placeholder="0001">
  </div>

  <!-- CARD 4 -->
  <div class="form-card">
    <label class="form-label">📅 Tanggal</label>
    <input type="date" id="tanggal">
  </div>

  <!-- CARD 5 -->
  <div class="form-card">
    <label class="form-label">👤 Sudah terima dari</label>
    <input type="text" id="dari" placeholder=" ">
  </div>

  <!-- CARD 6 -->
  <div class="form-card">
    <label class="form-label">💰 Jumlah Rp</label>
    <input type="number" id="jumlah" min="0" oninput="updatePreview()" placeholder="0">
  </div>
</div>

<!-- CARD FULL WIDTH -->
<div class="form-card" style="margin-top:15px">
  <label class="form-label">📝 Untuk Pembayaran</label>
  <textarea id="untuk" rows="2" placeholder=""></textarea>
</div>
</div>

<div class="card no-print">
<h3>2. Logo & Tanda Tangan</h3>
<label class="form">Ganti Logo Watermark</label>
<input type="file" id="uploadLogo" accept="image/*">
<br><br>
<label class="form">Upload Gambar TTD</label><input type="file" id="uploadTtd" accept="image/*">
<label class="form" style="margin-top:15px">Atau Coret2 TTD</label>
<canvas id="canvasTtd" width="600" height="200"></canvas><br><br>
<button class="btn btn-clear" onclick="clearCanvas()">🗑️ Hapus Coretan</button>
<label class="form" style="margin-top:15px">Nama Penandatangan</label><input type="text" id="ttd">
</div>

<h3>Preview Kwitansi</h3>
<div class="kwitansi-preview" id="preview">
<img id="watermarkImg" class="watermark-preview" src="" alt="watermark">
<div class="kwitansi-content">
<div class="header-k"><div><h2>KWITANSI</h2><p id="pPerusahaan2"></p><p id="pAlamat"></p></div><div>No. :<span id="pNo">0001</span></div></div>
<div class="row-k"><label>Sudah terima dari :</label><div class="kotak" id="pDari"></div></div>
<div class="row-k"><label>Uang Sebesar :</label><div class="kotak" id="pTerbilang"></div></div>
<div class="row-k"><label>Untuk Pembayaran :</label><div class="kotak kotak-2baris" id="pUntuk"></div></div>
<div class="row-bawah"><div class="box-rp">Rp <span id="pJumlah">0</span></div><div class="ttd"><span id="pKotaTgl"></span><br><img id="previewTtd" src="" style="display:none"><div id="pTtd"></div></div></div>
</div>


<div class="btn-group no-print"><button class="btn btn-print" onclick="window.print()">🖨️ Cetak</button><button class="btn btn-pdf" onclick="downloadPDF()">📄 Download PDF</button></div>
</div>

<script>
const { jsPDF } = window.jspdf;
let ttdImageBase64 = "";
let logoWatermarkBase64 = ""; 

document.getElementById("tanggal").valueAsDate = new Date();
updatePreview();
document.querySelectorAll("input, textarea").forEach(el => {el.addEventListener("input", updatePreview);});

document.getElementById("uploadLogo").addEventListener("change", function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(event){
    logoWatermarkBase64 = event.target.result;
    document.getElementById("watermarkImg").src = logoWatermarkBase64;
  };
  reader.readAsDataURL(file);
});

document.getElementById("uploadTtd").addEventListener("change", function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(event){ttdImageBase64 = event.target.result; const img = document.getElementById("previewTtd"); img.src = ttdImageBase64; img.style.display = "block";};
  reader.readAsDataURL(file);
});

const canvas = document.getElementById("canvasTtd"); const ctx = canvas.getContext("2d"); let drawing = false;
ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.strokeStyle = "#000";
function getPointerPosition(e){const rect = canvas.getBoundingClientRect(); let clientX = e.touches? e.touches[0].clientX : e.clientX; let clientY = e.touches? e.touches[0].clientY : e.clientY; const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height; return {x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY};}
function startDrawing(e){e.preventDefault(); drawing = true; const pos = getPointerPosition(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y);}
function drawSignature(e){if(!drawing) return; e.preventDefault(); const pos = getPointerPosition(e); ctx.lineTo(pos.x, pos.y); ctx.stroke();}
function stopDrawing(e){if(!drawing) return; e.preventDefault(); drawing = false; ctx.closePath(); ttdImageBase64 = canvas.toDataURL("image/png"); const img = document.getElementById("previewTtd"); img.src = ttdImageBase64; img.style.display = "block";}
canvas.addEventListener("mousedown", startDrawing); canvas.addEventListener("mousemove", drawSignature); canvas.addEventListener("mouseup", stopDrawing); canvas.addEventListener("touchstart", startDrawing, {passive:false}); canvas.addEventListener("touchmove", drawSignature, {passive:false}); canvas.addEventListener("touchend", stopDrawing, {passive:false});
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height); ttdImageBase64 = ""; document.getElementById("previewTtd").style.display = "none"; document.getElementById("uploadTtd").value = "";}

function updatePreview(){
  document.getElementById("pPerusahaan2").innerText = document.getElementById("perusahaan").value;
  document.getElementById("pAlamat").innerText = document.getElementById("alamat").value;
  document.getElementById("pNo").innerText = document.getElementById("noKwitansi").value;
  document.getElementById("pDari").innerText = document.getElementById("dari").value;
  document.getElementById("pUntuk").innerText = document.getElementById("untuk").value;
  document.getElementById("pTtd").innerText = document.getElementById("ttd").value;
  const val = parseFloat(document.getElementById("jumlah").value) || 0;
  document.getElementById("pJumlah").innerText = val.toLocaleString("id-ID");
  document.getElementById("pTerbilang").innerText = terbilangFix(val).toUpperCase() + " RUPIAH";
  const tanggal = document.getElementById("tanggal").value;
  if(tanggal){const tgl = new Date(tanggal + "T00:00:00"); document.getElementById("pKotaTgl").innerText = "Pd Betung, " + tgl.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});}
}

function terbilangFix(n){n = Math.floor(n); if(n === 0) return "nol"; const angka = ["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"]; let result = ""; if(n < 12){result = angka[n];} else if(n < 20){result = terbilangFix(n - 10) + " belas";} else if(n < 100){result = terbilangFix(Math.floor(n / 10)) + " puluh " + terbilangFix(n % 10);} else if(n < 200){result = "seratus " + terbilangFix(n - 100);} else if(n < 1000){result = terbilangFix(Math.floor(n / 100)) + " ratus " + terbilangFix(n % 100);} else if(n < 2000){result = "seribu " + terbilangFix(n - 1000);} else if(n < 1000000){result = terbilangFix(Math.floor(n / 1000)) + " ribu " + terbilangFix(n % 1000);} else{result = terbilangFix(Math.floor(n / 1000000)) + " juta " + terbilangFix(n % 1000000);}
return result.replace(/\bnol\b/g,"").replace(/\s+/g," ").trim();}

// PDF
function downloadPDF(){
  const doc = new jsPDF("p","mm","a4");
  const offsetY = 12;

  const no = document.getElementById("noKwitansi").value;
  const perusahaan = document.getElementById("perusahaan").value;
  const alamat = document.getElementById("alamat").value;
  const dari = document.getElementById("dari").value;
  const untuk = document.getElementById("untuk").value;
  const terbilang = document.getElementById("pTerbilang").innerText;
  const jumlah = document.getElementById("pJumlah").innerText;
  const kotaTgl = document.getElementById("pKotaTgl").innerText;
  const namaTtd = document.getElementById("ttd").value;

  // HEADER
  doc.setFont("helvetica","bold"); doc.setFontSize(16);
  doc.text("KWITANSI", 20, 25 + offsetY);
  doc.setFont("helvetica","normal"); doc.setFontSize(11);
  doc.text(perusahaan, 20, 31 + offsetY);
  doc.text(alamat, 20, 36 + offsetY);
  doc.text(`No. : ${no}`, 160, 25 + offsetY);

  let y = 45 + offsetY;

  // SUDAH TERIMA DARI - Auto wrap
  doc.setFont("helvetica", "bolditalic"); doc.setFontSize(10);
  doc.text("Sudah terima dari :", 20, y);
  doc.setFont("helvetica", "normal");
  const dariLines = doc.splitTextToSize(dari, 125);
  const dariHeight = 12; // tinggi box dasar 1 baris
  doc.rect(60, y-4, 130, Math.max(dariHeight, dariLines.length * 5 + 2));
  doc.text(dariLines, 62, y);
  y += Math.max(14, dariLines.length * 5 + 2);

  // UANG SEBESAR - Auto wrap
  doc.setFont("helvetica", "bolditalic");
  doc.text("Uang Sebesar :", 20, y);
  doc.setFont("helvetica", "normal");
  const terbilangLines = doc.splitTextToSize(terbilang, 125);
  doc.rect(60, y-4, 130, Math.max(12, terbilangLines.length * 5 + 2));
  doc.text(terbilangLines, 62, y);
  y += Math.max(14, terbilangLines.length * 5 + 2);

  // UNTUK PEMBAYARAN - 2 baris min, auto wrap
  doc.setFont("helvetica", "bolditalic");
  doc.text("Untuk Pembayaran :", 20, y);
  doc.setFont("helvetica", "normal");
  const untukLines = doc.splitTextToSize(untuk, 125);
  const untukHeight = 12; // min 2 baris
  doc.rect(60, y-4, 130, Math.max(12,untukHeight, untukLines.length * 5 + 2));
  doc.text(untukLines, 62, y);
  y += Math.max(14, untukLines.length * 5 + 2);

  // HITUNG AREA KWITANSI UNTUK WATERMARK
  const startY = 20 + offsetY;
  const endY = y + 35;
  const boxHeight = endY - startY;
  const boxWidth = 190;

  // WATERMARK PAS TENGAH
  if(logoWatermarkBase64){
    const imgW = 100;
    const imgH = 100;
    const x = 20 + (boxWidth - imgW) / 2;
    const yCenter = startY + (boxHeight - imgH) / 2;
    doc.setGState(new doc.GState({opacity: 0.08}));
    doc.addImage(logoWatermarkBase64, 'JPEG', x, yCenter, imgW, imgH); // ganti ke JPEG karena logo kamu jpg
    doc.setGState(new doc.GState({opacity: 1}));
  }

  // NOMINAL
  doc.setFont("helvetica","bolditalic");
  doc.rect(20, y, 48, 14);
  doc.text(`Rp ${jumlah}`, 23, y + 9);

  // TANGGAL
  doc.setFont("helvetica","normal");
  doc.text(kotaTgl, 130, y + 5);

  // TTD
  if(ttdImageBase64){
    try{doc.addImage(ttdImageBase64, "PNG", 125, y + 6, 40, 18);}catch(e){}
  }
  doc.text(namaTtd, 145, y + 28);

  doc.save(`Kwitansi-${no || "0001"}.pdf`);
}
</script>
</body>
</html>
