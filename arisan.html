<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arisan Koperasi ARFA</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--primary:#3b82f6;--primary-dark:#2563eb;--bg:#f1f5f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--danger:#dc2626;--success:#10b981;--warning:#f59e0b;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
body{background:var(--bg);color:var(--text);font-size:13px;}
header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;}
.container{padding:15px;max-width:900px;margin:0 auto}
.card{background:var(--card);padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,.08)}
h2{margin-bottom:12px;font-size:16px;color:var(--primary-dark)}
h3{margin-top:15px;font-size:14px;color:var(--text)}
.form-group{margin-bottom:12px}
label{display:block;margin-bottom:5px;font-weight:600;font-size:12px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px}
button{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
button:disabled{opacity:0.6; cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.list{display:flex;flex-direction:column;gap:10px;margin-top:15px}
.item{background:#fff;padding:12px;border-radius:10px;border:1px solid #e5e7eb}
.item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.badge{padding:4px 8px;border-radius:20px;font-size:10px;color:#fff;font-weight:600}
.badge.aktif{background:var(--success)}
.badge.selesai{background:var(--muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.member-tag{background:#e0f2fe;color:#0369a1;padding:4px 8px;border-radius:20px;font-size:11px;margin:2px;display:inline-block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:999}
.modal.show{display:flex}
.modal-content{background:#fff;width:95%;max-width:500px;border-radius:12px;padding:15px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:#fff;padding:10px 15px;border-radius:8px;opacity:0;transition:.3s;z-index:9999}
.toast.show{opacity:1}
.checkbox-item{display:flex; align-items:center; gap:8px; padding:6px; border-bottom:1px solid #eee}
.tabel-setor{width:100%; border-collapse:collapse; font-size:12px; margin-top:10px}
.tabel-setor th,.tabel-setor td{padding:8px; border-bottom:1px solid #eee; text-align:left}
.tabel-setor th{background:#f8fafc; font-weight:600}
.tabel-setor input[type=checkbox]{width:18px; height:18px}
.btn-kecil{padding:5px 8px; font-size:11px}
tr.lunas{background:#dcfce7}

/* ANIMASI ROLET */
#roletBox{display:none; text-align:center; padding:20px; background:#fef3c7; border-radius:12px; margin:10px 0; border:2px dashed var(--warning)}
#roletBox.show{display:block; animation:shake.5s}
#roletNama{font-size:26px; font-weight:700; color:var(--danger); min-height:40px; transition:all 0.1s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pemenang{animation:blink 1s 3; color:var(--success)!important; font-size:28px!important}
@keyframes blink{0%,100%{opacity:1; transform:scale(1)}50%{opacity:0.3; transform:scale(1.1)}}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="material-icons">groups</span> ARISAN KOPERASI</div>
  <span onclick="window.location='dashboard.html'" class="material-icons" style="cursor:pointer">home</span>
</header>

<div class="container">
  <div class="card">
    <h2>+ Buat Arisan Baru</h2>
    <div class="form-group"><label>Nama Arisan</label><input type="text" id="namaArisan" placeholder="Contoh: Arisan "></div>
    <div class="grid-2">
      <div class="form-group"><label>Jumlah Iuran</label><input type="number" id="iuran" placeholder="100000"></div>
      <div class="form-group"><label>Periode</label><select id="periode"><option value="mingguan">Mingguan</option><option value="bulanan">Bulanan</option></select></div>
    </div>
    <div class="form-group">
      <label>Pilih Anggota <span id="jmlAnggotaDipilih" style="color:var(--primary)">0</span> orang</label>
      <div id="listCheckboxAnggota" style="max-height:200px; overflow-y:auto; border:1px solid #ddd; border-radius:8px; padding:8px; background:#fafafa"></div>
    </div>
    <button class="btn-primary" id="btnBuatArisan">Buat Arisan</button>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
      <h2>Daftar Arisan</h2>
      <select id="filterStatus" style="width:auto; padding:6px 10px"><option value="semua">Semua</option><option value="aktif">Aktif</option><option value="selesai">Selesai</option></select>
    </div>
    <div class="list" id="listArisan"></div>
  </div>
</div>

<div id="modalDetail" class="modal">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between"><h2 id="detailJudul">Detail Arisan</h2><span onclick="tutupModal()" class="material-icons" style="cursor:pointer">close</span></div>
    <div id="detailInfo"></div>

    <h3>Input Setoran Putaran <span id="txtPeriodeSekarang"></span></h3>
    <table class="tabel-setor"><thead><tr><th width="40">Lunas</th><th>Nama Anggota</th><th>Jumlah</th></tr></thead><tbody id="tabelSetoran"></tbody></table>

    <div class="grid-2" style="margin-top:10px">
      <div class="form-group"><label>Potongan Jasa Kas %</label><input type="number" id="inputJasa" value="5" min="0" max="100"></div>
      <div class="form-group"><label>Total Diterima</label><input type="text" id="inputDiterima" readonly style="background:#f3f4f6; font-weight:700; color:var(--success)"></div>
    </div>

    <div id="roletBox"><div style="font-size:12px; color:#92400e">Mengocok...</div><div id="roletNama"></div></div>

    <div class="grid-2" style="margin-top:10px">
      <button class="btn-warning" id="btnPutaran">🎲 Kocok Rolet</button>
    </div>
    <button class="btn-danger btn-kecil" style="width:100%; margin-top:8px" id="btnHapusArisan">🗑️ Hapus Arisan Ini</button>
    <h3>Riwayat Putaran</h3><div class="list" id="listRiwayat"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = { apiKey: "AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo", authDomain: "arfa-c7dee.firebaseapp.com", databaseURL: "https://arfa-c7dee-default-rtdb.firebaseio.com", projectId: "arfa-c7dee" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);

// AUDIO CONTEXT BUAT SOUND TANPA FILE
let audioCtx;
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playDrum(){
  initAudio(); const ctx = audioCtx;
  for(let i=0; i<30; i++){
    setTimeout(()=>{
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.frequency.value = 200 - i*3; gain.gain.value = 0.3 - i*0.01;
      osc.connect(gain).connect(ctx.destination); osc.start(); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1); osc.stop(ctx.currentTime + 0.1);
    }, i*80)
  }
}
function playMenang(){
  initAudio(); const ctx = audioCtx;
  [523,659,784,1046].forEach((f,i)=>{
    setTimeout(()=>{ const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.frequency.value=f; gain.gain.value=0.3; osc.connect(gain).connect(ctx.destination); osc.start(); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4); osc.stop(ctx.currentTime + 0.4); }, i*200)
  })
}

const role = (localStorage.getItem("role") || "").toLowerCase();
if(role!== "admin"){ alert("Hanya Admin"); window.location="dashboard.html"; }

let dataAnggota = {}; let dataArisan = {}; let arisanAktifId = null; let filterSaatIni = "semua"; let sedangKocok = false;
const rupiah = n => "Rp " + Number(n || 0).toLocaleString("id-ID");
function showToast(msg){ const t=document.getElementById("toast"); t.innerText=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2500); }

function hitungDiterima(){
  if(!arisanAktifId) return;
  const a = dataArisan[arisanAktifId];
  const totalKas = a.iuran * a.jumlahAnggota;
  const jasaPersen = Number(document.getElementById("inputJasa").value) || 0;
  const potongan = totalKas * (jasaPersen / 100);
  const diterima = totalKas - potongan;
  document.getElementById("inputDiterima").value = rupiah(diterima);
}

onValue(ref(db,"anggota"), snap=>{
  dataAnggota = snap.val() || {};
  const container = document.getElementById("listCheckboxAnggota"); container.innerHTML = "";
  if(Object.keys(dataAnggota).length === 0){ container.innerHTML = "<p style='color:#888'>Belum ada data anggota</p>"; return; }
  Object.entries(dataAnggota).forEach(([id,a])=>{ container.innerHTML += `<label class="checkbox-item"><input type="checkbox" class="cbAnggota" value="${id}"><div><b>${a.nama}</b><br><small style="color:#666">${a.idAnggota || ''} - ${a.telepon || ''}</small></div></label>`; });
  document.querySelectorAll('.cbAnggota').forEach(cb=>{ cb.addEventListener('change', ()=>{ document.getElementById("jmlAnggotaDipilih").innerText = document.querySelectorAll('.cbAnggota:checked').length; }) });
});

onValue(ref(db,"arisan"), snap=>{ dataArisan = snap.val() || {}; renderListArisan(); });
document.getElementById("filterStatus").addEventListener("change", (e)=>{ filterSaatIni = e.target.value; renderListArisan(); });

function renderListArisan(){
  const list = document.getElementById("listArisan"); let data = Object.entries(dataArisan);
  if(filterSaatIni!== "semua"){ data = data.filter(([id,a]) => a.status === filterSaatIni); }
  data.sort((a,b)=> b[1].tanggalBuat - a[1].tanggalBuat);
  if(data.length === 0){ list.innerHTML = `<p style='color:#888; text-align:center'>Tidak ada arisan ${filterSaatIni}</p>`; return; }
  list.innerHTML = ""; data.forEach(([id,a])=>{
    list.innerHTML += `<div class="item"><div class="item-top"><div><b>${a.nama}</b><br><small>${a.periode} - ${a.jumlahAnggota} Anggota</small></div><div class="badge ${a.status}">${a.status.toUpperCase()}</div></div><div>Iuran: <b>${rupiah(a.iuran)}</b></div><div style="font-size:11px; color:#666">Putaran: ${a.periodeSekarang} / ${a.jumlahAnggota}</div><div class="grid-2" style="margin-top:8px"><button class="btn-primary" onclick="bukaDetail('${id}')">Kelola</button><button class="btn-danger btn-kecil" onclick="hapusArisanDariList('${id}', '${a.nama}')">🗑️ Hapus</button></div></div>`;
  });
}

document.getElementById("btnBuatArisan").onclick = async ()=>{
  initAudio(); // aktifin audio pas klik pertama
  const nama = document.getElementById("namaArisan").value.trim(); const iuran = Number(document.getElementById("iuran").value); const periode = document.getElementById("periode").value; const anggotaTerpilih = Array.from(document.querySelectorAll('.cbAnggota:checked')).map(cb=>cb.value);
  if(!nama) return alert("Nama arisan wajib diisi"); if(!iuran || iuran < 1000) return alert("Jumlah iuran tidak valid"); if(anggotaTerpilih.length < 2) return alert("Pilih minimal 2 anggota");
  const btn = document.getElementById("btnBuatArisan"); btn.disabled = true; btn.innerText = "Menyimpan...";
  try{ const arisanBaru = push(ref(db,"arisan")); await set(arisanBaru,{ nama, iuran, periode, status:"aktif", jumlahAnggota: anggotaTerpilih.length, anggota: anggotaTerpilih, periodeSekarang: 1, tanggalBuat: Date.now() }); const updates = {}; anggotaTerpilih.forEach(id=>{ updates[`arisan_anggota/${arisanBaru.key}/${id}`] = { nama: dataAnggota[id].nama, sudahDapat: false, totalSetor: 0 }; }); await update(ref(db), updates); showToast("Arisan berhasil dibuat"); document.getElementById("namaArisan").value = ""; document.getElementById("iuran").value = ""; document.querySelectorAll('.cbAnggota:checked').forEach(cb=>cb.checked=false); document.getElementById("jmlAnggotaDipilih").innerText = 0;
  }catch(err){ alert("Gagal: " + err.message) } finally{ btn.disabled = false; btn.innerText = "Buat Arisan"; }
}

window.bukaDetail = async function(id){
  initAudio();
  arisanAktifId = id; const a = dataArisan[id]; const snapAnggota = await get(ref(db,`arisan_anggota/${arisanAktifId}`)); const dataAnggotaArisan = snapAnggota.val() || {}; const anggotaBelumDapat = a.anggota.filter(id=>!dataAnggotaArisan[id]?.sudahDapat);
  document.getElementById("detailJudul").innerText = a.nama; document.getElementById("txtPeriodeSekarang").innerText = a.periodeSekarang;
  document.getElementById("detailInfo").innerHTML = `<p><b>Putaran:</b> ${a.periodeSekarang} / ${a.jumlahAnggota}</p><p><b>Iuran:</b> ${rupiah(a.iuran)}</p><p><b>Sisa Peserta:</b> <span style="color:var(--warning); font-weight:700">${anggotaBelumDapat.length} orang</span></p><p><b>Anggota:</b><br>${a.anggota.map(id=>`<span class="member-tag" style="background:${dataAnggotaArisan[id]?.sudahDapat?'#dcfce7':'#e0f2fe'}">${dataAnggota[id]?.nama} ${dataAnggotaArisan[id]?.sudahDapat?'✓':''}</span>`).join("")}</p>`;
  const roletBox = document.getElementById("roletBox"); roletBox.classList.remove("show"); roletBox.style.display = "none"; document.getElementById("roletNama").classList.remove("pemenang");
  renderTabelSetoran(a, dataAnggotaArisan); loadRiwayat(id); hitungDiterima(); document.getElementById("inputJasa").addEventListener("input", hitungDiterima); document.getElementById("modalDetail").classList.add("show");
}
window.tutupModal = ()=> document.getElementById("modalDetail").classList.remove("show");

async function renderTabelSetoran(a, dataAnggotaArisan){
  const tbody = document.getElementById("tabelSetoran"); tbody.innerHTML = ""; const periode = a.periodeSekarang; const snapSetor = await get(ref(db,`arisan_setoran/${arisanAktifId}/${periode}`)); const dataSetor = snapSetor.val() || {};
  a.anggota.forEach(id=>{
    const nama = dataAnggota[id]?.nama || "Loading...";
    const sudahBayar = dataSetor[id]?.status === "lunas";
    tbody.innerHTML += `<tr class="${sudahBayar?'lunas':''}"><td><input type="checkbox" class="cbSetor" data-id="${id}" ${sudahBayar? 'checked' : ''}></td><td>${nama}</td><td>${rupiah(a.iuran)}</td></tr>`;
  });
  document.querySelectorAll('.cbSetor').forEach(cb => {
    cb.addEventListener('change', async function() {
      const anggotaId = this.dataset.id;
      if(this.checked){
        await set(ref(db,`arisan_setoran/${arisanAktifId}/${periode}/${anggotaId}`),{ jumlah: a.iuran, tanggal: Date.now(), status: "lunas" });
        const snap = await get(ref(db,`arisan_anggota/${arisanAktifId}/${anggotaId}/totalSetor`)); const totalLama = snap.val() || 0;
        await update(ref(db,`arisan_anggota/${arisanAktifId}/${anggotaId}`),{totalSetor: totalLama + a.iuran});
        showToast(`${dataAnggota[anggotaId].nama} lunas`); this.closest('tr').classList.add('lunas');
      } else {
        await set(ref(db,`arisan_setoran/${arisanAktifId}/${periode}/${anggotaId}`), null);
        showToast(`${dataAnggota[anggotaId].nama} dibatalkan`); this.closest('tr').classList.remove('lunas');
      }
    });
  });
}

document.getElementById("btnHapusArisan").onclick = async ()=>{ hapusArisanDariList(arisanAktifId, dataArisan[arisanAktifId].nama); tutupModal(); }
window.hapusArisanDariList = async function(id, nama){ if(!confirm(`Yakin hapus arisan "${nama}"? Semua data akan terhapus`)) return; try{ await set(ref(db,`arisan/${id}`), null); await set(ref(db,`arisan_anggota/${id}`), null); await set(ref(db,`arisan_setoran/${id}`), null); await set(ref(db,`arisan_transaksi/${id}`), null); showToast(`Arisan "${nama}" dihapus`); } catch(err){ alert("Gagal hapus: " + err.message) } }

document.getElementById("btnPutaran").onclick = async ()=>{
  initAudio();
  if(sedangKocok) return; const a = dataArisan[arisanAktifId]; const periode = a.periodeSekarang;
  const snapSetor = await get(ref(db,`arisan_setoran/${arisanAktifId}/${periode}`)); const dataSetor = snapSetor.val() || {}; const jmlSetor = Object.keys(dataSetor).length;
  if(jmlSetor < a.jumlahAnggota) return alert(`Belum semua setor. ${jmlSetor}/${a.jumlahAnggota} orang`);
  const snapAnggota = await get(ref(db,`arisan_anggota/${arisanAktifId}`)); const dataAnggotaArisan = snapAnggota.val() || {}; const anggotaBelumDapat = a.anggota.filter(id=>!dataAnggotaArisan[id]?.sudahDapat);
  if(anggotaBelumDapat.length === 0) return alert("Semua anggota sudah dapat giliran");

  sedangKocok = true; document.getElementById("btnPutaran").disabled = true;
  const roletBox = document.getElementById("roletBox"); roletBox.style.display = "block"; roletBox.classList.add("show"); const roletNama = document.getElementById("roletNama"); roletNama.classList.remove("pemenang");

  playDrum(); // SOUND DRUM
  const interval = setInterval(()=>{ const randomId = anggotaBelumDapat[Math.floor(Math.random() * anggotaBelumDapat.length)]; roletNama.innerText = dataAnggota[randomId]?.nama || "Memilih..."; }, 80);

  setTimeout(async ()=>{
    clearInterval(interval);
    const pemenangId = anggotaBelumDapat[Math.floor(Math.random() * anggotaBelumDapat.length)]; roletNama.innerText = dataAnggota[pemenangId].nama; roletNama.classList.add("pemenang");
    playMenang(); // SOUND MENANG

    const totalKas = a.iuran * a.jumlahAnggota; const jasaPersen = Number(document.getElementById("inputJasa").value) || 0; const potongan = totalKas * (jasaPersen / 100); const diterima = totalKas - potongan;
    await set(ref(db,`arisan_transaksi/${arisanAktifId}/${periode}`),{ tanggal: Date.now(), pemenangId, totalKas, jasaPersen, potongan, diterima, metode: "rolet" });
    await update(ref(db,`arisan_anggota/${arisanAktifId}/${pemenangId}`),{sudahDapat:true});
    const periodeBaru = periode + 1; if(periodeBaru > a.jumlahAnggota){ await update(ref(db,`arisan/${arisanAktifId}`),{status:"selesai"}); showToast("Arisan Selesai"); } else{ await update(ref(db,`arisan/${arisanAktifId}`),{periodeSekarang: periodeBaru}); }
    cetakNotaArisan(a, pemenangId, totalKas, potongan, diterima, periode, jasaPersen);
    showToast(`Pemenang Putaran ${periode}: ${dataAnggota[pemenangId].nama}`); sedangKocok = false; document.getElementById("btnPutaran").disabled = false; setTimeout(()=>{ tutupModal(); bukaDetail(arisanAktifId); }, 3000);
  }, 3000);
}

async function loadRiwayat(arisanId){ const snap = await get(ref(db,`arisan_transaksi/${arisanId}`)); const data = snap.val() || {}; const list = document.getElementById("listRiwayat"); list.innerHTML = ""; if(Object.keys(data).length === 0){ list.innerHTML = "<p style='color:#888'>Belum ada riwayat</p>"; return; } Object.entries(data).forEach(([periode,t])=>{ list.innerHTML += `<div class="item"><div><b>Putaran ${periode}</b></div><div>Penerima: ${dataAnggota[t.pemenangId]?.nama}</div><div>Total Kas: ${rupiah(t.totalKas)}</div><div>Potongan Jasa ${t.jasaPersen || 0}%: -${rupiah(t.potongan || 0)}</div><div style="color:var(--success); font-weight:700">Diterima: ${rupiah(t.diterima)}</div></div>`; }); }

function cetakNotaArisan(a, pemenangId, totalKas, potongan, diterima, periode, jasaPersen){
  const { jsPDF } = window.jspdf; const doc = new jsPDF({unit: 'mm', format: [80, 130]}); let y=5; const center=40;
  doc.setFont("helvetica","bold");doc.setFontSize(10); doc.text("BUKTI PENERIMAAN ARISAN",center,y,{align:"center"});y+=5;
  doc.setFont("helvetica","normal");doc.setFontSize(8); doc.text(a.nama,center,y,{align:"center"});y+=7; doc.line(3,y,77,y);y+=4;
  doc.text(`Putaran: ${periode} / ${a.jumlahAnggota}`,3,y);y+=4; doc.text(`Penerima: ${dataAnggota[pemenangId].nama}`,3,y);y+=6;
  doc.text(`Total Kas: ${rupiah(totalKas)}`,3,y);y+=4; doc.text(`Potongan Jasa ${jasaPersen}%: -${rupiah(potongan)}`,3,y);y+=6;
  doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.text(`DITERIMA: ${rupiah(diterima)}`,3,y);y+=6;
  doc.line(3,y,77,y);y+=4; doc.setFont("helvetica","normal");doc.setFontSize(7); doc.text("Metode: Rolet Random",center,y,{align:"center"});y+=4; doc.text("Terima kasih",center,y,{align:"center"});
  doc.save(`Nota_Arisan_${a.nama}_P${periode}.pdf`);
}
</script>
</body>
</html>
