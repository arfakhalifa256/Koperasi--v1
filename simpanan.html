<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpanan Anggota</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
.sidebar{position:fixed;top:0;left:-260px;width:240px;height:100%;background:#0f3057;padding:16px;transition:0.3s;z-index:9999;}.sidebar.open{left:0;}.sidebar a{display:flex;gap:10px;color:#fff;text-decoration:none;padding:10px;border-radius:10px;font-size:11px}.sidebar a.active{background:rgba(255,255,255,.2);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:999;}.overlay.active{display:block;}
:root{--primary:#1e90ff;--primary-dark:#0f3057;--bg:#f1f5f9;--border:#e2e8f0;--shadow:0 2px 8px rgba(0,0,0,.06);--radius:12px;--danger:#dc2626;}
body{background:var(--bg);font-size:12px}
header{background:linear-gradient(to right,var(--primary),var(--primary-dark));color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:36px;height:36px;border-radius:50%;background:#fff;padding:2px}
.container{padding:14px;max-width:600px;margin:0 auto}
.card{background:#fff;padding:14px;border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.total{background:#dbeafe;font-size:14px;font-weight:700;text-align:center;color:var(--primary-dark)}
.form-group{margin-bottom:10px}.form-group label{font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:4px}
input,select{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:12px}
button{padding:10px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-weight:600;width:100%;cursor:pointer}
.btn-secondary{font-size:10px;color:#1f2937;border:1px solid var(--border)}.btn-danger{background:var(--danger)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:200;padding:10px}.modal.show{display:flex}
.modal-content{background:#fff;padding:18px;width:95%;max-width:700px;border-radius:12px;max-height:90vh;overflow:auto}
.list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;margin-top:10px}
.item{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--border);font-size:11px}
h3 {background:#ffedd5;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--border);font-size:13px}

  </style>
</head>
<body>
<div id="sidebar" class="sidebar"><a href="dashboard.html">🏠 Beranda</a><a href="simpanan.html" class="active">📊 Simpanan</a><a href="#" id="btnLogout">🚪 Logout</a></div>
<div id="overlay" class="overlay"></div>
<header><div class="brand"><img src="img/icon-192.png"><div>SIMPANAN ANGGOTA</div></div><span onclick="toggleSidebar()">☰</span></header>

<div class="container">
  <div class="card total">Total Simpanan : Rp <span id="totalSimpanan">0</span><br><small id="infoAnggota">0 anggota</small></div>
  <div class="card" id="formTambah">
    <h3>Form Input Simpanan</h3>
    <div class="form-group"><label>Pilih Anggota</label><select id="anggotaSelect"></select></div>
    <div class="form-group"><label>Jenis</label><select id="jenis"><option value="pokok">Pokok</option><option value="wajib">Wajib</option><option value="sukarela">Sukarela</option></select></div>
    <div class="form-group"><label>Metode</label><select id="metode"><option value="cash">Cash</option><option value="bank">Bank</option></select></div>
    <div class="form-group"><label>Jumlah</label><input type="number" id="jumlah" placeholder="0"></div>
    <div class="form-group"><label>Keterangan</label><input type="text" id="keterangan" placeholder="Setoran..."></div>
    <button id="btnSimpan">Simpan</button>
    <button class="btn-secondary" onclick="bukaRiwayat()" style="margin-top:8px;background:#ffedd5;">📋 Lihat Riwayat (<span id="jmlRiwayat">0</span>) - <span id="jmlTampil">0 tampil</span></button>
  </div>
</div>

<div class="modal" id="modalRiwayat"><div class="modal-content">
  <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:10p"><h3>📋 Riwayat Simpanan</h3><button onclick="tutupRiwayat()" style="width:auto;background:#dc2626;padding:6px 12px;border-radius:8px">✕</button></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <input type="text" id="searchRiwayat" placeholder="Cari nama..." style="flex:1;min-width:120px">
    <select id="filterJenis" style="width:105px"><option value="">Semua Jenis</option><option value="pokok">Pokok</option><option value="wajib">Wajib</option><option value="sukarela">Sukarela</option></select>
    <select id="filterMetode" style="width:105px"><option value="">Semua Metode</option><option value="cash">Cash</option><option value="bank">Bank</option></select>
  </div>
  <div class="list" id="listRiwayat"></div>
</div></div>

<div class="modal" id="modalForm"><div class="modal-content" id="modalFormContent"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, push, set, update, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const anggotaRef=ref(db,"/anggota"), simpananRef=ref(db,"/simpanan"), kasRef=ref(db,"/kas/transaksi");
let anggotaMap={}, kasList=[], allSimpanan=[];

window.toggleSidebar=()=>{document.getElementById("sidebar").classList.toggle("open");document.getElementById("overlay").classList.toggle("active");};
document.getElementById("overlay").onclick=window.toggleSidebar;
document.getElementById("btnLogout").onclick=e=>{e.preventDefault(); localStorage.clear(); location.href="index.html";};

onValue(anggotaRef,snap=>{
  const sel=document.getElementById("anggotaSelect"); sel.innerHTML="<option value=''>Pilih Anggota</option>"; anggotaMap={};
  snap.forEach(c=>{anggotaMap[c.key]=c.val(); const o=document.createElement("option"); o.value=c.key; o.textContent=c.val().nama+" ("+c.val().id+")"; sel.appendChild(o);});
});
onValue(kasRef,snap=>{kasList=[]; snap.forEach(c=>{kasList.push({id:c.key,...c.val()});});});

onValue(simpananRef,snap=>{
  allSimpanan=[]; let total=0; let anggotaUnik=new Set();
  snap.forEach(child=>{const d=child.val(); allSimpanan.push({id:child.key,...d}); total+=Number(d.jumlah||0); anggotaUnik.add(d.anggotaId);});
  document.getElementById("totalSimpanan").innerText=total.toLocaleString("id-ID");
  document.getElementById("infoAnggota").innerText=anggotaUnik.size+" anggota / "+allSimpanan.length+" transaksi";
  document.getElementById("jmlRiwayat").innerText=allSimpanan.length;
  renderRiwayat();
});

window.bukaRiwayat=()=>{document.getElementById("modalRiwayat").classList.add("show"); renderRiwayat();}
window.tutupRiwayat=()=>document.getElementById("modalRiwayat").classList.remove("show");
document.getElementById("modalRiwayat").addEventListener("click",e=>{if(e.target.id==="modalRiwayat") tutupRiwayat();});

function renderRiwayat(){
  const search=(document.getElementById("searchRiwayat").value||"").toLowerCase().trim();
  const fJenis=(document.getElementById("filterJenis").value||"").toLowerCase();
  const fMetode=(document.getElementById("filterMetode").value||"").toLowerCase();
  let arr=[...allSimpanan].sort((a,b)=>Number(b.tanggal||0)-Number(a.tanggal||0));
  if(search) arr=arr.filter(x=> `${x.nama||""} ${x.idAnggota||""}`.toLowerCase().includes(search));
  if(fJenis) arr=arr.filter(x=> String(x.jenis||"").toLowerCase()===fJenis);
  if(fMetode) arr=arr.filter(x=> String(x.metode||"").toLowerCase()===fMetode);
  document.getElementById("jmlTampil").innerText=arr.length+" tampil";
  const list=document.getElementById("listRiwayat");
  if(arr.length===0){list.innerHTML=`<div class="item">Tidak ada data</div>`; return;}
  let html="";
  arr.forEach(d=>{
    const tgl=d.tanggal?new Date(Number(d.tanggal)).toLocaleDateString("id-ID"):"-";
    const warna=d.jenis==="pokok"?"#1e90ff":d.jenis==="wajib"?"#10b981":"#f59e0b";
    html+=`<div class="item"><div style="display:flex;justify-content:space-between"><b>${d.nama||"-"}</b><span style="background:${warna};color:#fff;padding:2px 6px;border-radius:6px;font-size:9px">${(d.jenis||"").toUpperCase()}</span></div><small>${tgl} | ${(d.metode||"").toUpperCase()} | ${d.keterangan||"-"}</small><br><b>Rp ${Number(d.jumlah||0).toLocaleString("id-ID")}</b><div style="display:flex;gap:6px;margin-top:6px"><button style="flex:1;padding:6px" onclick="editItem('${d.id}','${d.jenis}',${d.jumlah},'${d.metode||"cash"}',${d.tanggal||0})">Edit</button><button style="flex:1;padding:6px" class="btn-danger" onclick="hapusItem('${d.id}')">Hapus</button></div></div>`;
  });
  list.innerHTML=html;
}
document.getElementById("searchRiwayat").addEventListener("input",renderRiwayat);
document.getElementById("filterJenis").addEventListener("change",renderRiwayat);
document.getElementById("filterMetode").addEventListener("change",renderRiwayat);

document.getElementById("btnSimpan").onclick=async()=>{
  const sel=document.getElementById("anggotaSelect"); if(!sel.value) return alert("Pilih anggota");
  const anggota=anggotaMap[sel.value]; const jumlah=Number(document.getElementById("jumlah").value); if(!jumlah) return alert("Isi jumlah");
  const jenis=document.getElementById("jenis").value, metode=document.getElementById("metode").value, ket=document.getElementById("keterangan").value||"-", waktu=Date.now();
  const baru=push(simpananRef); await set(baru,{anggotaId:sel.value,idAnggota:anggota.id||"-",nama:anggota.nama,jenis,jumlah,metode,keterangan:ket,tanggal:waktu});
  const kasBaru=push(kasRef); await set(kasBaru,{simpananId:baru.key,anggotaId:sel.value,namaAnggota:anggota.nama,tanggal:waktu,tipe:"masuk",kategori:`simpanan ${jenis}`,sumberKas:metode,jumlah,keterangan:`Simpanan ${jenis} - ${anggota.nama}`});
  document.getElementById("jumlah").value=""; document.getElementById("keterangan").value=""; alert("Berhasil ✅"); bukaRiwayat();
};

window.editItem=(id,jenis,jumlah,metode,tanggal)=>{
  const tglFormat=tanggal?new Date(tanggal).toISOString().split("T")[0]:new Date().toISOString().split("T")[0];
  document.getElementById("modalForm").classList.add("show");
  document.getElementById("modalFormContent").innerHTML=`<h3>Edit</h3><div class="form-group"><label>Tanggal</label><input type="date" id="eTanggal" value="${tglFormat}"></div><div class="form-group"><label>Jenis</label><select id="eJenis"><option value="pokok" ${jenis==="pokok"?"selected":""}>Pokok</option><option value="wajib" ${jenis==="wajib"?"selected":""}>Wajib</option><option value="sukarela" ${jenis==="sukarela"?"selected":""}>Sukarela</option></select></div><div class="form-group"><label>Metode</label><select id="eMetode"><option value="cash" ${metode==="cash"?"selected":""}>Cash</option><option value="bank" ${metode==="bank"?"selected":""}>Bank</option></select></div><div class="form-group"><label>Jumlah</label><input type="number" id="eJumlah" value="${jumlah}"></div><button onclick="simpanEdit('${id}')">Simpan</button><button class="btn-secondary" onclick="tutupModal()" style="margin-top:6px">Batal</button>`;
};
window.simpanEdit=async(id)=>{
  const jenis=document.getElementById("eJenis").value, jumlah=Number(document.getElementById("eJumlah").value), metode=document.getElementById("eMetode").value, tanggal=new Date(document.getElementById("eTanggal").value).getTime();
  await update(ref(db,"/simpanan/"+id),{jenis,jumlah,metode,tanggal});
  const kasItem=kasList.find(k=>k.simpananId===id); if(kasItem) await update(ref(db,"/kas/transaksi/"+kasItem.id),{jumlah,sumberKas:metode,tanggal,kategori:`simpanan ${jenis}`});
  tutupModal(); alert("Update ok");
};
window.hapusItem=async(id)=>{if(!confirm("Hapus?")) return; await remove(ref(db,"/simpanan/"+id)); const k=kasList.find(x=>x.simpananId===id); if(k) await remove(ref(db,"/kas/transaksi/"+k.id)); alert("Dihapus");};
window.tutupModal=()=>document.getElementById("modalForm").classList.remove("show");
</script>
</body>
</html>
